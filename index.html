<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Risen High School - Paper and Notes Maker</title>

<style>
@font-face {
  font-family: "Jameel Noori Nastaleeq";
  src: url("https://cdn.jsdelivr.net/gh/tariq-abdullah/urdu-web-font-CDN/JameelNooriNastaleeq.woff") format("woff");
  font-display: swap;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: #f0f2f5;
  color: #111;
  font-family: Arial, sans-serif;
}

button, input, select, textarea { font: inherit; }
button { cursor: pointer; }

.topbar {
  background: #0b3d91;
  color: white;
  padding: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.topbar h2 { margin: 0; font-size: 20px; }
.topbar button {
  border: 0;
  border-radius: 5px;
  padding: 9px 12px;
  margin: 2px;
  background: white;
  color: #0b3d91;
  font-weight: bold;
}

.main { max-width: 1500px; margin: auto; padding: 12px; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tab {
  padding: 10px 16px;
  border: 1px solid #ccc;
  border-radius: 5px;
  background: white;
  font-weight: bold;
}
.tab.active { background: #0b3d91; color: white; }

.layout {
  display: grid;
  grid-template-columns: minmax(300px, 1fr) minmax(300px, 1fr);
  gap: 12px;
}

.panel {
  background: white;
  border-radius: 8px;
  padding: 14px;
  box-shadow: 0 2px 8px #00000012;
  min-width: 0;
}

.panel h3 { margin-top: 0; }

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.field { display: flex; flex-direction: column; gap: 4px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 13px; font-weight: bold; }
.field input, .field select, .field textarea {
  width: 100%;
  padding: 9px;
  border: 1px solid #bbb;
  border-radius: 5px;
  background: white;
}

.urdu-input {
  font-family: "Jameel Noori Nastaleeq", serif !important;
  direction: rtl;
}

.btn {
  border: 0;
  padding: 9px 12px;
  border-radius: 5px;
  font-weight: bold;
  margin: 3px 2px 3px 0;
}
.primary { background: #0b3d91; color: white; }
.green { background: #16803c; color: white; }
.red { background: #c62828; color: white; }
.orange { background: #e79b00; color: white; }
.grey { background: #e6e6e6; color: #111; }

.editor-section { border-top: 1px solid #ddd; margin-top: 16px; padding-top: 12px; }
.editor-section h3 { margin-bottom: 10px; }

.q-card {
  border: 1px solid #ddd;
  border-radius: 6px;
  padding: 9px;
  margin-bottom: 9px;
  background: #fafafa;
}
.q
