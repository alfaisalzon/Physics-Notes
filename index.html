
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Risen High School Paper Maker</title>

<style>
@font-face {
  font-family: Jameel;
  src: url('https://cdn.jsdelivr.net/gh/tariq-abdullah/urdu-web-font-CDN/JameelNooriNastaleeq.woff');
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: #f2f5fa;
  color: #172033;
  font-family: Jameel, Arial, sans-serif;
}

input, select, textarea, button {
  font-family: Arial, sans-serif;
}

button { cursor: pointer; }

.topbar {
  background: linear-gradient(135deg,#0b3d91,#1457d9);
  color: white;
  padding: 18px;
  text-align: center;
}

.topbar h1 { margin: 0; font-size: 26px; }

.main {
  max-width: 1450px;
  margin: auto;
  padding: 16px;
}

.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
}

.btn {
  border: 0;
  border-radius: 7px;
  padding: 10px 13px;
  font-weight: bold;
  margin: 2px;
}

.blue { background: #1457d9; color: white; }
.green { background: #138a4b; color: white; }
.red { background: #d93636; color: white; }
.gray { background: #e5eaf2; color: #172033; }

.tab {
  flex: 1;
  padding: 12px;
  border: 0;
  border-radius: 8px;
  background: #e1e8f3;
  font-weight: bold;
  font-size: 16px;
}

.tab.active { background: #1457d9; color: white; }

.workspace {
  display: grid;
  grid-template-columns: minmax(300px, 480px) minmax(0, 1fr);
  gap: 15px;
  align-items: start;
}

.panel {
  background: white;
  padding: 16px;
  border-radius: 12px;
  box-shadow: 0 3px 14px #00000012;
  margin-bottom: 15px;
}

.panel h2 {
  font-size: 21px;
  color: #0b3d91;
  margin-top: 0;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.field { margin-bottom: 10px; }
.field.full { grid-column: 1 / -1; }

.field label {
  display: block;
  margin-bottom: 4px;
  font-weight: bold;
}

input, select, textarea {
  width: 100%;
  padding: 10px;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  font-size: 15px;
}

textarea { min-height: 65px; resize: vertical; }

.urdu-input {
  font-family: Jameel, serif !important;
  direction: rtl;
  text-align: right;
  font-size: 18px;
}

.section-box {
  border: 1px solid #d7deea;
  border-radius: 9px;
  margin-top: 15px;
  overflow: hidden;
}

.section-head {
  background: #eef4ff;
  padding: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
}

.section-head h3 { margin: 0; font-size: 18px; }

.items { padding: 9px; }

.item {
  border: 1px solid #dce2ec;
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 9px;
}

.item-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 7px;
}

.mcq-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin-top: 8px;
}

.math-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin: 8px 0;
}

.math-toolbar button {
  padding: 7px 10px;
  border: 1px solid #cbd5e1;
  background: white;
  border-radius: 5px;
}

.preview-panel { min-width: 0; }

.paper-stage {
  background: #dce2eb;
  padding: 12px;
  overflow: auto;
  border-radius: 9px;
}

.a4 {
  width: 210mm;
  min-height: 297mm;
  background: white;
  margin: auto;
  padding: 12mm;
  position: relative;
  color: #111;
  font-family: Jameel, Arial, sans-serif;
  box-shadow: 0 3px 15px #0002;
}

/* Paper header: outer border only */
.paper-header {
  border: 2px solid #111;
  text-align: center;
  padding: 7px;
  margin-bottom: 0;
}

.preview-school {
  font-family: Arial, sans-serif;
  font-size: 23px;
  font-weight: 900;
  direction: ltr;
  padding: 4px;
  overflow-wrap: anywhere;
  border: none;
}

.preview-exam {
  font-size: 21px;
  font-weight: bold;
  padding: 4px;
  border: none;
}

.preview-subject {
  font-size: 19px;
  font-weight: bold;
  padding: 4px;
  border: none;
  direction: inherit;
}

.preview-meta {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  direction: ltr;
  margin-top: 5px;
  border-top: 1px solid #111;
  border-left: 1px solid #111;
  font-family: Arial, sans-serif;
  font-size: 12px;
}

.meta-cell {
  border-right: 1px solid #111;
  border-bottom: 1px solid #111;
  padding: 7px 4px;
  min-height: 30px;
  overflow-wrap: anywhere;
}

.student-row {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr;
  direction: ltr;
  border-left: 1px solid #111;
  margin-bottom: 8px;
  font-family: Arial, sans-serif;
  font-size: 12px;
}

.student-cell {
  border-right: 1px solid #111;
  border-bottom: 1px solid #111;
  border-top: 0;
  padding: 8px 4px;
  min-height: 32px;
  overflow-wrap: anywhere;
}

.paper-section {
  margin-top: 13px;
  direction: inherit;
  text-align: start;
}

.paper-section-title {
  font-weight: bold;
  font-size: 18px;
  border-bottom: 1px solid #111;
  margin-bottom: 7px;
  padding-bottom: 3px;
}

/* Each MCQ appears on its own line */
.mcq-preview {
  display: block;
}

.mcq-preview-item {
  display: block;
  margin-bottom: 10px;
  break-inside: avoid;
  line-height: 1.8;
}

.question-text {
  direction: inherit;
  text-align: start;
  overflow-wrap: anywhere;
}

.mcq-options-preview {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px 12px;
  font-size: 14px;
  margin-top: 4px;
  direction: ltr;
  text-align: left;
  line-height: 1.7;
}

.option-text {
  display: inline;
}

/* Short questions appear in two columns */
.q-row {
  display: inline-flex;
  vertical-align: top;
  width: 49%;
  gap: 5px;
  margin: 0 0 10px;
  line-height: 1.8;
  break-inside: avoid;
  text-align: start;
  align-items: flex-start;
  overflow-wrap: anywhere;
}

.q-number {
  flex: 0 0 auto;
  min-width: 22px;
  font-weight: bold;
}

.long-answer {
  margin-bottom: 12px;
  break-inside: avoid;
  line-height: 1.8;
}

.answer-lines { display: none !important; }

.fill-row {
  margin-bottom: 8px;
  line-height: 1.8;
  text-align: start;
  overflow-wrap: anywhere;
}

.truefalse {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  margin-bottom: 8px;
  line-height: 1.8;
}

.paper-footer {
  margin-top: 35px;
  border-top: 1px solid #555;
  padding-top: 8px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-family: Arial, sans-serif;
  font-size: 11px;
}

.logo-preview {
  max-width: 75px;
  max-height: 65px;
  object-fit: contain;
}

.hidden { display: none !important; }

.saved-card {
  background: white;
  border: 1px solid #d7deea;
  padding: 13px;
  border-radius: 9px;
  margin-bottom: 10px;
}

@media(max-width:950px) {
  .workspace { grid-template-columns: 1fr; }
}

@media(max-width:600px) {
  .main { padding: 8px; }
  .form-grid { grid-template-columns: 1fr; }
  .field.full { grid-column: auto; }
  .tabs { flex-direction: column; }
  .mcq-options { grid-template-columns: 1fr; }
  .paper-stage { padding: 4px; }
}

@page { size: A4; margin: 0; }

@media print {
  body * { visibility: hidden !important; }

  #paperPreview, #paperPreview * {
    visibility: visible !important;
  }

  #paperPreview {
    position: absolute !important;
    left: 0 !important;
    top: 0 !important;
    margin: 0 !important;
    box-shadow: none !important;
  }

  .a4 {
    margin: 0 !important;
    box-shadow: none !important;
  }
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body>

<header class="topbar">
  <h1>The Risen High School</h1>
  <div>Paper and Test Maker</div>
</header>

<main class="main">

<div class="tabs">
  <button class="tab active" id="paperTab" onclick="showTab('paper')">Paper Maker</button>
  <button class="tab" id="savedTab" onclick="showTab('saved')">Saved Papers</button>
</div>

<section id="paperSection">
<div class="workspace">

<div class="panel">
  <h2>پرچے کی معلومات</h2>

  <div class="field">
    <label>Language / زبان</label>
    <select id="paperLanguage" onchange="changeLanguage()">
      <option value="ur">اردو</option>
      <option value="en">English</option>
    </select>
  </div>

  <div class="field">
    <label>School Name</label>
    <input id="schoolName" value="The Risen High School" oninput="updatePaper()">
  </div>

  <div class="field">
    <label>School Logo</label>
    <input id="logoUpload" type="file" accept="image/*" onchange="uploadLogo(event)">
    <button class="btn gray" onclick="removeLogo()">Remove Logo</button>
  </div>

  <div class="form-grid">
    <div class="field">
      <label id="lblExam">امتحان</label>
      <input id="examName" value="ماہانہ ٹیسٹ" oninput="updatePaper()">
    </div>

    <div class="field">
      <label id="lblClass">جماعت</label>
      <input id="paperClass" placeholder="مثلاً 9th" oninput="updatePaper()">
    </div>

    <div class="field">
      <label id="lblSubject">مضمون</label>
      <input id="paperSubject" oninput="updatePaper()">
    </div>

    <div class="field">
      <label id="lblChapter">باب / ٹاپک</label>
      <input id="paperChapter" oninput="updatePaper()">
    </div>

    <div class="field">
      <label id="lblDate">تاریخ</label>
      <input id="paperDate" type="date" oninput="updatePaper()">
    </div>

    <div class="field">
      <label id="lblTime">وقت</label>
      <input id="paperTime" value="2 Hours" oninput="updatePaper()">
    </div>

    <div class="field">
      <label id="lblMarks">کل نمبر</label>
      <input id="totalMarks" type="number" value="50" oninput="updatePaper()">
    </div>

    <div class="field">
      <label id="lblTeacher">استاد</label>
      <input id="teacherName" value="Sir Rana Faisal" oninput="updatePaper()">
    </div>

    <div class="field">
      <label id="lblStudent">طالب علم کا نام</label>
      <input id="studentName" oninput="updatePaper()">
    </div>

    <div class="field">
      <label id="lblRoll">رول نمبر</label>
      <input id="rollNumber" oninput="updatePaper()">
    </div>

    <div class="field">
      <label id="lblSection">سیکشن</label>
      <input id="sectionName" oninput="updatePaper()">
    </div>
  </div>

  <div class="math-toolbar">
    <button onclick="insertSymbol('²')">x²</button>
    <button onclick="insertSymbol('³')">x³</button>
    <button onclick="insertSymbol('√')">√</button>
    <button onclick="insertSymbol('π')">π</button>
    <button onclick="insertSymbol('÷')">÷</button>
    <button onclick="insertSymbol('×')">×</button>
    <button onclick="insertSymbol('±')">±</button>
    <button onclick="insertSymbol('≠')">≠</button>
    <button onclick="insertSymbol('≤')">≤</button>
    <button onclick="insertSymbol('≥')">≥</button>
  </div>

  <div class="section-box">
    <div class="section-head">
      <h3>MCQs</h3>
      <button class="btn green" onclick="addMCQ()">+ Add MCQ</button>
    </div>
    <div class="items" id="mcqItems"></div>
  </div>

  <div class="section-box">
    <div class="section-head">
      <h3>Short Questions</h3>
      <button class="btn green" onclick="addShort()">+ Add</button>
    </div>
    <div class="items" id="shortItems"></div>
  </div>

  <div class="section-box">
    <div class="section-head">
      <h3>Long Questions</h3>
      <button class="btn green" onclick="addLong()">+ Add</button>
    </div>
    <div class="items" id="longItems"></div>
  </div>

  <div class="section-box">
    <div class="section-head">
      <h3>Fill in the Blanks</h3>
      <button class="btn green" onclick="addFill()">+ Add</button>
    </div>
    <div class="items" id="fillItems"></div>
  </div>

  <div class="section-box">
    <div class="section-head">
      <h3>True / False</h3>
      <button class="btn green" onclick="addTF()">+ Add</button>
    </div>
    <div class="items" id="tfItems"></div>
  </div>

  <hr>

  <button class="btn blue" onclick="savePaper()">Save Paper</button>
  <button class="btn green" onclick="saveDraft()">Save Draft</button>
  <button class="btn gray" onclick="loadDraft()">Load Draft</button>
  <button class="btn red" onclick="clearAll()">Clear Questions</button>
</div>

<div class="panel preview-panel">
  <h2>Paper Preview</h2>
  <button class="btn blue" onclick="printDocument()">Print / PDF</button>
  <button class="btn green" onclick="downloadPaper()">Download PNG</button>

  <div class="paper-stage">
    <div class="a4" id="paperPreview"></div>
  </div>
</div>

</div>
</section>

<section id="savedSection" class="hidden">
  <div class="panel">
    <h2>Saved Papers</h2>
    <div id="savedPapersList"></div>
  </div>
</section>

</main>

<script>
const $ = id => document.getElementById(id);

let mcqs = [];
let shorts = [];
let longs = [];
let fills = [];
let tfs = [];
let logoData = '';
let editingPaperId = null;

const words = {
  ur: {
    exam: 'امتحان',
    cls: 'جماعت',
    subject: 'مضمون',
    chapter: 'باب / ٹاپک',
    date: 'تاریخ',
    time: 'وقت',
    marks: 'کل نمبر',
    teacher: 'استاد',
    student: 'طالب علم کا نام',
    roll: 'رول نمبر',
    section: 'سیکشن',
    name: 'نام',
    mcq: 'حصہ اوّل: کثیر الانتخابی سوالات',
    short: 'حصہ دوم: مختصر سوالات',
    long: 'حصہ سوم: تفصیلی سوالات',
    fill: 'خالی جگہیں پُر کریں',
    tf: 'درست / غلط'
  },
  en: {
    exam: 'Exam',
    cls: 'Class',
    subject: 'Subject',
    chapter: 'Chapter / Topic',
    date: 'Date',
    time: 'Time',
    marks: 'Total Marks',
    teacher: 'Teacher',
    student: 'Student Name',
    roll: 'Roll No',
    section: 'Section',
    name: 'Name',
    mcq: 'Section I: Multiple Choice Questions',
    short: 'Section II: Short Questions',
    long: 'Section III: Long Questions',
    fill: 'Fill in the Blanks',
    tf: 'True / False'
  }
};

function lang() {
  return $('paperLanguage').value === 'en' ? 'en' : 'ur';
}

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function formatText(value) {
  return escapeHTML(value).replace(/\n/g, '<br>');
}

function addMCQ(data = {}) {
  mcqs.push({
    question: data.question || '',
    options: data.options || ['', '', '', ''],
    answer: data.answer || ''
  });
  renderMCQs();
  updatePaper();
}

function addShort(data = {}) {
  shorts.push({ question: data.question || '' });
  renderShorts();
  updatePaper();
}

function addLong(data = {}) {
  longs.push({ question: data.question || '' });
  renderLongs();
  updatePaper();
}

function addFill(data = {}) {
  fills.push({ question: data.question || '' });
  renderFills();
  updatePaper();
}

function addTF(data = {}) {
  tfs.push({
    statement: data.statement || '',
    answer: data.answer || ''
  });
  renderTF();
  updatePaper();
}

function deleteItem(type, index) {
  const lists = {
    mcq: mcqs,
    short: shorts,
    long: longs,
    fill: fills,
    tf: tfs
  };

  lists[type].splice(index, 1);

  if (type === 'mcq') renderMCQs();
  if (type === 'short') renderShorts();
  if (type === 'long') renderLongs();
  if (type === 'fill') renderFills();
  if (type === 'tf') renderTF();

  updatePaper();
}

function renderMCQs() {
  $('mcqItems').innerHTML = mcqs.map((m, i) => `
    <div class="item">
      <div class="item-top">
        <strong>MCQ ${i + 1}</strong>
        <button class="btn red" onclick="deleteItem('mcq',${i})">Delete</button>
      </div>

      <textarea class="urdu-input"
        placeholder="سوال لکھیں"
        oninput="mcqs[${i}].question=this.value;updatePaper()">${escapeHTML(m.question)}</textarea>

      <div class="mcq-options">
        ${m.options.map((op, j) => `
          <input class="urdu-input"
            placeholder="Option ${'ABCD'[j]}"
            value="${escapeHTML(op)}"
            oninput="mcqs[${i}].options[${j}]=this.value;updatePaper()">
        `).join('')}
      </div>

      <div class="field">
        <label>Correct Answer</label>
        <select onchange="mcqs[${i}].answer=this.value;updatePaper()">
          <option value="">Select correct answer</option>
          ${['A','B','C','D'].map(a => `
            <option value="${a}" ${m.answer===a?'selected':''}>${a}</option>
          `).join('')}
        </select>
      </div>
    </div>
  `).join('');
}

function renderShorts() {
  $('shortItems').innerHTML = shorts.map((o, i) => `
    <div class="item">
      <div class="item-top">
        <strong>Short Question ${i + 1}</strong>
        <button class="btn red" onclick="deleteItem('short',${i})">Delete</button>
      </div>

      <textarea class="urdu-input"
        placeholder="مختصر سوال لکھیں"
        oninput="shorts[${i}].question=this.value;updatePaper()">${escapeHTML(o.question)}</textarea>
    </div>
  `).join('');
}

function renderLongs() {
  $('longItems').innerHTML = longs.map((o, i) => `
    <div class="item">
      <div class="item-top">
        <strong>Long Question ${i + 1}</strong>
        <button class="btn red" onclick="deleteItem('long',${i})">Delete</button>
      </div>

      <textarea class="urdu-input"
        placeholder="تفصیلی سوال لکھیں"
        oninput="longs[${i}].question=this.value;updatePaper()">${escapeHTML(o.question)}</textarea>
    </div>
  `).join('');
}

function renderFills() {
  $('fillItems').innerHTML = fills.map((o, i) => `
    <div class="item">
      <div class="item-top">
        <strong>Fill Blank ${i + 1}</strong>
        <button class="btn red" onclick="deleteItem('fill',${i})">Delete</button>
      </div>

      <textarea class="urdu-input"
        placeholder="خالی جگہ والا سوال لکھیں"
        oninput="fills[${i}].question=this.value;updatePaper()">${escapeHTML(o.question)}</textarea>
    </div>
  `).join('');
}

function renderTF() {
  $('tfItems').innerHTML = tfs.map((o, i) => `
    <div class="item">
      <div class="item-top">
        <strong>Statement ${i + 1}</strong>
        <button class="btn red" onclick="deleteItem('tf',${i})">Delete</button>
      </div>

      <textarea class="urdu-input"
        placeholder="جملہ لکھیں"
        oninput="tfs[${i}].statement=this.value;updatePaper()">${escapeHTML(o.statement)}</textarea>

      <select onchange="tfs[${i}].answer=this.value;updatePaper()">
        <option value="">Correct answer</option>
        <option value="true" ${o.answer==='true'?'selected':''}>True / درست</option>
        <option value="false" ${o.answer==='false'?'selected':''}>False / غلط</option>
      </select>
    </div>
  `).join('');
}

function updatePaper() {
  const w = words[lang()];
  const get = id => $(id).value.trim();
  const direction = lang() === 'en' ? 'ltr' : 'rtl';
  const alignment = lang() === 'en' ? 'left' : 'right';

  let dateText = get('paperDate');

  if (dateText) {
    const d = new Date(dateText + 'T00:00:00');
    dateText = d.toLocaleDateString('en-GB');
  }

  let html = `
    <div class="paper-header" dir="${direction}">
      ${logoData ? `<img class="logo-preview" src="${logoData}" alt="School Logo">` : ''}

      <div class="preview-school">
        ${escapeHTML(get('schoolName') || 'The Risen High School')}
      </div>

      <div class="preview-exam">
        ${escapeHTML(get('examName') || 'Examination')}
      </div>

      ${get('paperSubject') ? `
        <div class="preview-subject" dir="${direction}">
          ${escapeHTML(get('paperSubject'))}
        </div>
      ` : ''}

      ${get('paperChapter') ? `
        <div dir="${direction}" style="text-align:${alignment}">
          Chapter / Topic: ${escapeHTML(get('paperChapter'))}
        </div>
      ` : ''}

      <div class="preview-meta">
        <div class="meta-cell">Class: ${escapeHTML(get('paperClass'))}</div>
        <div class="meta-cell">Time: ${escapeHTML(get('paperTime'))}</div>
        <div class="meta-cell">Total Marks: ${escapeHTML(get('totalMarks'))}</div>
        <div class="meta-cell">Date: ${escapeHTML(dateText)}</div>
        <div class="meta-cell">Teacher: ${escapeHTML(get('teacherName'))}</div>
        <div class="meta-cell">School: ${escapeHTML(get('schoolName') || 'The Risen High School')}</div>
      </div>
    </div>

    <div class="student-row">
      <div class="student-cell">Name: ${escapeHTML(get('studentName'))}</div>
      <div class="student-cell">Roll No: ${escapeHTML(get('rollNumber'))}</div>
      <div class="student-cell">Section: ${escapeHTML(get('sectionName'))}</div>
      <div class="student-cell">Marks Obtained: ______</div>
    </div>
  `;

  if (mcqs.length) {
    html += `
      <div class="paper-section" dir="${direction}">
        <div class="paper-section-title">${w.mcq}</div>
        <div class="mcq-preview">
    `;

    mcqs.forEach((m, i) => {
      html += `
        <div class="mcq-preview-item">
          <div class="question-text" dir="${direction}">
            <strong>${i + 1}.</strong>
            ${formatText(m.question)}
          </div>

          <div class="mcq-options-preview">
            ${m.options.map((o, j) => `
              <div>
                (${ 'ABCD'[j] })
                <span class="option-text" dir="${direction}">${formatText(o)}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    });

    html += `</div></div>`;
  }

  if (shorts.length) {
    html += `
      <div class="paper-section" dir="${direction}">
        <div class="paper-section-title">${w.short}</div>
    `;

    shorts.forEach((o, i) => {
      html += `
        <div class="q-row" dir="${direction}">
          <div class="q-number">${i + 1}.</div>
          <div class="question-text" dir="${direction}">
            ${formatText(o.question)}
          </div>
        </div>
      `;
    });

    html += `</div>`;
  }

  if (longs.length) {
    html += `
      <div class="paper-section" dir="${direction}">
        <div class="paper-section-title">${w.long}</div>
    `;

    longs.forEach((o, i) => {
      html += `
        <div class="long-answer" dir="${direction}">
          <div class="question-text">
            <strong>${i + 1}.</strong>
            ${formatText(o.question)}
          </div>
        </div>
      `;
    });

    html += `</div>`;
  }

  if (fills.length) {
    html += `
      <div class="paper-section" dir="${direction}">
        <div class="paper-section-title">${w.fill}</div>
    `;

    fills.forEach((o, i) => {
      html += `
        <div class="fill-row" dir="${direction}">
          ${i + 1}. ${formatText(o.question)}
        </div>
      `;
    });

    html += `</div>`;
  }

  if (tfs.length) {
    html += `
      <div class="paper-section" dir="${direction}">
        <div class="paper-section-title">${w.tf}</div>
    `;

    tfs.forEach((o, i) => {
      html += `
        <div class="truefalse" dir="${direction}">
          <div class="question-text">
            ${i + 1}. ${formatText(o.statement)}
          </div>
          <div dir="ltr">
            ☐ True &nbsp; ☐ False
          </div>
        </div>
      `;
    });

    html += `</div>`;
  }

  if (!mcqs.length && !shorts.length && !longs.length && !fills.length && !tfs.length) {
    html += `
      <div style="padding:45px;text-align:center" dir="${direction}">
        ${lang()==='en'
          ? 'Add questions to create your paper.'
          : 'سوال شامل کریں، آپ کا پرچہ یہاں نظر آئے گا۔'}
      </div>
    `;
  }

  html += `
    <div class="paper-footer">
      <span>${escapeHTML(get('schoolName'))}</span>
      <span>Teacher: ${escapeHTML(get('teacherName'))}</span>
      <span>Signature: __________</span>
    </div>
  `;

  $('paperPreview').innerHTML = html;
  $('paperPreview').dir = direction;
  $('paperPreview').style.direction = direction;
  $('paperPreview').style.textAlign = alignment;
}

function changeLanguage() {
  const w = words[lang()];

  $('lblExam').textContent = w.exam;
  $('lblClass').textContent = w.cls;
  $('lblSubject').textContent = w.subject;
  $('lblChapter').textContent = w.chapter;
  $('lblDate').textContent = w.date;
  $('lblTime').textContent = w.time;
  $('lblMarks').textContent = w.marks;
  $('lblTeacher').textContent = w.teacher;
  $('lblStudent').textContent = w.student;
  $('lblRoll').textContent = w.roll;
  $('lblSection').textContent = w.section;

  document.documentElement.lang = lang();
  document.documentElement.dir = lang() === 'ur' ? 'rtl' : 'ltr';

  updatePaper();
}

function insertSymbol(symbol) {
  const active = document.activeElement;
  const inputs = ['paperSubject','paperChapter','examName'];

  let target = inputs.includes(active.id) ? active : null;

  if (!target) {
    target = document.querySelector('.item textarea:focus');
  }

  if (!target) {
    alert('پہلے کسی سوال یا مضمون کے خانے پر کلک کریں۔');
    return;
  }

  const start = target.selectionStart ?? target.value.length;
  const end = target.selectionEnd ?? target.value.length;

  target.value =
    target.value.slice(0, start) +
    symbol +
    target.value.slice(end);

  target.focus();
  target.selectionStart = target.selectionEnd = start + symbol.length;

  target.dispatchEvent(new Event('input', {bubbles:true}));
}

function uploadLogo(event) {
  const file = event.target.files[0];
  if (!file) return;

  if (file.size > 2 * 1024 * 1024) {
    alert('براہ کرم 2 MB سے چھوٹا لوگو منتخب کریں۔');
    event.target.value = '';
    return;
  }

  const reader = new FileReader();

  reader.onload = e => {
    logoData = e.target.result;
    updatePaper();
    autoSave();
  };

  reader.readAsDataURL(file);
}

function removeLogo() {
  logoData = '';
  $('logoUpload').value = '';
  updatePaper();
  autoSave();
}

function getFormData() {
  return {
    schoolName: $('schoolName').value,
    examName: $('examName').value,
    paperClass: $('paperClass').value,
    paperSubject: $('paperSubject').value,
    paperChapter: $('paperChapter').value,
    paperDate: $('paperDate').value,
    paperTime: $('paperTime').value,
    totalMarks: $('totalMarks').value,
    teacherName: $('teacherName').value,
    studentName: $('studentName').value,
    rollNumber: $('rollNumber').value,
    sectionName: $('sectionName').value,
    paperLanguage: $('paperLanguage').value,
    mcqs, shorts, longs, fills, tfs, logoData
  };
}

function loadFormData(d) {
  const ids = [
    'schoolName','examName','paperClass','paperSubject',
    'paperChapter','paperDate','paperTime','totalMarks',
    'teacherName','studentName','rollNumber','sectionName',
    'paperLanguage'
  ];

  ids.forEach(id => {
    if (d[id] !== undefined) {
      $(id).value = d[id];
    }
  });

  mcqs = d.mcqs || [];
  shorts = d.shorts || [];
  longs = d.longs || [];
  fills = d.fills || [];
  tfs = d.tfs || [];
  logoData = d.logoData || '';

  renderMCQs();
  renderShorts();
  renderLongs();
  renderFills();
  renderTF();
  changeLanguage();
  updatePaper();
}

function getSavedPapers() {
  try {
    return JSON.parse(localStorage.getItem('risenSavedPapers') || '[]');
  } catch(e) {
    return [];
  }
}

function savePaper() {
  const title = prompt(
    'پرچے کا نام لکھیں:',
    $('paperSubject').value || $('examName').value || 'New Paper'
  );

  if (title === null) return;

  const saved = getSavedPapers();

  const paper = {
    id: Date.now().toString(),
    title,
    data: getFormData(),
    savedAt: new Date().toLocaleString()
  };

  saved.unshift(paper);

  try {
    localStorage.setItem('risenSavedPapers', JSON.stringify(saved));
    editingPaperId = paper.id;
    alert('پرچہ محفوظ ہوگیا۔');
    renderSavedPapers();
  } catch(e) {
    alert('محفوظ کرنے میں مسئلہ آیا۔ لوگو چھوٹا کرکے دوبارہ کوشش کریں۔');
  }
}

function renderSavedPapers() {
  const saved = getSavedPapers();

  if (!saved.length) {
    $('savedPapersList').innerHTML =
      '<p>ابھی کوئی پرچہ محفوظ نہیں ہے۔</p>';
    return;
  }

  $('savedPapersList').innerHTML = saved.map(p => `
    <div class="saved-card">
      <strong>${escapeHTML(p.title)}</strong><br>
      <small>${escapeHTML(p.savedAt || '')}</small><br>
      <button class="btn blue" onclick="openSavedPaper('${p.id}')">Open / Edit</button>
      <button class="btn red" onclick="deleteSavedPaper('${p.id}')">Delete</button>
    </div>
  `).join('');
}

function openSavedPaper(id) {
  const paper = getSavedPapers().find(p => p.id === id);
  if (!paper) return;

  loadFormData(paper.data);
  editingPaperId = paper.id;
  showTab('paper');
}

function deleteSavedPaper(id) {
  if (!confirm('کیا آپ یہ پرچہ حذف کرنا چاہتے ہیں؟')) return;

  const saved = getSavedPapers().filter(p => p.id !== id);
  localStorage.setItem('risenSavedPapers', JSON.stringify(saved));
  renderSavedPapers();
}

function saveDraft() {
  try {
    localStorage.setItem(
      'risenPaperMakerDraft',
      JSON.stringify(getFormData())
    );
    alert('Draft محفوظ ہوگیا۔');
  } catch(e) {
    alert('Draft محفوظ نہیں ہوسکا۔ لوگو کا سائز کم کرکے کوشش کریں۔');
  }
}

function loadDraft() {
  try {
    const data = localStorage.getItem('risenPaperMakerDraft');

    if (!data) {
      alert('کوئی Draft موجود نہیں۔');
      return;
    }

    loadFormData(JSON.parse(data));
    editingPaperId = null;
    alert('Draft کھل گیا۔');
  } catch(e) {
    alert('Draft لوڈ نہیں ہوسکا۔');
  }
}

function clearAll() {
  if (!confirm('کیا آپ تمام سوالات صاف کرنا چاہتے ہیں؟')) return;

  mcqs = [];
  shorts = [];
  longs = [];
  fills = [];
  tfs = [];

  renderMCQs();
  renderShorts();
  renderLongs();
  renderFills();
  renderTF();

  updatePaper();
  autoSave();
}

function showTab(tab) {
  $('paperSection').classList.toggle('hidden', tab !== 'paper');
  $('savedSection').classList.toggle('hidden', tab !== 'saved');

  $('paperTab').classList.toggle('active', tab === 'paper');
  $('savedTab').classList.toggle('active', tab === 'saved');

  if (tab === 'saved') renderSavedPapers();
}

function printDocument() {
  updatePaper();
  window.print();
}

async function downloadPaper() {
  updatePaper();

  if (typeof html2canvas === 'undefined') {
    alert('PNG کے لیے انٹرنیٹ آن کرکے صفحہ دوبارہ کھولیں۔');
    return;
  }

  try {
    if (document.fonts?.ready) {
      await document.fonts.ready;
    }

    const canvas = await html2canvas($('paperPreview'), {
      scale: 2,
      backgroundColor: '#ffffff',
      useCORS: true
    });

    const link = document.createElement('a');
    link.download = 'The-Risen-High-School-Paper.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch(e) {
    alert('PNG بنانے میں مسئلہ آیا۔ دوبارہ کوشش کریں۔');
  }
}

let autoTimer;

function autoSave() {
  clearTimeout(autoTimer);

  autoTimer = setTimeout(() => {
    try {
      localStorage.setItem(
        'risenPaperMakerAutoSave',
        JSON.stringify(getFormData())
      );
    } catch(e) {}
  }, 700);
}

document.addEventListener('input', autoSave);
document.addEventListener('change', autoSave);

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    e.preventDefault();
    saveDraft();
  }

  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'p') {
    e.preventDefault();
    printDocument();
  }
});

renderMCQs();
renderShorts();
renderLongs();
renderFills();
renderTF();
changeLanguage();
updatePaper();
renderSavedPapers();
</script>

</body>
</html>
