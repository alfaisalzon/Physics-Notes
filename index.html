<!DOCTYPE html><html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>The Risen High School Paper and Notes</title><style>
@font-face{
    font-family:"Jameel Noori Nastaleeq";
    src:url("https://cdn.jsdelivr.net/gh/tariq-abdullah/urdu-web-font-CDN/JameelNooriNastaleeq.woff")
    format("woff");
    font-display:swap;
}

:root{
    --primary:#1457d9;
    --primary2:#0b3d91;
    --secondary:#eef4ff;
    --success:#138a4b;
    --danger:#d93636;
    --warning:#e69b00;
    --dark:#172033;
    --muted:#6b7280;
    --white:#ffffff;
    --border:#d9e0eb;
    --bg:#f3f6fb;
    --paper:#ffffff;
    --shadow:0 8px 30px rgba(0,0,0,.08);
}

*{box-sizing:border-box;}

body{
    margin:0;
    background:var(--bg);
    color:var(--dark);
    font-family:"Jameel Noori Nastaleeq","Noto Nastaliq Urdu","Segoe UI",Arial,sans-serif;
}

input,select,textarea,button{
    font-family:"Segoe UI",Arial,sans-serif;
}

.urdu-input{
    font-family:"Jameel Noori Nastaleeq","Noto Nastaliq Urdu",serif !important;
    direction:rtl;
    text-align:right;
    font-size:18px;
}

button{cursor:pointer;}

.topbar{
    background:linear-gradient(135deg,#0b3d91,#1457d9,#2879ef);
    color:white;
    padding:18px 20px;
    box-shadow:0 4px 20px rgba(0,0,0,.18);
}

.topbar-inner{
    max-width:1500px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo-box{
    width:60px;
    height:60px;
    border-radius:15px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border:3px solid rgba(255,255,255,.7);
}

.logo-box img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.logo-placeholder{
    color:#1457d9;
    font-size:26px;
    font-weight:900;
}

.brand h1{
    margin:0;
    font-size:25px;
}

.brand p{
    margin:4px 0 0;
    opacity:.9;
    font-size:14px;
}

.header-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.header-buttons button{
    border:none;
    border-radius:9px;
    padding:10px 13px;
    background:rgba(255,255,255,.16);
    color:white;
    font-weight:bold;
}

.main{
    max-width:1500px;
    margin:auto;
    padding:20px;
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    background:white;
    padding:8px;
    border-radius:14px;
    box-shadow:var(--shadow);
}

.tab{
    flex:1;
    border:none;
    padding:14px;
    border-radius:10px;
    background:#f1f4f9;
    color:#394150;
    font-size:17px;
    font-weight:bold;
}

.tab.active{
    background:var(--primary);
    color:white;
}

.workspace{
    display:grid;
    grid-template-columns:minmax(330px,520px) minmax(500px,1fr);
    gap:20px;
    align-items:start;
}

.panel{
    background:white;
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:18px;
}

.panel-title{
    margin:0 0 15px;
    font-size:22px;
    color:var(--primary2);
    border-bottom:2px solid var(--secondary);
    padding-bottom:10px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.form-group{margin-bottom:12px;}

.form-group.full{grid-column:1/-1;}

.form-group label{
    display:block;
    font-weight:bold;
    margin-bottom:5px;
}

input,select,textarea{
    width:100%;
    border:1px solid var(--border);
    border-radius:9px;
    padding:10px 12px;
    font-size:15px;
    outline:none;
    background:white;
}

textarea{
    min-height:80px;
    resize:vertical;
}

.section-box{
    margin-top:18px;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
}

.section-head{
    background:#f5f8fd;
    padding:11px 13px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border-bottom:1px solid var(--border);
}

.section-head h3{
    margin:0;
    color:var(--primary2);
    font-size:18px;
}

.add-btn{
    background:var(--success);
    color:white;
    border:none;
    border-radius:8px;
    padding:8px 12px;
    font-weight:bold;
}

.items{padding:10px;}

.item{
    border:1px solid #e1e6ef;
    border-radius:10px;
    padding:12px;
    margin-bottom:10px;
    background:#fff;
}

.item-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
    gap:10px;
}

.item-number{
    font-weight:bold;
    color:var(--primary);
}

.remove-btn{
    border:none;
    background:#fff0f0;
    color:var(--danger);
    padding:6px 9px;
    border-radius:7px;
    font-weight:bold;
}

.mcq-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:8px;
}

.option-wrap{
    display:flex;
    gap:6px;
    align-items:center;
}

.option-letter{
    width:27px;
    height:27px;
    border-radius:50%;
    background:#eaf1ff;
    color:var(--primary);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    flex:none;
}

/* ================= TABLE EDITOR ================= */

.answer-type-box{
    margin-top:10px;
    padding:9px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#f8faff;
}

.table-controls{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    align-items:center;
    margin-top:8px;
}

.table-controls button{
    border:none;
    border-radius:7px;
    padding:6px 10px;
    font-weight:bold;
    background:#e9eef6;
    color:#273449;
}

.table-editor{
    margin-top:9px;
    overflow-x:auto;
}

.table-editor table{
    width:100%;
    border-collapse:collapse;
    min-width:350px;
}

.table-editor td,
.table-editor th{
    border:1px solid #777;
    padding:4px;
}

.table-editor textarea{
    min-height:55px;
    margin:0;
}

.table-preview{
    width:100%;
    border-collapse:collapse;
    margin-top:8px;
    font-size:17px;
}

.table-preview th,
.table-preview td{
    border:1px solid #222;
    padding:7px 9px;
    text-align:right;
    vertical-align:top;
    line-height:1.7;
}

.table-preview th{
    font-weight:bold;
    background:#eef3fb;
}

/* ================= TOOLBAR ================= */

.toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:18px;
    padding-top:15px;
    border-top:1px solid var(--border);
}

.btn{
    border:none;
    border-radius:9px;
    padding:10px 14px;
    font-weight:bold;
    font-size:14px;
}

.btn-primary{background:var(--primary);color:white;}
.btn-success{background:var(--success);color:white;}
.btn-danger{background:var(--danger);color:white;}
.btn-secondary{background:#e9eef6;color:#273449;}
.btn-warning{background:#fff2cc;color:#825f00;}

.preview-panel{
    position:sticky;
    top:10px;
}

.preview-tools{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
}

.preview-tools h2{
    margin:0;
    color:var(--primary2);
}

.paper-stage{
    background:#dce2eb;
    padding:25px 10px;
    border-radius:12px;
    overflow:auto;
    min-height:500px;
}

.a4{
    width:210mm;
    min-height:297mm;
    background:white;
    margin:0 auto;
    padding:14mm;
    color:#111;
    box-shadow:0 5px 25px rgba(0,0,0,.15);
    position:relative;
    font-family:"Jameel Noori Nastaleeq","Noto Nastaliq Urdu",serif;
}

.paper-header{
    text-align:center;
    border-bottom:2px solid #111;
    padding-bottom:7px;
    margin-bottom:8px;
}

.preview-school{
    font-family:"Segoe UI",Arial,sans-serif;
    font-weight:900;
    font-size:22px;
    direction:ltr;
}

.preview-exam{
    font-size:21px;
    font-weight:bold;
}

.preview-meta{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:6px;
    font-family:"Segoe UI",Arial,sans-serif;
    direction:ltr;
    font-size:12px;
    margin-top:7px;
}

.meta-cell{
    border:1px solid #111;
    padding:4px 5px;
    min-height:25px;
}

.student-row{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr;
    direction:ltr;
    margin:8px 0;
    border:1px solid #111;
}

.student-cell{
    min-height:29px;
    padding:5px;
    border-right:1px solid #111;
    font-family:"Segoe UI",Arial,sans-serif;
    font-size:12px;
}

.student-cell:last-child{border-right:none;}

.paper-section{margin-top:13px;}

.paper-section-title{
    font-size:18px;
    font-weight:bold;
    border-bottom:1px solid #111;
    padding-bottom:2px;
    margin-bottom:5px;
}

.mcq-preview{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px 20px;
}

.mcq-preview-item{break-inside:avoid;}

.mcq-options-preview{
    display:grid;
    grid-template-columns:1fr 1fr;
    font-size:14px;
    margin-top:2px;
}

.q-row{
    display:flex;
    gap:7px;
    margin-bottom:8px;
    line-height:1.8;
    break-inside:avoid;
}

.q-number{
    font-weight:bold;
    min-width:25px;
}

.long-answer{
    margin-bottom:12px;
    break-inside:avoid;
}

.answer-lines{
    height:65px;
    margin-top:4px;
    background:repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 22px,
        #999 23px
    );
}

.fill-row{
    margin-bottom:8px;
    line-height:1.8;
}

.truefalse{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    margin-bottom:7px;
}

.tf-options{
    font-family:"Segoe UI",Arial,sans-serif;
    white-space:nowrap;
}

.paper-footer{
    position:absolute;
    bottom:7mm;
    left:14mm;
    right:14mm;
    border-top:1px solid #555;
    padding-top:3px;
    display:flex;
    justify-content:space-between;
    font-family:"Segoe UI",Arial,sans-serif;
    font-size:10px;
}

/* ================= NOTES ================= */

.notes-page{min-height:297mm;}

.notes-title{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    border-bottom:2px solid #111;
    padding-bottom:6px;
}

.notes-info{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:5px;
    margin:10px 0;
}

.notes-info div{
    border:1px solid #222;
    padding:5px;
    font-size:13px;
}

.note-block{
    margin:15px 0;
    break-inside:avoid;
}

.note-heading{
    background:#eef3fb;
    border-right:5px solid #1457d9;
    padding:6px 9px;
    font-size:20px;
    font-weight:bold;
}

.note-question{
    font-size:19px;
    font-weight:bold;
    margin-top:8px;
}

.note-answer{
    font-size:18px;
    line-height:2.05;
    margin-top:4px;
}

.definition{
    border:1px solid #555;
    padding:8px;
    margin-top:8px;
    font-size:18px;
    line-height:2;
}

.keypoints{
    font-size:18px;
    line-height:2;
}

/* ================= NOTES MCQ ================= */

.notes-mcq-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 18px;
    direction:rtl;
}

.notes-mcq-item{
    break-inside:avoid;
    min-width:0;
}

.notes-mcq-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:3px 15px;
    margin-top:3px;
    direction:rtl;
    font-size:17px;
}

.hidden{display:none !important;}

.empty-message{
    text-align:center;
    color:#888;
    padding:20px;
}

.saved-card{
    border:1px solid var(--border);
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
    background:#fff;
    box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.saved-card-title{
    font-size:20px;
    font-weight:bold;
    color:var(--primary2);
    margin-bottom:6px;
}

.saved-card-info{
    color:#555;
    line-height:1.8;
    font-size:15px;
    margin-bottom:10px;
}

.saved-card-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.saved-card-actions .btn{min-width:120px;}

@media(max-width:1000px){
    .workspace{grid-template-columns:1fr;}
    .preview-panel{position:relative;top:auto;}
}

@media(max-width:650px){

    .main{padding:10px;}

    .topbar-inner{
        flex-direction:column;
    }

    .brand{
        justify-content:center;
        text-align:center;
    }

    .tabs{flex-direction:column;}

    .form-grid{grid-template-columns:1fr;}

    .form-group.full{grid-column:auto;}

    .mcq-options{grid-template-columns:1fr;}

    .preview-tools{
        flex-direction:column;
        align-items:stretch;
    }

    .paper-stage{padding:10px 0;}

    .header-buttons{justify-content:center;}

    .header-buttons button{
        flex:1;
        min-width:100px;
    }

    .saved-card-actions{flex-direction:column;}

    .saved-card-actions .btn{width:100%;}

    .notes-mcq-grid{
        grid-template-columns:1fr;
    }
}

@page{
    size:A4;
    margin:0;
}

@media print{

    main.no-print{
        display:block !important;
    }

    body *{
        visibility:hidden !important;
    }

    #printArea,
    #printArea *{
        visibility:visible !important;
    }

    #printArea{
        position:absolute !important;
        left:0 !important;
        top:0 !important;
        width:100% !important;
        display:block !important;
    }

    #notesPrintArea,
    #notesPrintArea *{
        visibility:visible !important;
    }

    #notesPrintArea{
        position:absolute !important;
        left:0 !important;
        top:0 !important;
        width:100% !important;
        display:block !important;
    }

    .a4{
        box-shadow:none !important;
        margin:0 auto !important;
    }

    .topbar.no-print{
        display:none !important;
    }
}

function escapeHTML(value){

if(value===null || value===undefined){
return "";
}

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function nl2br(value){
return escapeHTML(value || "").replace(/\n/g,"<br>");
}

function get(id){
return document.getElementById(id);

function createTable(rows=2,cols=2){

let table=[];

for(let r=0;r<rows;r++){

let row=[];

for(let c=0;c<cols;c++){
row.push("");
}

table.push(row);

}

return table;

}


function normalizeTable(item){

let rows=parseInt(item.tableRows)||2;
let cols=parseInt(item.tableCols)||2;

rows=Math.max(1,Math.min(rows,12));
cols=Math.max(1,Math.min(cols,8));

if(!Array.isArray(item.tableCells)){
item.tableCells=createTable(rows,cols);
}

while(item.tableCells.length<rows){
item.tableCells.push(
Array(cols).fill("")
);
}

item.tableCells=item.tableCells.slice(0,rows);

item.tableCells.forEach(row=>{

if(!Array.isArray(row)){
row=[];
}

while(row.length<cols){
row.push("");
}

row.length=cols;

});

item.tableRows=rows;
item.tableCols=cols;

return item;

}


function changeTableSize(index,rows,cols){

let item=noteBlocks[index];

if(!item){
return;
}

rows=Math.max(1,Math.min(parseInt(rows)||2,12));
cols=Math.max(1,Math.min(parseInt(cols)||2,8));

let old=item.tableCells || [];
let cells=createTable(rows,cols);

for(let r=0;r<Math.min(rows,old.length);r++){

for(let c=0;c<Math.min(cols,(old[r]||[]).length);c++){

cells[r][c]=old[r][c] || "";

}

}

item.tableRows=rows;
item.tableCols=cols;
item.tableCells=cells;

renderNotesEditor();
updateNotes();

}

let item=noteBlocks[index];

normalizeTable(item);

item.tableCells.push(
Array(item.tableCols).fill("")
);

item.tableRows++;

}

return;

if(note.type==="mcq" && !note.mcqAnswer){
note.mcqAnswer="";
}

});

}else{

get("headerLogo").classList.add("hidden");
get("logoPlaceholder").classList.remove("hidden");

}

renderMCQs();
renderShorts();
renderLongs();
renderFills();
renderTF();
renderNotesEditor();

updatePaper();
updateNotes();

if(
data.currentTab==="paper" ||

){

showTab(data.currentTab);

}else{

showTab("paper");

}

alert("Draft load ہو گیا ہے۔");

}catch(e){

/* =====================================================
DOWNLOAD PAPER PNG
===================================================== */

async function downloadPaper(){

updatePaper();

if(typeof html2canvas==="undefined"){

alert(
"Download system load نہیں ہوا۔ Internet ON کرکے صفحہ دوبارہ کھولیں۔"
);

return;

}

try{

if(document.fonts && document.fonts.ready){
await document.fonts.ready;
}

await new Promise(
resolve=>setTimeout(resolve,700)
);

const canvas=await html2canvas(
get("paperPreview"),
{
scale:2,
useCORS:true,
allowTaint:false,
backgroundColor:"#ffffff",
logging:false
}
);

canvas.toBlob(function(blob){

if(!blob){

alert("Paper image نہیں بن سکی۔");
return;

}

const url=URL.createObjectURL(blob);

let subject=
get("paperSubject").value ||
"Paper";

subject=subject.replace(
/[\/:*?"<>|]/g,
"-"
);

const link=document.createElement("a");

link.href=url;

link.download=
"The Risen High School - "+
subject+
".png";

document.body.appendChild(link);

link.click();

link.remove();

setTimeout(
()=>URL.revokeObjectURL(url),
3000
);

alert("Paper PNG download ہو گیا ہے۔");

},"image/png");

}catch(error){

console.error(error);

alert(
"Paper download کرتے وقت مسئلہ آیا۔ دوبارہ کوشش کریں۔"
);

}

}
