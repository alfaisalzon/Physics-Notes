/* =====================================================
   CHAPTER SELECT
===================================================== */

const select=document.getElementById("chapterSelect");

data.forEach((chapter,index)=>{
  const option=document.createElement("option");
  option.value=index;
  option.textContent=chapter.title;
  select.appendChild(option);
});


/* =====================================================
   HTML ESCAPE
===================================================== */

function esc(text){
  return String(text)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}


/* =====================================================
   CREATE PAGE
===================================================== */

function createPage(chapter,number){

  const page=document.createElement("div");
  page.className="page";
  page.dataset.page=number;

  page.innerHTML=`

    <div class="page-header">

      <div class="school">
        The Risen High School
      </div>

      <div class="subject">
        جماعت نہم — طبیعیات (Physics)
      </div>

      <div class="chapter">
        ${esc(chapter.title)}
      </div>

    </div>

    <div class="page-body"></div>

    <div class="footer">
      The Risen High School — 9th Class Physics Notes
    </div>
  `;

  return page;
}


/* =====================================================
   PAGINATION
===================================================== */

function addBlockToPages(block,pages,chapter){

  let page=pages[pages.length-1];
  let body=page.querySelector(".page-body");

  body.appendChild(block);

  /*
     اگر content page سے باہر نکل جائے
     تو block اگلے A4 page پر منتقل ہو جائے گا۔
  */

  if(body.scrollHeight > body.clientHeight){

    body.removeChild(block);

    page=createPage(chapter,pages.length+1);
    pages.push(page);

    page.querySelector(".page-body").appendChild(block);
  }
}


/* =====================================================
   GENERATE NOTES
===================================================== */

function generateNotes(){

  const chapter=data[Number(select.value)];

  const container=document.getElementById("pages");

  container.innerHTML="";

  const pages=[];

  const first=createPage(chapter,1);

  pages.push(first);
  container.appendChild(first);


  /* SHORT QUESTIONS */

  let heading=document.createElement("div");

  heading.className="section-title";
  heading.textContent="مختصر سوالات اور جوابات";

  addBlockToPages(heading,pages,chapter);


  chapter.short.forEach((item,index)=>{

    const block=document.createElement("div");

    block.className="question";

    block.innerHTML=`

      <div class="q">
        سوال ${index+1}: ${esc(item[0])}
      </div>

      <div class="a">
        ${esc(item[1])}
      </div>
    `;

    addBlockToPages(block,pages,chapter);

  });


  /* LONG QUESTIONS */

  let longHeading=document.createElement("div");

  longHeading.className="section-title";
  longHeading.textContent="تفصیلی سوالات اور جوابات";

  addBlockToPages(longHeading,pages,chapter);


  chapter.long.forEach((item,index)=>{

    const block=document.createElement("div");

    block.className="question long-answer";

    let answers="";

    item[1].forEach(paragraph=>{
      answers+=`
        <div class="a">
          ${esc(paragraph)}
        </div>
      `;
    });

    block.innerHTML=`

      <div class="q">
        سوال ${index+1}: ${esc(item[0])}
      </div>

      ${answers}
    `;

    addBlockToPages(block,pages,chapter);

  });


  /* MCQs */

  let mcqHeading=document.createElement("div");

  mcqHeading.className="section-title";
  mcqHeading.textContent="کثیر الانتخابی سوالات (MCQs)";

  addBlockToPages(mcqHeading,pages,chapter);


  chapter.mcq.forEach((item,index)=>{

    const block=document.createElement("div");

    block.className="mcq";

    let options="";

    item[1].forEach((option,optIndex)=>{

      const isCorrect=optIndex===item[2];

      options+=`
        <div class="option ${isCorrect ? "correct":""}">
          ${String.fromCharCode(65+optIndex)}۔ ${esc(option)}
        </div>
      `;

    });

    block.innerHTML=`

      <div class="q">
        سوال ${index+1}: ${esc(item[0])}
      </div>

      <div class="options">
        ${options}
      </div>

      <div style="margin-top:6px;font-weight:bold;color:#16852c">
        درست جواب: ${esc(item[1][item[2]])}
      </div>
    `;

    addBlockToPages(block,pages,chapter);

  });


  pages.forEach((page,i)=>{

    page.querySelector(".footer").textContent=
      "The Risen High School — 9th Class Physics Notes — صفحہ "+(i+1);

    container.appendChild(
      document.createElement("span")
    );

  });

}


/* =====================================================
   DOWNLOAD CURRENT CHAPTER
===================================================== */

async function downloadCurrent(){

  if(!document.querySelector(".page")){
    generateNotes();
  }

  const pages=document.querySelectorAll(".page");

  for(let i=0;i<pages.length;i++){

    const canvas=await html2canvas(pages[i],{
      scale:2,
      useCORS:true,
      backgroundColor:"#ffffff"
    });

    const link=document.createElement("a");

    link.download=
      "The-Risen-Physics-"+(Number(select.value)+1)+"-Page-"+(i+1)+".png";

    link.href=canvas.toDataURL("image/png");

    link.click();

    await new Promise(resolve=>setTimeout(resolve,500));
  }
}


/* =====================================================
   DOWNLOAD ALL PAGES
===================================================== */

async function downloadAll(){

  if(!document.querySelector(".page")){
    generateNotes();
  }

  const pages=document.querySelectorAll(".page");

  for(let i=0;i<pages.length;i++){

    const canvas=await html2canvas(pages[i],{
      scale:2,
      useCORS:true,
      backgroundColor:"#ffffff"
    });

    const link=document.createElement("a");

    link.download=
      "Physics-Notes-Chapter-"+(Number(select.value)+1)+"-A4-"+(i+1)+".png";

    link.href=canvas.toDataURL("image/png");

    link.click();

    await new Promise(resolve=>setTimeout(resolve,700));
  }
}
