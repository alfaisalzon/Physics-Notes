<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Risen High School Paper and Notes</title>

<style>
@font-face{
    font-family:"Jameel Noori Nastaleeq";
    src:url("https://cdn.jsdelivr.net/gh/tariq-abdullah/urdu-web-font-CDN/JameelNooriNastaleeq.woff") format("woff");
    font-display:swap;
}

:root{
    --primary:#1457d9;
    --primary2:#0b3d91;
    --secondary:#eef4ff;
    --success:#138a4b;
    --danger:#d93636;
    --warning:#e69b00;
    --dark:#172033;
    --muted:#6b7280;
    --white:#fff;
    --border:#d9e0eb;
    --bg:#f3f6fb;
    --paper:#fff;
    --shadow:0 8px 30px rgba(0,0,0,.08);
}

*{box-sizing:border-box}

body{
    margin:0;
    background:var(--bg);
    color:var(--dark);
    font-family:"Jameel Noori Nastaleeq","Noto Nastaliq Urdu","Segoe UI",Arial,sans-serif;
}

input,select,textarea,button{
    font-family:"Segoe UI",Arial,sans-serif;
}

.urdu-input{
    font-family:"Jameel Noori Nastaleeq","Noto Nastaliq Urdu",serif!important;
    direction:rtl;
    text-align:right;
    font-size:18px;
}

button{cursor:pointer}

.topbar{
    background:linear-gradient(135deg,#0b3d91,#1457d9,#2879ef);
    color:#fff;
    padding:18px 20px;
    box-shadow:0 4px 20px rgba(0,0,0,.18);
}

.topbar-inner{
    max-width:1500px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo-box{
    width:60px;
    height:60px;
    border-radius:15px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border:3px solid rgba(255,255,255,.7);
}

.logo-box img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.logo-placeholder{
    color:#1457d9;
    font-size:26px;
    font-weight:900;
}

.brand h1{margin:0;font-size:25px}
.brand p{margin:4px 0 0;opacity:.9;font-size:14px}

.header-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.header-buttons button{
    border:none;
    border-radius:9px;
    padding:10px 13px;
    background:rgba(255,255,255,.16);
    color:#fff;
    font-weight:bold;
}

.main{
    max-width:1500px;
    margin:auto;
    padding:20px;
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    background:#fff;
    padding:8px;
    border-radius:14px;
    box-shadow:var(--shadow);
}

.tab{
    flex:1;
    border:none;
    padding:14px;
    border-radius:10px;
    background:#f1f4f9;
    color:#394150;
    font-size:17px;
    font-weight:bold;
}

.tab.active{
    background:var(--primary);
    color:#fff;
}

.workspace{
    display:grid;
    grid-template-columns:minmax(330px,520px) minmax(500px,1fr);
    gap:20px;
    align-items:start;
}

.panel{
    background:#fff;
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:18px;
}

.panel-title{
    margin:0 0 15px;
    font-size:22px;
    color:var(--primary2);
    border-bottom:2px solid var(--secondary);
    padding-bottom:10px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.form-group{margin-bottom:12px}
.form-group.full{grid-column:1/-1}

.form-group label{
    display:block;
    font-weight:bold;
    margin-bottom:5px;
}

input,select,textarea{
    width:100%;
    border:1px solid var(--border);
    border-radius:9px;
    padding:10px 12px;
    font-size:15px;
    outline:none;
    background:#fff;
}

textarea{
    min-height:80px;
    resize:vertical;
}

.section-box{
    margin-top:18px;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
}

.section-head{
    background:#f5f8fd;
    padding:11px 13px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border-bottom:1px solid var(--border);
}

.section-head h3{
    margin:0;
    color:var(--primary2);
    font-size:18px;
}

.add-btn{
    background:var(--success);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:8px 12px;
    font-weight:bold;
}

.items{padding:10px}

.item{
    border:1px solid #e1e6ef;
    border-radius:10px;
    padding:12px;
    margin-bottom:10px;
    background:#fff;
}

.item-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
    gap:10px;
}

.item-number{
    font-weight:bold;
    color:var(--primary);
}

.remove-btn{
    border:none;
    background:#fff0f0;
    color:var(--danger);
    padding:6px 9px;
    border-radius:7px;
    font-weight:bold;
}

.mcq-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:8px;
}

.option-wrap{
    display:flex;
    gap:6px;
    align-items:center;
}

.option-letter{
    width:27px;
    height:27px;
    border-radius:50%;
    background:#eaf1ff;
    color:var(--primary);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    flex:none;
}

.toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:18px;
    padding-top:15px;
    border-top:1px solid var(--border);
}

.btn{
    border:none;
    border-radius:9px;
    padding:10px 14px;
    font-weight:bold;
    font-size:14px;
}

.btn-primary{background:var(--primary);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-secondary{background:#e9eef6;color:#273449}
.btn-warning{background:#fff2cc;color:#825f00}

.preview-panel{
    position:sticky;
    top:10px;
}

.preview-tools{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
}

.preview-tools h2{
    margin:0;
    color:var(--primary2);
}

.paper-stage{
    background:#dce2eb;
    padding:25px 10px;
    border-radius:12px;
    overflow:auto;
    min-height:500px;
}

.a4{
    width:210mm;
    min-height:297mm;
    background:#fff;
    margin:0 auto;
    padding:14mm;
    color:#111;
    box-shadow:0 5px 25px rgba(0,0,0,.15);
    position:relative;
    font-family:"Jameel Noori Nastaleeq","Noto Nastaliq Urdu",serif;
}

.paper-header{
    text-align:center;
    border-bottom:2px solid #111;
    padding-bottom:7px;
    margin-bottom:8px;
}

.preview-school{
    font-family:"Segoe UI",Arial,sans-serif;
    font-weight:900;
    font-size:22px;
    direction:ltr;
}

.preview-exam{
    font-size:21px;
    font-weight:bold;
}

.preview-meta{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:6px;
    font-family:"Segoe UI",Arial,sans-serif;
    direction:ltr;
    font-size:12px;
    margin-top:7px;
}

.meta-cell{
    border:1px solid #111;
    padding:4px 5px;
    min-height:25px;
}

.student-row{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr;
    direction:ltr;
    margin:8px 0;
    border:1px solid #111;
}

.student-cell{
    min-height:29px;
    padding:5px;
    border-right:1px solid #111;
    font-family:"Segoe UI",Arial,sans-serif;
    font-size:12px;
}

.student-cell:last-child{border-right:none}

.paper-section{margin-top:13px}

.paper-section-title{
    font-size:18px;
    font-weight:bold;
    border-bottom:1px solid #111;
    padding-bottom:2px;
    margin-bottom:5px;
}

.mcq-preview{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px 20px;
}

.mcq-preview-item{
    break-inside:avoid;
    page-break-inside:avoid;
}

.mcq-options-preview{
    display:grid;
    grid-template-columns:1fr 1fr;
    font-size:14px;
    margin-top:2px;
}

.q-row{
    display:flex;
    gap:7px;
    margin-bottom:8px;
    line-height:1.8;
    break-inside:avoid;
    page-break-inside:avoid;
}

.q-number{
    font-weight:bold;
    min-width:25px;
}

.long-answer{
    margin-bottom:12px;
    break-inside:avoid;
    page-break-inside:avoid;
}

.answer-lines{
    height:65px;
    margin-top:4px;
    background:repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 22px,
        #999 23px
    );
}

.fill-row{
    margin-bottom:8px;
    line-height:1.8;
}

.truefalse{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    margin-bottom:7px;
    break-inside:avoid;
    page-break-inside:avoid;
}

.tf-options{
    font-family:"Segoe UI",Arial,sans-serif;
    white-space:nowrap;
}

.paper-footer{
    margin-top:18px;
    border-top:1px solid #555;
    padding-top:5px;
    display:flex;
    justify-content:space-between;
    font-family:"Segoe UI",Arial,sans-serif;
    font-size:10px;
}

.notes-page{min-height:297mm}

.notes-title{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    border-bottom:2px solid #111;
    padding-bottom:6px;
}

.notes-info{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:5px;
    margin:10px 0;
}

.notes-info div{
    border:1px solid #222;
    padding:5px;
    font-size:13px;
}

.note-editor{
    border:1px solid #dfe5ef;
    border-radius:10px;
    padding:12px;
    margin-bottom:10px;
    background:#fafcff;
}

.note-block{
    margin:15px 0;
    break-inside:avoid;
    page-break-inside:avoid;
}

.note-heading{
    background:#eef3fb;
    border-right:5px solid #1457d9;
    padding:6px 9px;
    font-size:20px;
    font-weight:bold;
}

.note-question{
    font-size:19px;
    font-weight:bold;
    margin-top:8px;
}

.note-answer{
    font-size:18px;
    line-height:2.05;
    margin-top:4px;
}

.definition{
    border:1px solid #555;
    padding:8px;
    margin-top:8px;
    font-size:18px;
    line-height:2;
}

.keypoints{
    font-size:18px;
    line-height:2;
}

.notes-mcq-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:3px 15px;
    margin-top:3px;
}

.hidden{display:none!important}

.empty-message{
    text-align:center;
    color:#888;
    padding:20px;
}

.saved-card{
    border:1px solid var(--border);
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
    background:#fff;
    box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.saved-card-title{
    font-size:20px;
    font-weight:bold;
    color:var(--primary2);
    margin-bottom:6px;
}

.saved-card-info{
    color:#555;
    line-height:1.8;
    font-size:15px;
    margin-bottom:10px;
}

.saved-card-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.saved-card-actions .btn{min-width:120px}

@media(max-width:1000px){
    .workspace{grid-template-columns:1fr}
    .preview-panel{position:relative;top:auto}
}

@media(max-width:650px){
    .main{padding:10px}
    .topbar-inner{flex-direction:column}
    .brand{justify-content:center;text-align:center}
    .tabs{flex-direction:column}
    .form-grid{grid-template-columns:1fr}
    .form-group.full{grid-column:auto}
    .mcq-options{grid-template-columns:1fr}
    .preview-tools{flex-direction:column;align-items:stretch}
    .paper-stage{padding:10px 0}
    .header-buttons{justify-content:center}
    .header-buttons button{flex:1;min-width:100px}
    .saved-card-actions{flex-direction:column}
    .saved-card-actions .btn{width:100%}
}

/* ================= PRINT FIX ================= */

@page{
    size:A4;
    margin:0;
}

@media print{

    html,body{
        margin:0!important;
        padding:0!important;
        background:#fff!important;
    }

    body *{
        visibility:hidden!important;
    }

    body.print-paper #printArea,
    body.print-paper #printArea *{
        visibility:visible!important;
    }

    body.print-notes #notesPrintArea,
    body.print-notes #notesPrintArea *{
        visibility:visible!important;
    }

    body.print-paper #printArea,
    body.print-notes #notesPrintArea{
        position:absolute!important;
        left:0!important;
        top:0!important;
        width:100%!important;
        margin:0!important;
        padding:0!important;
        background:#fff!important;
    }

    body.print-paper #paperPreview,
    body.print-notes #notesPreview{
        box-shadow:none!important;
        margin:0!important;
    }

    .a4{
        box-shadow:none!important;
    }

    .paper-footer{
        position:static!important;
        margin-top:18px!important;
    }

    .no-print{
        display:none!important;
    }

    .page-break{
        page-break-before:always;
        break-before:page;
    }
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body>

<div class="app">

<header class="topbar no-print">
<div class="topbar-inner">

<div class="brand">
<div class="logo-box">
<img id="headerLogo" class="hidden" alt="School Logo">
<div id="logoPlaceholder" class="logo-placeholder">R</div>
</div>

<div>
<h1>The Risen High School</h1>
<p>Paper & Notes Maker</p>
</div>
</div>

<div class="header-buttons">
<button onclick="savePaper()">📄 Save Paper</button>
<button onclick="saveNotes()">📚 Save Notes</button>
<button onclick="saveDraft()">💾 Save</button>
<button onclick="loadDraft()">📂 Load</button>
<button onclick="clearAll()">🗑 Clear</button>
<button onclick="printDocument()">🖨 Print / PDF</button>
</div>

</div>
</header>

<main class="main no-print">

<div class="tabs">

<button class="tab active" id="paperTab" onclick="showTab('paper')">
📄 Paper Maker
</button>

<button class="tab" id="notesTab" onclick="showTab('notes')">
📚 Notes Maker
</button>

<button class="tab" id="savedPapersTab" onclick="showTab('savedPapers')">
💾 Saved Papers
</button>

<button class="tab" id="savedNotesTab" onclick="showTab('savedNotes')">
📝 Saved Notes
</button>

</div>

<!-- ================= PAPER ================= -->

<section id="paperSection">

<div class="workspace">

<div class="panel">

<h2 class="panel-title">📄 Paper Settings</h2>

<div class="form-grid">

<div class="form-group full">
<label>School Name</label>
<input id="schoolName" value="The Risen High School" oninput="updatePaper()">
</div>

<div class="form-group">
<label>Exam / Test</label>
<input id="examName" value="Monthly Test" oninput="updatePaper()">
</div>

<div class="form-group">
<label>Class</label>
<select id="paperClass" onchange="updatePaper()">
<option>Playgroup</option>
<option>Nursery</option>
<option>Prep</option>
<option>1st</option>
<option>2nd</option>
<option>3rd</option>
<option>4th</option>
<option>5th</option>
<option>6th</option>
<option>7th</option>
<option>8th</option>
<option selected>9th</option>
<option>10th</option>
<option>11th / FA Part 1</option>
<option>12th / FA Part 2</option>
</select>
</div>

<div class="form-group">
<label>Subject</label>
<input id="paperSubject" placeholder="مثلاً طبیعیات" oninput="updatePaper()">
</div>

<div class="form-group">
<label>Chapter / Unit</label>
<input id="paperChapter" placeholder="Chapter 1" oninput="updatePaper()">
</div>

<div class="form-group">
<label>Date</label>
<input type="date" id="paperDate" onchange="updatePaper()">
</div>

<div class="form-group">
<label>Time</label>
<input id="paperTime" value="2 Hours" oninput="updatePaper()">
</div>

<div class="form-group">
<label>Total Marks</label>
<input type="number" id="totalMarks" value="50" oninput="updatePaper()">
</div>

</div>

<div class="section-box">
<div class="section-head">
<h3>👨‍🎓 Student Information</h3>
</div>

<div class="items">
<div class="form-grid">

<div class="form-group">
<label>Student Name</label>
<input id="studentName" placeholder="نام طالب علم" oninput="updatePaper()">
</div>

<div class="form-group">
<label>Roll Number</label>
<input id="rollNumber" oninput="updatePaper()">
</div>

<div class="form-group">
<label>Section</label>
<input id="sectionName" oninput="updatePaper()">
</div>

<div class="form-group">
<label>Teacher</label>
<input id="teacherName" value="Sir Rana Faisal" oninput="updatePaper()">
</div>

</div>
</div>
</div>

<div class="section-box">
<div class="section-head">
<h3>🏫 School Logo</h3>
</div>
<div class="items">
<input type="file" id="logoUpload" accept="image/*" onchange="uploadLogo(event)">
</div>
</div>

<div class="section-box">
<div class="section-head">
<h3>① MCQs</h3>
<button class="add-btn" onclick="addMCQ()">+ Add MCQ</button>
</div>
<div id="mcqEditor" class="items"></div>
</div>

<div class="section-box">
<div class="section-head">
<h3>② Short Questions</h3>
<button class="add-btn" onclick="addShort()">+ Add Question</button>
</div>
<div id="shortEditor" class="items"></div>
</div>

<div class="section-box">
<div class="section-head">
<h3>③ Long Questions</h3>
<button class="add-btn" onclick="addLong()">+ Add Question</button>
</div>
<div id="longEditor" class="items"></div>
</div>

<div class="section-box">
<div class="section-head">
<h3>④ Fill in the Blanks</h3>
<button class="add-btn" onclick="addFill()">+ Add</button>
</div>
<div id="fillEditor" class="items"></div>
</div>

<div class="section-box">
<div class="section-head">
<h3>⑤ True / False</h3>
<button class="add-btn" onclick="addTF()">+ Add</button>
</div>
<div id="tfEditor" class="items"></div>
</div>

<div class="toolbar">
<button class="btn btn-primary" onclick="updatePaper()">🔄 Update Preview</button>
<button class="btn btn-success" onclick="printDocument()">🖨 Print / Save PDF</button>
<button class="btn btn-warning" onclick="downloadPaper()">📥 Download Paper</button>
<button class="btn btn-secondary" onclick="saveDraft()">💾 Save Draft</button>
</div>

</div>

<div class="panel preview-panel">

<div class="preview-tools">
<h2>👁 Live Preview</h2>

<div>
<button class="btn btn-primary" onclick="printDocument()">Print A4</button>
<button class="btn btn-warning" onclick="downloadPaper()">📥 Download</button>
</div>

</div>

<div class="paper-stage">
<div id="printArea">
<div id="paperPreview" class="a4"></div>
</div>
</div>

</div>

</div>
</section>

<!-- ================= NOTES ================= -->

<section id="notesSection" class="hidden">

<div class="workspace">

<div class="panel">

<h2 class="panel-title">📚 Notes Settings</h2>

<div class="form-grid">

<div class="form-group full">
<label>School Name</label>

<option>6th</option>

<option>11th / FA Part 1</option>
<option>12th / FA Part 2</option>
</select>
</div>

<label>Subject</label>

<div class="form-group">
<label>Chapter</label>
<input id="notesChapter" placeholder="باب نمبر" oninput="updateNotes()">

<div class="form-group">

+ Add Note
</button>
</div>

</div>

<div class="toolbar">

/* =====================================================

function get(id){

function escapeHTML(value){
    if(value===null || value===undefined) return "";
    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function nl2br(value){
    return escapeHTML(value || "").replace(/\n/g,"<br>");
}

function safeJSON(value){
    try{
        return JSON.parse(value);
    }catch(e){
        return null;
    }
}

function safeSet(key,value){
    try{
        localStorage.setItem(key,JSON.stringify(value));
        return true;
    }catch(e){
        console.error(e);
        alert("Data save نہیں ہو سکا۔ ممکن ہے browser storage بھر گئی ہو۔");
        return false;
    }
}

        if(note.type==="points"){

            const points=(note.points || "")
            .split("\n")
            .filter(x=>x.trim()!=="");

            html+=`

            </div>

            <div class="keypoints">

            `;
        }

        if(note.type==="text"){

            html+=`
            <div class="note-block">

            <div class="note-answer">

            </div>

            </div>
            `;
        }

        if(note.type==="mcq"){

        editingNotesId=null;
    }

    const newNotes={

        title:title,

        savedAt:new Date().toLocaleString(),

        data:notesData

/* =====================================================
DOWNLOAD PAPER
===================================================== */

async function downloadPaper(){

    updatePaper();

    if(typeof html2canvas==="undefined"){

        alert(
            "Download system load نہیں ہوا۔ Internet ON کرکے صفحہ دوبارہ کھولیں۔"
        );

        return;
    }

    try{

        if(document.fonts && document.fonts.ready){
            await document.fonts.ready;
        }

        await new Promise(resolve=>setTimeout(resolve,700));

        const canvas=await html2canvas(
            get("paperPreview"),
            {
                scale:2,
                useCORS:true,
                allowTaint:false,
                backgroundColor:"#ffffff",
                logging:false
            }
        );

        canvas.toBlob(function(blob){

            if(!blob){

                alert("Paper image نہیں بن سکی۔");
                return;
            }

            const url=URL.createObjectURL(blob);

            let subject=get("paperSubject").value || "Paper";

            subject=subject.replace(
                /[\\/:*?"<>|]/g,
                "-"
            );

            const link=document.createElement("a");

            link.href=url;

            link.download=
            "The Risen High School - "+
            subject+
            ".png";

            document.body.appendChild(link);

            link.click();

            link.remove();

            setTimeout(
                ()=>URL.revokeObjectURL(url),
                3000
            );

        },"image/png");

    }catch(error){

        console.error(error);

        alert(
            "Paper download کرتے وقت مسئلہ آیا۔ دوبارہ کوشش کریں۔"
        );
    }
}

                    if(clonedNotes){

                        clonedNotes.style.width="210mm";
                        clonedNotes.style.minHeight="297mm";
                        clonedNotes.style.height="auto";
                        clonedNotes.style.overflow="visible";
                        clonedNotes.style.boxShadow="none";
                        clonedNotes.style.margin="0 auto";
                    }
                }
            }
        );

        canvas.toBlob(function(blob){

            if(!blob){

                alert("Notes کی PNG تصویر نہیں بن سکی۔");
                return;
            }

            const url=URL.createObjectURL(blob);

            let subject=
            get("notesSubject").value ||
            "Notes";

            let chapter=
            get("notesChapter").value ||
            "";

            subject=subject.replace(
                /[\\/:*?"<>|]/g,
                "-"
            );

            chapter=chapter.replace(
                /[\\/:*?"<>|]/g,
                "-"
            );

            let fileName=
            "The Risen High School - "+
            subject;

            if(chapter){
                fileName+=" - "+chapter;
            }

            fileName+=" - Notes.png";

            const link=document.createElement("a");

            link.href=url;
            link.download=fileName;

            document.body.appendChild(link);

            link.click();

            link.remove();

            setTimeout(
                ()=>URL.revokeObjectURL(url),
                3000
            );

            alert("Notes کی PNG تصویر ڈاؤن لوڈ ہو گئی ہے۔");

        },"image/png");

    }catch(error){

        console.error(error);

        alert(
            "Notes download کرتے وقت مسئلہ آیا۔ دوبارہ کوشش کریں۔"
        );
    }
}


/* =====================================================
PRINT - FIXED
===================================================== */

function printDocument(){

    /*
       پرانے print system میں صرف #printArea visible تھا،
       اس لیے Notes print نہیں ہوتے تھے۔

       اب body class کے ذریعے Paper یا Notes منتخب ہوتا ہے۔
    */

    document.body.classList.remove(
        "print-paper",
        "print-notes"
    );

    if(currentTab==="notes"){

        updateNotes();

        document.body.classList.add("print-notes");

        document.title=
        "The Risen High School - Notes";

    }else{

        updatePaper();

        document.body.classList.add("print-paper");

        document.title=
        "The Risen High School - Paper";
    }

    setTimeout(()=>{
        window.print();
    },100);
}


/*
   Print مکمل ہونے کے بعد screen دوبارہ normal۔
*/

window.addEventListener("afterprint",function(){

    document.body.classList.remove(
        "print-paper",
        "print-notes"
    );

    document.title=
    "The Risen High School Paper and Notes";
});


/* =====================================================
INPUT / CHANGE AUTO SAVE
===================================================== */

document.addEventListener("input",function(){
    autoSave();
});

document.addEventListener("change",function(){
    autoSave();
});


/* =====================================================
KEYBOARD SHORTCUTS
===================================================== */

document.addEventListener("keydown",function(e){

    if(
        (e.ctrlKey || e.metaKey) &&
        e.key.toLowerCase()==="s"
    ){

        e.preventDefault();

        /*
           Ctrl+S current tab کے مطابق Save کرے گا۔
        */

        if(currentTab==="notes"){
            saveNotes();
        }else{
            saveDraft();
        }
    }

    if(
        (e.ctrlKey || e.metaKey) &&
        e.key.toLowerCase()==="p"
    ){

        e.preventDefault();

        printDocument();
    }

});


/* =====================================================
INITIALIZE
===================================================== */

setToday();

renderMCQs();
renderShorts();
renderLongs();
renderFills();
renderTF();
renderNotesEditor();

updatePaper();
updateNotes();

renderSavedPapers();
renderSavedNotes();

/*
   Page open ہونے پر AutoSave restore۔
   Saved Papers/Notes پہلے سے محفوظ data کو delete نہیں کرتا۔
*/

restoreAutoSave();

renderSavedPapers();
renderSavedNotes();

</script>
