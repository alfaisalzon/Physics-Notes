<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>The Risen High School - Paper & Notes Maker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    font-family:"Noto Naskh Arabic",serif;
    background:#eef3f8;
    color:#172033;
}

button,input,select,textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.topbar{
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:white;
    padding:18px 15px;
}

.topbar-inner{
    width:100%;
    max-width:1500px;
    margin:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:15px;
}

.brand{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.logo-box{
    width:70px;
    height:70px;
    border-radius:50%;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    margin-bottom:7px;
}

.logo-box img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.logo-placeholder{
    color:#0d47a1;
    font-size:38px;
    font-weight:bold;
}

.brand-text{
    width:100%;
    text-align:center;
}

.brand h1{
    margin:0;
    font-size:28px;
    text-align:center;
}

.brand p{
    margin:3px 0 0;
    font-size:15px;
    text-align:center;
}

.header-buttons{
    width:100%;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:7px;
}

.header-buttons button{
    border:0;
    border-radius:8px;
    padding:8px 13px;
    background:white;
    color:#0d47a1;
    font-weight:bold;
}

.container{
    width:100%;
    max-width:1500px;
    margin:auto;
    padding:15px;
}

.tabs{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:15px;
}

.tab{
    border:0;
    background:white;
    color:#164b85;
    padding:11px 18px;
    border-radius:9px;
    font-weight:bold;
    box-shadow:0 2px 8px #0001;
}

.tab.active{
    background:#1976d2;
    color:white;
}

.workspace{
    display:grid;
    grid-template-columns:430px 1fr;
    gap:15px;
    align-items:start;
}

.panel{
    background:white;
    border-radius:12px;
    padding:16px;
    box-shadow:0 2px 12px #0001;
}

.panel h2{
    margin-top:0;
    color:#0d47a1;
    font-size:21px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    font-weight:bold;
    font-size:14px;
}

.field input,
.field select,
.field textarea{
    width:100%;
    padding:9px;
    border:1px solid #ccd6e2;
    border-radius:7px;
    outline:none;
    background:#fff;
}

.field textarea{
    min-height:90px;
    resize:vertical;
}

.section-title{
    margin-top:18px;
    padding:8px 10px;
    background:#e8f1fb;
    border-right:5px solid #1976d2;
    font-weight:bold;
}

.action-row{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:12px;
}

.primary{
    background:#1976d2;
    color:white;
    border:0;
    padding:9px 15px;
    border-radius:7px;
}

.success{
    background:#2e7d32;
    color:white;
    border:0;
    padding:9px 15px;
    border-radius:7px;
}

.danger{
    background:#c62828;
    color:white;
    border:0;
    padding:9px 15px;
    border-radius:7px;
}

.gray{
    background:#607d8b;
    color:white;
    border:0;
    padding:9px 15px;
    border-radius:7px;
}

.question-box,
.note-box{
    border:1px solid #d5dde7;
    border-radius:9px;
    padding:12px;
    margin-top:10px;
    background:#fafcff;
}

.question-head,
.note-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
}

.question-number{
    font-weight:bold;
    color:#0d47a1;
}

.remove-btn{
    background:#ef5350;
    color:white;
    border:0;
    border-radius:6px;
    padding:5px 9px;
}

.mcq-option{
    display:flex;
    gap:6px;
    margin-top:6px;
}

.mcq-option input{
    flex:1;
}

.preview-tools{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:10px;
}

.paper-stage{
    background:#dce4ec;
    padding:20px;
    min-height:700px;
    overflow:auto;
}

.a4{
    width:210mm;
    min-height:297mm;
    margin:auto;
    padding:14mm;
    background:white;
    box-shadow:0 2px 12px #0003;
    color:#111;
}

.paper-school{
    text-align:center;
    border-bottom:2px solid #222;
    padding-bottom:8px;
    margin-bottom:10px;
}

.paper-school h1{
    margin:0;
    font-size:24px;
}

.paper-school p{
    margin:2px 0;
}

.paper-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px 15px;
    margin-bottom:12px;
    font-size:14px;
}

.paper-question{
    margin:12px 0;
    line-height:1.8;
}

.paper-question b{
    color:#111;
}

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:3px 20px;
    margin-top:3px;
    padding-right:20px;
}

.saved-section{
    display:none;
}

.saved-section.active{
    display:block;
}

.saved-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.saved-card{
    background:white;
    border-radius:12px;
    padding:15px;
    box-shadow:0 2px 10px #0001;
}

.saved-card h3{
    margin-top:0;
    color:#0d47a1;
}

.saved-item{
    border:1px solid #d5dde7;
    border-radius:8px;
    padding:10px;
    margin-top:8px;
    background:#fafcff;
}

.saved-item-title{
    font-weight:bold;
}

.saved-date{
    color:#666;
    font-size:12px;
}

.saved-actions{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:7px;
}

.saved-actions button{
    border:0;
    border-radius:6px;
    padding:5px 8px;
    color:white;
}

.open-btn{
    background:#1976d2;
}

.print-btn{
    background:#455a64;
}

.download-btn{
    background:#2e7d32;
}

.delete-btn{
    background:#c62828;
}

.modal{
    position:fixed;
    inset:0;
    background:#0008;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:430px;
    background:white;
    border-radius:12px;
    padding:20px;
}

.modal-box h2{
    margin-top:0;
    color:#0d47a1;
}

.modal-box input{
    width:100%;
    padding:11px;
    border:1px solid #ccd6e2;
    border-radius:7px;
}

.notes-preview{
    line-height:2;
}

.notes-preview h1,
.notes-preview h2,
.notes-preview h3{
    color:#0d47a1;
}

.hidden{
    display:none!important;
}

@media(max-width:900px){

    .workspace{
        grid-template-columns:1fr;
    }

    .saved-grid{
        grid-template-columns:1fr;
    }

    .paper-stage{
        padding:5px;
    }

    .a4{
        transform-origin:top center;
        width:210mm;
    }
}

@media(max-width:600px){

    .brand h1{
        font-size:23px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .header-buttons{
        width:100%;
        justify-content:center;
    }

    .header-buttons button{
        font-size:12px;
        padding:7px 9px;
    }

}

@page{
    size:A4;
    margin:0;
}

@media print{

    body{
        background:white!important;
    }

    .no-print{
        display:none!important;
    }

    .a4{
        width:210mm!important;
        min-height:297mm!important;
        margin:0!important;
        padding:14mm!important;
        box-shadow:none!important;
    }

    .paper-stage{
        padding:0!important;
        background:white!important;
    }
}

</style>
</head>

<body>

<header class="topbar no-print">

<div class="topbar-inner">

<div class="logo-box">

<!-- PAPER MAKER -->

<script>

let currentTab="paper";

let saveType="";

let questions=[];

let notes=[];

let editingSavedId=null;


/* ---------- HELPERS ---------- */

function get(id){
    return document.getElementById(id);
}

function esc(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* ---------- TABS ---------- */

function showTab(tab){

    currentTab=tab;

    get("paperSection").classList.add("hidden");
    get("notesSection").classList.add("hidden");
    get("savedSection").classList.remove("active");

    get("paperTab").classList.remove("active");
    get("notesTab").classList.remove("active");
    get("savedTab").classList.remove("active");

    if(tab==="paper"){

        get("paperSection").classList.remove("hidden");
        get("paperTab").classList.add("active");
        updatePaper();

    }

    if(tab==="notes"){

        get("notesSection").classList.remove("hidden");
        get("notesTab").classList.add("active");
        updateNotes();

    }

    if(tab==="saved"){

        get("savedSection").classList.add("active");
        get("savedTab").classList.add("active");
        renderSaved();

    }

}


/* ---------- PAPER QUESTIONS ---------- */

function addQuestion(type){

    questions.push({
        id:Date.now()+Math.random(),
        type:type,
        text:"",
        options:["","","",""],
        answer:""
    });

    renderQuestions();
}


function renderQuestions(){

    let html="";

    questions.forEach((q,index)=>{

        html+=`
        <div class="question-box">

        <div class="question-head">

        <div class="question-number">
        سوال نمبر ${index+1} — ${questionTypeName(q.type)}
        </div>

        <button class="remove-btn" onclick="removeQuestion(${index})">
        حذف
        </button>

        </div>

        <div class="field" style="margin-top:8px">

        <label>Question</label>

        <textarea oninput="questions[${index}].text=this.value;updatePaper()">${esc(q.text)}</textarea>

        </div>
        `;


        if(q.type==="mcq"){

            html+=`<div style="margin-top:8px;font-weight:bold">Options</div>`;

            q.options.forEach((op,i)=>{

                html+=`
                <div class="mcq-option">

                <b>${String.fromCharCode(65+i)}.</b>

                <input
                value="${esc(op)}"
                oninput="questions[${index}].options[${i}]=this.value;updatePaper()"
                >

                </div>
                `;

            });

        }


        if(q.type==="tf"){

            html+=`

            <div class="field" style="margin-top:8px">

            <label>Correct Answer</label>

            <select onchange="questions[${index}].answer=this.value;updatePaper()">

            <option value="">Select</option>
            <option value="True" ${q.answer==="True"?"selected":""}>True</option>
            <option value="False" ${q.answer==="False"?"selected":""}>False</option>

            </select>

            </div>

            `;

        }


        if(q.type==="fill" || q.type==="short" || q.type==="long"){

            html+=`

            <div class="field" style="margin-top:8px">

            <label>Answer / Key</label>

            <textarea
            oninput="questions[${index}].answer=this.value"
            >${esc(q.answer)}</textarea>

            </div>

            `;

        }


        html+=`</div>`;

    });

    get("questions").innerHTML=html;

    updatePaper();
}


function questionTypeName(type){

    if(type==="mcq") return "MCQ";
    if(type==="short") return "Short Question";
    if(type==="long") return "Long Question";
    if(type==="fill") return "Fill in the Blank";
    if(type==="tf") return "True / False";

    return "";

}


function removeQuestion(index){

    questions.splice(index,1);

    renderQuestions();

}


/* ---------- PAPER PREVIEW ---------- */

function updatePaper(){

    let html="";

    html+=`

    <div class="paper-school">

    <h1>${esc(get("school").value || "The Risen High School")}</h1>

    <p>${esc(get("exam").value)}</p>

    <p>
    ${esc(get("className").value)}
    — 
    ${esc(get("subject").value)}
    </p>

    </div>


    <div class="paper-info">

    <div><b>Chapter:</b> ${esc(get("chapter").value)}</div>

    <div><b>Date:</b> ${esc(get("date").value)}</div>

    <div><b>Time:</b> ${esc(get("time").value)}</div>

    <div><b>Total Marks:</b> ${esc(get("marks").value)}</div>

    <div><b>Name:</b> ${esc(get("studentName").value)}</div>

    <div><b>Roll No:</b> ${esc(get("rollNumber").value)}</div>

    <div><b>Section:</b> ${esc(get("section").value)}</div>

    <div><b>Teacher:</b> ${esc(get("teacher").value)}</div>

    </div>

    `;


    questions.forEach((q,index)=>{

        html+=`

        <div class="paper-question">

        <b>${index+1}. ${esc(q.text)}</b>

        `;


        if(q.type==="mcq"){

            html+=`<div class="options">`;

            q.options.forEach((op,i)=>{

                html+=`

                <div>
                ${String.fromCharCode(65+i)}. ${esc(op)}
                </div>

                `;

            });

            html+=`</div>`;

        }


        if(q.type==="fill"){

            html+=`<div style="margin-top:15px">______________________________</div>`;

        }


        if(q.type==="short"){

            html+=`<div style="height:65px;border-bottom:1px dashed #999"></div>`;

        }


        if(q.type==="long"){

            html+=`

            <div style="height:150px;border-bottom:1px dashed #999"></div>

            `;

        }


        if(q.type==="tf"){

            html+=`

            <div style="margin-top:5px">
            True / False: __________________
            </div>

            `;

        }


        html+=`</div>`;

    });


    if(questions.length===0){

        html+=`
        <p style="text-align:center;margin-top:100px">
        ابھی کوئی سوال شامل نہیں کیا گیا۔
        </p>
        `;

    }

/* ---------- NOTES ---------- */

function addNote(type){

    notes.push({
        id:Date.now()+Math.random(),
        type:type,
        title:"",
        question:"",
        answer:"",
        text:"",
        options:["","","",""]
    });

    renderNotes();

}


function renderNotes(){

    let html="";

    notes.forEach((n,index)=>{

        html+=`

        <div class="note-box">

        <div class="note-head">

        <b>Note ${index+1} — ${noteTypeName(n.type)}</b>

        <button class="remove-btn" onclick="removeNote(${index})">
        حذف
        </button>

        </div>

        `;


        if(n.type==="heading"){

            html+=`

            <div class="field">

            <label>Heading</label>

            <input
            value="${esc(n.title)}"
            oninput="notes[${index}].title=this.value;updateNotes()"
            >

            </div>

            `;

        }


        if(n.type==="qa"){

            html+=`

            <div class="field">

            <label>Question</label>

            <input
            value="${esc(n.question)}"
            oninput="notes[${index}].question=this.value;updateNotes()"
            >

            </div>

            <div class="field">

            <label>Answer</label>

            <textarea
            oninput="notes[${index}].answer=this.value;updateNotes()"
            >${esc(n.answer)}</textarea>

            </div>

            `;

        }


        if(n.type==="definition"){

            html+=`

            <div class="field">

            <label>Term / Heading</label>

            <input
            value="${esc(n.title)}"
            oninput="notes[${index}].title=this.value;updateNotes()"
            >

            </div>

            <div class="field">

            <label>Definition</label>

            <textarea
            oninput="notes[${index}].text=this.value;updateNotes()"
            >${esc(n.text)}</textarea>

            </div>

            `;

        }


        if(n.type==="points" || n.type==="detail"){

            html+=`

            <div class="field">

            <label>Heading</label>

            <input
            value="${esc(n.title)}"
            oninput="notes[${index}].title=this.value;updateNotes()"
            >

            </div>

            <div class="field">

            <label>Text</label>

            <textarea
            oninput="notes[${index}].text=this.value;updateNotes()"
            >${esc(n.text)}</textarea>

            </div>

            `;

        }


        if(n.type==="mcq"){

            html+=`

            <div class="field">

            <label>Question</label>

            <textarea
            oninput="notes[${index}].question=this.value;updateNotes()"
            >${esc(n.question)}</textarea>

            </div>

            `;

            n.options.forEach((op,i)=>{

                html+=`

                <div class="mcq-option">

                <b>${String.fromCharCode(65+i)}.</b>

                <input
                value="${esc(op)}"
                oninput="notes[${index}].options[${i}]=this.value;updateNotes()"
                >

                </div>

                `;

            });

        }


        html+=`</div>`;

    });

    get("notes").innerHTML=html;

    updateNotes();

}


function noteTypeName(type){

    if(type==="heading") return "Heading";
    if(type==="qa") return "Question / Answer";
    if(type==="definition") return "Definition";
    if(type==="points") return "Key Points";
    if(type==="detail") return "Detailed Text";
    if(type==="mcq") return "MCQ";

    return "";

}


function removeNote(index){

    notes.splice(index,1);

    renderNotes();

}


function updateNotes(){

    let html=`

    <div class="paper-school">

    <h1>${esc(get("nschool").value || "The Risen High School")}</h1>

    <p>
    ${esc(get("nclass").value)}
    —
    ${esc(get("nsubject").value)}
    </p>

    <p>
    ${esc(get("nchapter").value)}
    </p>

    </div>

    `;


    notes.forEach((n,index)=>{

        if(n.type==="heading"){

            html+=`
            <h2>${esc(n.title)}</h2>
            `;

        }


        if(n.type==="qa"){

            html+=`

            <h3>${index+1}. ${esc(n.question)}</h3>

            <p>${esc(n.answer)}</p>

            `;

        }


        if(n.type==="definition"){

            html+=`

            <h3>${esc(n.title)}</h3>

            <p>
            <b>تعریف:</b>
            ${esc(n.text)}
            </p>

            `;

        }


        if(n.type==="points"){

            html+=`

            <h3>${esc(n.title)}</h3>

            <p>${esc(n.text).replace(/\n/g,"<br>")}</p>

            `;

        }


        if(n.type==="detail"){

            html+=`

            <h3>${esc(n.title)}</h3>

            <p>${esc(n.text).replace(/\n/g,"<br>")}</p>

            `;

        }


        if(n.type==="mcq"){

            html+=`

            <h3>${index+1}. ${esc(n.question)}</h3>

            <div class="options">

            `;

            n.options.forEach((op,i)=>{

                html+=`

                <div>
                ${String.fromCharCode(65+i)}. ${esc(op)}
                </div>

                `;

            });

            html+=`</div>`;

        }

    });


    if(notes.length===0){

        html+=`
        <p style="text-align:center;margin-top:100px">
        ابھی کوئی notes شامل نہیں کیے گئے۔
        </p>
        `;

    }


    get("notesPreview").innerHTML=html;

}

function closeModal(){

function confirmSave(){

    let name=get("saveName").value.trim();

    if(!name){

        alert("براہِ کرم نام لکھیں۔");

        return;

    }


    let id=Date.now();


    if(saveType==="paper"){

        let saved=JSON.parse(
            localStorage.getItem("risen_saved_papers") || "[]"
        );


        saved.push({

            id:id,
            name:name,

                chapter:get("chapter").value,
                date:get("date").value,
                time:get("time").value,
                marks:get("marks").value,
                studentName:get("studentName").value,
                rollNumber:get("rollNumber").value,
                section:get("section").value,
                teacher:get("teacher").value,
                questions:questions

            }

        });


        localStorage.setItem(
            "risen_saved_papers",
            JSON.stringify(saved)
        );

    }


    if(saveType==="notes"){

        let saved=JSON.parse(
            localStorage.getItem("risen_saved_notes") || "[]"
        );


        saved.push({

            id:id,
            name:name,
            date:new Date().toLocaleString(),
            data:{

                school:get("nschool").value,
                className:get("nclass").value,
                subject:get("nsubject").value,
                chapter:get("nchapter").value,
                notes:notes

            }

        });


        localStorage.setItem(
            "risen_saved_notes",
            JSON.stringify(saved)
        );

    }


    closeModal();

    renderSaved();

    alert("کامیابی سے Save ہوگیا۔");

}

/* ---------- OPEN SAVED PAPER ---------- */

function openSavedPaper(id){

    let saved=JSON.parse(
        localStorage.getItem("risen_saved_papers") || "[]"
    );

    let item=saved.find(x=>x.id===id);

    if(!item) return;

    let d=item.data;

    get("school").value=d.school || "";
    get("exam").value=d.exam || "";
    get("className").value=d.className || "";
    get("subject").value=d.subject || "";
    get("chapter").value=d.chapter || "";
    get("date").value=d.date || "";
    get("time").value=d.time || "";
    get("marks").value=d.marks || "";
    get("studentName").value=d.studentName || "";

    questions=d.questions || [];

    renderQuestions();

function openSavedNotes(id){

    let saved=JSON.parse(
        localStorage.getItem("risen_saved_notes") || "[]"

    notes=d.notes || [];

/* ---------- DELETE ---------- */

function deleteSavedPaper(id){

    if(!confirm("کیا آپ یہ paper delete کرنا چاہتے ہیں؟")) return;

    let saved=JSON.parse(
        localStorage.getItem("risen_saved_papers") || "[]"
    );

    saved=saved.filter(x=>x.id!==id);

    localStorage.setItem(
        "risen_saved_papers",
        JSON.stringify(saved)
    );

    renderSaved();

}


function deleteSavedNotes(id){

    if(!confirm("کیا آپ یہ notes delete کرنا چاہتے ہیں؟")) return;

    let saved=JSON.parse(
        localStorage.getItem("risen_saved_notes") || "[]"
    );

    saved=saved.filter(x=>x.id!==id);

    localStorage.setItem(
        "risen_saved_notes",
        JSON.stringify(saved)
    );

    renderSaved();

}

/* ---------- DOWNLOAD ---------- */

function downloadHTML(filename,content){

    let blob=new Blob(
        [content],
        {type:"text/html;charset=utf-8"}
    );

    let url=URL.createObjectURL(blob);

    let a=document.createElement("a");

    a.href=url;

    a.download=filename;

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

    setTimeout(function(){

        URL.revokeObjectURL(url);

    },1000);

}
