<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Risen High School - Paper & Notes Maker</title>

<style>

/* =========================================================
   JAMEEL NOORI NASTALEEQ
========================================================= */
@font-face{
    font-family:"JameelNoori";
    src:url("https://cdn.jsdelivr.net/gh/tariq-abdullah/urdu-web-font-CDN/JameelNooriNastaleeq.woff")
        format("woff");
    font-weight:normal;
    font-style:normal;
    font-display:swap;
}

:root{
    --primary:#174ea6;
    --primary2:#0b3d91;
    --light:#eef4ff;
    --border:#d5dce8;
    --dark:#172033;
    --green:#138a52;
    --red:#c62828;
    --orange:#ef8b00;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#f1f4f8;
    color:#172033;
    font-family:
        "JameelNoori",
        "Noto Nastaliq Urdu",
        serif;
}

/* =========================================================
   TOP BAR
========================================================= */
.topbar{
    background:linear-gradient(135deg,#0b3d91,#174ea6);
    color:white;
    padding:14px 15px;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.topbar-inner{
    width:100%;
    max-width:1500px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-box{
    width:58px;
    height:58px;
    border-radius:12px;
    background:white;
    color:#174ea6;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:Arial,sans-serif;
    font-weight:900;
    font-size:30px;
}

.logo-box img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.logo-placeholder{
    font-family:Arial,sans-serif;
}

.hidden{
    display:none!important;
}

.brand h1{
    margin:0;
    font-family:"Segoe UI",Arial,sans-serif;
    font-size:23px;
}

.brand p{
    margin:3px 0 0;
    font-family:"Segoe UI",Arial,sans-serif;
    opacity:.9;
    font-size:13px;
}

.header-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    justify-content:center;
}

button{
    border:none;
    border-radius:7px;
    padding:9px 13px;
    cursor:pointer;
    font-family:inherit;
    font-size:14px;
}

.header-buttons button{
    background:white;
    color:#174ea6;
}

button:hover{
    opacity:.9;
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-green{
    background:var(--green);
    color:white;
}

.btn-red{
    background:var(--red);
    color:white;
}

.btn-orange{
    background:var(--orange);
    color:white;
}

.btn-gray{
    background:#687386;
    color:white;
}

/* =========================================================
   MAIN
========================================================= */
.main{
    max-width:1500px;
    margin:18px auto;
    padding:0 14px;
}

.tabs{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.tab-btn{
    background:white;
    color:#263449;
    border:1px solid var(--border);
    min-width:130px;
}

.tab-btn.active{
    background:var(--primary);
    color:white;
}

.tab-content{
    display:none;
}

.tab-content.active{
    display:block;
}

.layout{
    display:grid;
    grid-template-columns:minmax(320px,1fr) minmax(350px,1fr);
    gap:18px;
    align-items:start;
}

/* =========================================================
   EDITOR
========================================================= */
.editor-panel{
    background:white;
    border-radius:12px;
    padding:17px;
    box-shadow:0 3px 15px rgba(0,0,0,.07);
}

.editor-panel h2{
    margin-top:0;
    color:var(--primary2);
}

.section-card{
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
    margin-bottom:13px;
    background:#fbfcff;
}

.section-card h3{
    margin:0 0 10px;
    color:#173d78;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    font-weight:bold;
    color:#34445d;
}

input,
select,
textarea{
    width:100%;
    border:1px solid #cbd4e1;
    border-radius:7px;
    padding:9px 10px;
    background:white;
    font-family:inherit;
    font-size:15px;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 2px rgba(23,78,166,.1);
}

textarea{
    min-height:90px;
    resize:vertical;
}

.question-editor{
    border:1px solid #dce2eb;
    background:white;
    border-radius:8px;
    padding:10px;
    margin-bottom:9px;
}

.question-editor-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-bottom:7px;
}

.question-editor-head strong{
    color:var(--primary2);
}

.options-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.editor-actions{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:9px;
}

.small-btn{
    padding:6px 9px;
    font-size:12px;
}

/* =========================================================
   PREVIEW
========================================================= */
.preview-panel{
    position:sticky;
    top:10px;
}

.preview-tools{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
}

.preview-tools h2{
    margin:0;
    color:var(--primary2);
}

.paper-stage{
    background:#dce2eb;
    padding:25px 10px;
    border-radius:12px;
    overflow:auto;
    min-height:500px;
}

/* =========================================================
   OLD A4 TEMPLATE - PRESERVED
========================================================= */
.a4{
    width:210mm;
    min-height:297mm;
    background:white;
    margin:0 auto;
    padding:14mm;
    color:#111;
    box-shadow:0 5px 25px rgba(0,0,0,.15);
    position:relative;
    direction:rtl;

    font-family:
        "Jameel Noori Nastaleeq",
        "Noto Nastaliq Urdu",
        serif;

    font-variant-ligatures:normal;
    font-feature-settings:normal;
}

.paper-header{
    text-align:center;
    border-bottom:2px solid #111;
    padding-bottom:7px;
    margin-bottom:8px;
}

.preview-school{
    font-family:"Segoe UI",Arial,sans-serif;
    font-weight:900;
    font-size:22px;
    direction:ltr;
}

.preview-exam{
    font-size:21px;
    font-weight:bold;
    margin-top:3px;
}

.preview-meta{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:6px;
    font-family:"Segoe UI",Arial,sans-serif;
    direction:ltr;
    font-size:12px;
    margin-top:7px;
}

.meta-cell{
    border:1px solid #111;
    padding:4px 5px;
    min-height:25px;
    text-align:left;
}

.meta-cell .urdu-value{
    font-family:
        "JameelNoori",
        "Noto Nastaliq Urdu",
        serif;
    direction:rtl;
}

.student-row{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr;
    direction:ltr;
    margin:8px 0;
    border:1px solid #111;
}

.student-cell{
    min-height:29px;
    padding:5px;
    border-right:1px solid #111;
    font-family:"Segoe UI",Arial,sans-serif;
    font-size:12px;
    text-align:left;
}

.student-cell:last-child{
    border-right:none;
}

.student-cell .urdu-value{
    font-family:
        "JameelNoori",
        "Noto Nastaliq Urdu",
        serif;
    direction:rtl;
}

.paper-section{
    margin-top:13px;
}

.paper-section-title{
    font-size:18px;
    font-weight:bold;
    border-bottom:1px solid #111;
    padding-bottom:2px;
    margin-bottom:5px;
}

.mcq-preview{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px 20px;
}

.mcq-preview-item{
    break-inside:avoid;
}

.mcq-options-preview{
    display:grid;
    grid-template-columns:1fr 1fr;
    font-family:
        "Jameel Noori Nastaleeq",
        serif;
    font-size:14px;
    margin-top:2px;
}

.q-row{
    display:flex;
    gap:7px;
    margin-bottom:8px;
    line-height:1.8;
    break-inside:avoid;
}

.q-number{
    font-weight:bold;
    min-width:25px;
}

.lines{
    flex:1;
    min-height:35px;
    border-bottom:1px dashed #888;
}

.long-answer{
    margin-bottom:12px;
    break-inside:avoid;
}

.answer-lines{
    height:65px;
    margin-top:4px;
    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 22px,
            #999 23px
        );
}

.fill-row{
    margin-bottom:8px;
    line-height:1.8;
}

.truefalse{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    margin-bottom:7px;
}

.tf-options{
    font-family:"Segoe UI",Arial,sans-serif;
    white-space:nowrap;
}

.paper-footer{
    position:absolute;
    bottom:7mm;
    left:14mm;
    right:14mm;
    border-top:1px solid #555;
    padding-top:3px;
    display:flex;
    justify-content:space-between;
    font-family:"Segoe UI",Arial,sans-serif;
    font-size:10px;
}

/* =========================================================
   NOTES
========================================================= */
.notes-preview{
    width:210mm;
    min-height:297mm;
    background:white;
    margin:0 auto;
    padding:14mm;
    color:#111;
    box-shadow:0 5px 25px rgba(0,0,0,.15);
    position:relative;
}

.note-block{
    margin-bottom:15px;
}

.note-heading{
    font-size:22px;
    font-weight:bold;
    border-bottom:2px solid #111;
    padding-bottom:5px;
    margin-bottom:8px;
}

.note-question{
    font-size:18px;
    font-weight:bold;
    margin-bottom:4px;
}

.note-answer{
    line-height:2;
    font-size:16px;
}

.note-points{
    line-height:2;
    font-size:16px;
}

.note-points li{
    margin-bottom:4px;
}

.note-mcq{
    border:1px solid #222;
    padding:8px;
    margin-bottom:8px;
}

.notes-header{
    text-align:center;
    border-bottom:2px solid #111;
    padding-bottom:8px;
    margin-bottom:10px;
}

/* =========================================================
   SAVED
========================================================= */
.saved-list{
    display:grid;
    gap:10px;
}

.saved-item{
    background:white;
    border:1px solid var(--border);
    border-radius:9px;
    padding:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.saved-item-info strong{
    display:block;
    color:var(--primary2);
}

.saved-item-info small{
    color:#667085;
}

.saved-item-actions{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
}

/* =========================================================
   STATUS
========================================================= */
.status{
    position:fixed;
    bottom:15px;
    left:15px;
    background:#172033;
    color:white;
    padding:8px 13px;
    border-radius:7px;
    font-family:"Segoe UI",Arial,sans-serif;
    font-size:13px;
    display:none;
    z-index:9999;
}

/* =========================================================
   MOBILE
========================================================= */
@media(max-width:900px){

    .topbar-inner{
        width:100% !important;
        max-width:1500px !important;
        margin:0 auto !important;
        display:flex !important;
        flex-direction:column !important;
        align-items:center !important;
        justify-content:center !important;
        text-align:center !important;
        gap:14px;
    }

    .brand{
        width:100% !important;
        margin:0 auto !important;
        display:flex !important;
        flex-direction:column !important;
        align-items:center !important;
        justify-content:center !important;
        text-align:center !important;
    }

    .brand-text{
        width:100% !important;
        text-align:center !important;
    }

    .brand h1,
    .brand p{
        text-align:center !important;
    }

    .header-buttons{
        width:100% !important;
        display:flex !important;
        flex-wrap:wrap !important;
        justify-content:center !important;
        align-items:center !important;
        margin:0 auto !important;
    }

    .layout{
        grid-template-columns:1fr;
    }

    .preview-panel{
        position:static;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .preview-meta{
        grid-template-columns:1fr 1fr 1fr;
    }
}

@media(max-width:600px){

    .main{
        padding:0 7px;
    }

    .tabs{
        display:grid;
        grid-template-columns:1fr 1fr;
    }

    .tab-btn{
        min-width:0;
    }

    .preview-meta{
        grid-template-columns:1fr 1fr;
    }

    .mcq-preview{
        grid-template-columns:1fr;
    }

    .student-row{
        grid-template-columns:1fr 1fr;
    }

    .student-cell{
        border-bottom:1px solid #111;
    }

    .student-cell:nth-child(2){
        border-right:none;
    }

    .options-grid{
        grid-template-columns:1fr;
    }

    .saved-item{
        flex-direction:column;
        align-items:flex-start;
    }
}

/* =========================================================
   PRINT
========================================================= */
@media print{

    @page{
        size:A4;
        margin:0;
    }

    html,
    body{
        margin:0 !important;
        padding:0 !important;
        background:white !important;
    }

    .a4{
        width:210mm !important;
        min-height:297mm !important;
        margin:0 !important;
        padding:14mm !important;
        box-shadow:none !important;
    }
}

</style>
</head>

<body>

<!-- =======================================================
     HEADER
======================================================= -->

<header class="topbar no-print">

    <div class="topbar-inner">

        <div class="brand">

            <div class="logo-box">

                <img id="headerLogo"
                     class="hidden"
                     alt="School Logo">

                <div id="logoPlaceholder"
                     class="logo-placeholder">
                    R
                </div>

            </div>

            <div class="brand-text">

                <h1>The Risen High School</h1>

                <p>Paper & Notes Maker</p>

            </div>

        </div>

        <div class="header-buttons">

            <button onclick="saveDraft()">
                💾 Save
            </button>

            <button onclick="loadDraft()">
                📂 Load
            </button>

            <button onclick="clearAll()">
                🗑 Clear
            </button>

            <button onclick="printDocument()">
                🖨 Print / PDF
            </button>

        </div>

    </div>

</header>


<main class="main no-print">

    <!-- ===================================================
         TABS
    ==================================================== -->

    <div class="tabs">

        <button class="tab-btn active"
                onclick="switchTab('paper',this)">
            📝 Paper Maker
        </button>

        <button class="tab-btn"
                onclick="switchTab('notes',this)">
            📚 Notes Maker
        </button>

        <button class="tab-btn"
                onclick="switchTab('saved',this)">
            💾 Saved Papers & Notes
        </button>

    </div>


    <!-- ===================================================
         PAPER TAB
    ==================================================== -->

    <section id="paperTab"
             class="tab-content active">

        <div class="layout">

            <!-- EDITOR -->

            <div class="editor-panel">

                <h2>Paper Maker</h2>


                <!-- PAPER INFORMATION -->

                <div class="section-card">

                    <h3>Paper Information</h3>

                    <div class="form-grid">

                        <div class="form-group full">
                            <label>School Name</label>
                            <input id="schoolName"
                                   value="The Risen High School"
                                   oninput="updatePaper()">
                        </div>

                        <div class="form-group full">
                            <label>Exam / Test Name</label>
                            <input id="examName"
                                   placeholder="مثلاً ماہانہ ٹیسٹ"
                                   oninput="updatePaper()">
                        </div>

                        <div class="form-group">
                            <label>Class</label>

                            <select id="paperClass"
                                    onchange="updatePaper()">

                                <option>Playgroup</option>
                                <option>Nursery</option>
                                <option>Prep</option>

                                <option>1st</option>
                                <option>2nd</option>
                                <option>3rd</option>
                                <option>4th</option>
                                <option>5th</option>
                                <option>6th</option>
                                <option>7th</option>
                                <option>8th</option>
                                <option>9th</option>
                                <option>10th</option>

                                <option>FA Part 1</option>
                                <option>FA Part 2</option>

                            </select>
                        </div>

                        <div class="form-group">
                            <label>Subject</label>

                            <input id="subject"
                                   placeholder="مثلاً طبیعیات"
                                   oninput="updatePaper()">

                        </div>

                        <div class="form-group">
                            <label>Chapter / Unit</label>

                            <input id="chapter"
                                   placeholder="مثلاً باب نمبر 1"
                                   oninput="updatePaper()">

                        </div>

                        <div class="form-group">
                            <label>Date</label>

                            <input id="paperDate"
                                   type="date"
                                   oninput="updatePaper()">

                        </div>

                        <div class="form-group">
                            <label>Time</label>

                            <input id="paperTime"
                                   placeholder="مثلاً 1 Hour"
                                   oninput="updatePaper()">

                        </div>

                        <div class="form-group">
                            <label>Total Marks</label>

                            <input id="totalMarks"
                                   type="number"
                                   value="50"
                                   oninput="updatePaper()">

                        </div>

                        <div class="form-group">
                            <label>Teacher Name</label>

                            <input id="teacherName"
                                   value="Sir Rana Faisal"
                                   oninput="updatePaper()">

                        </div>

                    </div>

                </div>


                <!-- STUDENT INFORMATION -->

                <div class="section-card">

                    <h3>Student Information</h3>

                    <div class="form-grid">

                        <div class="form-group">
                            <label>Student Name</label>

                            <input id="studentName"
                                   placeholder="طالب علم کا نام"
                                   oninput="updatePaper()">

                        </div>

                        <div class="form-group">
                            <label>Roll No.</label>

                            <input id="rollNo"
                                   placeholder="Roll No."
                                   oninput="updatePaper()">

                        </div>

                        <div class="form-group">
                            <label>Section</label>

                            <input id="section"
                                   placeholder="A"
                                   oninput="updatePaper()">

                        </div>

                        <div class="form-group">
                            <label>Logo</label>

                            <input id="logoInput"
                                   type="file"
                                   accept="image/*"
                                   onchange="loadLogo(event)">

                        </div>

                    </div>

                </div>


                <!-- MCQS -->

                <div class="section-card">

                    <h3>MCQs</h3>

                    <div id="mcqEditor"></div>

                    <button class="btn-primary"
                            onclick="addMCQ()">
                        + Add MCQ
                    </button>

                </div>


                <!-- SHORT QUESTIONS -->

                <div class="section-card">

                    <h3>Short Questions</h3>

                    <div id="shortEditor"></div>

                    <button class="btn-primary"
                            onclick="addShort()">
                        + Add Short Question
                    </button>

                </div>


                <!-- LONG QUESTIONS -->

                <div class="section-card">

                    <h3>Long Questions</h3>

                    <div id="longEditor"></div>

                    <button class="btn-primary"
                            onclick="addLong()">
                        + Add Long Question
                    </button>

                </div>


                <!-- FILL -->

                <div class="section-card">

                    <h3>Fill in the Blanks</h3>

                    <div id="fillEditor"></div>

                    <button class="btn-primary"
                            onclick="addFill()">
                        + Add Fill Question
                    </button>

                </div>


                <!-- TRUE FALSE -->

                <div class="section-card">

                    <h3>True / False</h3>

                    <div id="tfEditor"></div>

                    <button class="btn-primary"
                            onclick="addTF()">
                        + Add True / False
                    </button>

                </div>


                <div class="editor-actions">

                    <button class="btn-green"
                            onclick="saveCurrentPaper()">
                        💾 Save Paper
                    </button>

                    <button class="btn-primary"
                            onclick="printDocument()">
                        🖨 Print / PDF
                    </button>

                    <button class="btn-orange"
                            onclick="downloadCurrentPaper()">
                        ⬇ Download HTML
                    </button>

                </div>

            </div>


            <!-- PREVIEW -->

            <div class="preview-panel">

                <div class="preview-tools">

                    <h2>Live A4 Preview</h2>

                    <button class="btn-primary"
                            onclick="printDocument()">
                        🖨 Print
                    </button>

                </div>

                <div class="paper-stage">

                    <div id="paperPreview"></div>

                </div>

            </div>

        </div>

    </section>


    <!-- ===================================================
         NOTES TAB
    ==================================================== -->

    <section id="notesTab"
             class="tab-content">

        <div class="layout">

            <div class="editor-panel">

                <h2>Notes Maker</h2>

                <div class="section-card">

                    <h3>Notes Information</h3>

                    <div class="form-grid">

                        <div class="form-group full">

                            <label>School Name</label>

                            <input id="notesSchool"
                                   value="The Risen High School"
                                   oninput="updateNotes()">

                        </div>

                        <div class="form-group">

                            <label>Class</label>

                            <select id="notesClass"
                                    onchange="updateNotes()">

                                <option>Playgroup</option>
                                <option>Nursery</option>
                                <option>Prep</option>

                                <option>1st</option>
                                <option>2nd</option>
                                <option>3rd</option>
                                <option>4th</option>
                                <option>5th</option>
                                <option>6th</option>
                                <option>7th</option>
                                <option>8th</option>
                                <option>9th</option>
                                <option>10th</option>

/* =========================================================

function esc(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function val(id){

    const el = document.getElementById(id);

    return el ? el.value : "";
}


function showStatus(message){

    const box = document.getElementById("status");

    box.textContent = message;

    box.style.display = "block";

    setTimeout(function(){
        box.style.display = "none";
    },1800);
}

    document.querySelectorAll(".tab-btn")
        .forEach(function(x){
            x.classList.remove("active");

    document.getElementById(tab+"Tab")
        .classList.add("active");

    if(button){
        button.classList.add("active");

    if(tab === "paper"){
        updatePaper();

    if(tab === "notes"){

        renderSaved();

}

/* =========================================================

========================================================= */

function loadLogo(event){

    const file =
        event.target.files &&
        event.target.files[0];

    if(!file){
        return;
    }

    const reader =
        new FileReader();

    reader.onload = function(e){

        const src =
            e.target.result;

        document.getElementById("headerLogo")
            .src = src;

        document.getElementById("headerLogo")
            .classList.remove("hidden");

        document.getElementById("logoPlaceholder")
            .classList.add("hidden");

        localStorage.setItem(
            "risen_logo",
            src
        );
    };

    reader.readAsDataURL(file);
}

function loadDraft(){

    const raw =
        localStorage.getItem("risen_draft");

    if(!raw){

        alert("No saved draft found.");

        return;
    }

    try{

        const state =
            JSON.parse(raw);

        loadState(state);

        showStatus("Draft Loaded");

    }catch(e){

        alert("Draft could not be loaded.");

    }
}


/* =========================================================
   LOAD STATE
========================================================= */

function loadState(state){

    const p =
        state.paper || {};

    if(p.school !== undefined)
        document.getElementById("schoolName").value = p.school;

    if(p.exam !== undefined)
        document.getElementById("examName").value = p.exam;

    if(p.paperClass !== undefined)
        document.getElementById("paperClass").value = p.paperClass;

    if(p.subject !== undefined)
        document.getElementById("subject").value = p.subject;

    if(p.chapter !== undefined)
        document.getElementById("chapter").value = p.chapter;

    if(p.date !== undefined)
        document.getElementById("paperDate").value = p.date;

    if(p.time !== undefined)
        document.getElementById("paperTime").value = p.time;

    if(p.totalMarks !== undefined)
        document.getElementById("totalMarks").value = p.totalMarks;

    document.getElementById("teacherName").value =
        p.teacherName || "Sir Rana Faisal";

    if(p.studentName !== undefined)
        document.getElementById("studentName").value = p.studentName;

    if(p.rollNo !== undefined)
        document.getElementById("rollNo").value = p.rollNo;

    if(p.section !== undefined)
        document.getElementById("section").value = p.section;


    mcqs =
        Array.isArray(state.mcqs)
        ? state.mcqs : [];

    shorts =
        Array.isArray(state.shorts)
        ? state.shorts : [];

    longs =
        Array.isArray(state.longs)
        ? state.longs : [];

    fills =
        Array.isArray(state.fills)
        ? state.fills : [];

    tfs =
        Array.isArray(state.tfs)
        ? state.tfs : [];

    notes =
        Array.isArray(state.notes)
        ? state.notes : [];


    const ni =
        state.notesInfo || {};

    document.getElementById("notesSchool").value =
        ni.school ||
        "The Risen High School";

    if(ni.cls)
        document.getElementById("notesClass").value =
            ni.cls;

    document.getElementById("notesSubject").value =
        ni.subject || "";

    document.getElementById("notesChapter").value =
        ni.chapter || "";


    renderMCQEditor();
    renderShortEditor();
    renderLongEditor();
    renderFillEditor();
    renderTFEditor();
    renderNotesEditor();

    updatePaper();
    updateNotes();
}

/* =========================================================
   OPEN SAVED
========================================================= */

function openSaved(index){

    const item =
        savedItems[index];

    if(!item){
        return;
    }

    loadState(item.state);


    const buttons =
        document.querySelectorAll(".tab-btn");

    if(item.type === "paper"){

        switchTab(
            "paper",
            buttons[0]
        );

    }else{

        switchTab(
            "notes",
            buttons[1]
        );

    }

    showStatus("Opened");
}


/* =========================================================
   DELETE SAVED
========================================================= */

function deleteSaved(index){

    if(!confirm("کیا آپ یہ item Delete کرنا چاہتے ہیں؟")){
        return;
    }

    savedItems.splice(index,1);

    localStorage.setItem(
        "risen_saved_items",
        JSON.stringify(savedItems)
    );

    renderSaved();

    showStatus("Deleted");
}

function buildCompleteHTML(content,title){

    const styles =
        Array.from(
            document.querySelectorAll("style")
        )
        .map(function(style){
            return style.innerHTML;
        })
        .join("\n");


    return `<!DOCTYPE html>

<html lang="ur" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>${esc(title)}</title>

<style>

${styles}

html,body{
    margin:0;
    padding:0;
    background:#fff;
}

</style>

</head>

<body>

${content}

</body>

</html>`;
}


/* =========================================================
   DOWNLOAD FILE
========================================================= */

function downloadFile(content,fileName){

    const blob =
        new Blob(
            [content],
            {type:"text/html;charset=utf-8"}
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download = fileName;

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(function(){

        URL.revokeObjectURL(url);

    },1000);
}


function safeFileName(name){

    return String(name || "document")
        .replace(/[\\/:*?"<>|]/g,"-")
        .replace(/\s+/g,"-");
}


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(
            (e.ctrlKey || e.metaKey) &&
            e.key.toLowerCase() === "s"
        ){

            e.preventDefault();

            if(currentTab === "paper"){

                saveCurrentPaper();

            }else if(currentTab === "notes"){

                saveCurrentNotes();

            }

        }


        if(
            (e.ctrlKey || e.metaKey) &&
            e.key.toLowerCase() === "p"
        ){

            e.preventDefault();

            printDocument();

        }

    }
);
