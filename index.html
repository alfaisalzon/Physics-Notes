<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Risen High School Paper and Notes</title>

<style>
@font-face{
    font-family:"Jameel Noori Nastaleeq";
    src:url("https://cdn.jsdelivr.net/gh/tariq-abdullah/urdu-web-font-CDN/JameelNooriNastaleeq.woff")
    format("woff");
    font-display:swap;
}

:root{
    --primary:#1457d9;
    --primary2:#0b3d91;
    --secondary:#eef4ff;
    --success:#138a4b;
    --danger:#d93636;
    --warning:#e69b00;
    --dark:#172033;
    --muted:#6b7280;
    --white:#ffffff;
    --border:#d9e0eb;
    --bg:#f3f6fb;
    --paper:#ffffff;
    --shadow:0 8px 30px rgba(0,0,0,.08);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--dark);
    font-family:
        "Jameel Noori Nastaleeq",
        "Noto Nastaliq Urdu",
        "Segoe UI",
        Arial,
        sans-serif;
}

input,
select,
textarea,
button{
    font-family:"Segoe UI",Arial,sans-serif;
}

.urdu-input{
    font-family:
        "Jameel Noori Nastaleeq",
        "Noto Nastaliq Urdu",
        serif !important;
    direction:rtl;
    text-align:right;
    font-size:18px;
}

button{
    cursor:pointer;
}

/* ================= HEADER ================= */

.topbar{
    background:linear-gradient(135deg,#0b3d91,#1457d9,#2879ef);
    color:white;
    padding:18px 20px;
    box-shadow:0 4px 20px rgba(0,0,0,.18);
}

.topbar-inner{
    max-width:1500px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo-box{
    width:60px;
    height:60px;
    border-radius:15px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border:3px solid rgba(255,255,255,.7);
}

.logo-box img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.logo-placeholder{
    color:#1457d9;
    font-size:26px;
    font-weight:900;
}

.brand h1{
    margin:0;
    font-size:25px;
}

.brand p{
    margin:4px 0 0;
    opacity:.9;
    font-size:14px;
}

.header-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.header-buttons button{
    border:none;
    border-radius:9px;
    padding:10px 13px;
    background:rgba(255,255,255,.16);
    color:white;
    font-weight:bold;
}

/* ================= MAIN ================= */

.main{
    max-width:1500px;
    margin:auto;
    padding:20px;
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    background:white;
    padding:8px;
    border-radius:14px;
    box-shadow:var(--shadow);
}

.tab{
    flex:1;
    border:none;
    padding:14px;
    border-radius:10px;
    background:#f1f4f9;
    color:#394150;
    font-size:17px;
    font-weight:bold;
}

.tab.active{
    background:var(--primary);
    color:white;
}

.workspace{
    display:grid;
    grid-template-columns:minmax(330px,520px) minmax(500px,1fr);
    gap:20px;
    align-items:start;
}

.panel{
    background:white;
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:18px;
}

.panel-title{
    margin:0 0 15px;
    font-size:22px;
    color:var(--primary2);
    border-bottom:2px solid var(--secondary);
    padding-bottom:10px;
}

/* ================= FORMS ================= */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.form-group{
    margin-bottom:12px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    display:block;
    font-weight:bold;
    margin-bottom:5px;
}

input,
select,
textarea{
    width:100%;
    border:1px solid var(--border);
    border-radius:9px;
    padding:10px 12px;
    font-size:15px;
    outline:none;
    background:white;
}

textarea{
    min-height:80px;
    resize:vertical;
}

/* ================= SECTIONS ================= */

.section-box{
    margin-top:18px;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
}

.section-head{
    background:#f5f8fd;
    padding:11px 13px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border-bottom:1px solid var(--border);
}

.section-head h3{
    margin:0;
    color:var(--primary2);
    font-size:18px;
}

.add-btn{
    background:var(--success);
    color:white;
    border:none;
    border-radius:8px;
    padding:8px 12px;
    font-weight:bold;
}

.items{
    padding:10px;
}

.item{
    border:1px solid #e1e6ef;
    border-radius:10px;
    padding:12px;
    margin-bottom:10px;
    background:#fff;
}

.item-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
    gap:10px;
}

.item-number{
    font-weight:bold;
    color:var(--primary);
}

.remove-btn{
    border:none;
    background:#fff0f0;
    color:var(--danger);
    padding:6px 9px;
    border-radius:7px;
    font-weight:bold;
}

.mcq-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:8px;
}

.option-wrap{
    display:flex;
    gap:6px;
    align-items:center;
}

.option-letter{
    width:27px;
    height:27px;
    border-radius:50%;
    background:#eaf1ff;
    color:var(--primary);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    flex:none;
}

/* ================= TOOLBAR ================= */

.toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:18px;
    padding-top:15px;
    border-top:1px solid var(--border);
}

.btn{
    border:none;
    border-radius:9px;
    padding:10px 14px;
    font-weight:bold;
    font-size:14px;
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-success{
    background:var(--success);
    color:white;
}

.btn-danger{
    background:var(--danger);
    color:white;
}

.btn-secondary{
    background:#e9eef6;
    color:#273449;
}

.btn-warning{
    background:#fff2cc;
    color:#825f00;
}

/* ================= PREVIEW ================= */

.preview-panel{
    position:sticky;
    top:10px;
}

.preview-tools{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
}

.preview-tools h2{
    margin:0;
    color:var(--primary2);
}

.paper-stage{
    background:#dce2eb;
    padding:25px 10px;
    border-radius:12px;
    overflow:auto;
    min-height:500px;
}

/* ================= A4 ================= */

.a4{
    width:210mm;
    min-height:297mm;
    background:white;
    margin:0 auto;
    padding:14mm;
    color:#111;
    box-shadow:0 5px 25px rgba(0,0,0,.15);
    position:relative;

    font-family:
        "Jameel Noori Nastaleeq",
        "Noto Nastaliq Urdu",
        serif;
}

.paper-header{
    text-align:center;
    border-bottom:2px solid #111;
    padding-bottom:7px;
    margin-bottom:8px;
}

.preview-school{
    font-family:"Segoe UI",Arial,sans-serif;
    font-weight:900;
    font-size:22px;
    direction:ltr;
}

.preview-exam{
    font-size:21px;
    font-weight:bold;
}

.preview-meta{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:6px;
    font-family:"Segoe UI",Arial,sans-serif;
    direction:ltr;
    font-size:12px;
    margin-top:7px;
}

.meta-cell{
    border:1px solid #111;
    padding:4px 5px;
    min-height:25px;
}

.student-row{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr;
    direction:ltr;
    margin:8px 0;
    border:1px solid #111;
}

.student-cell{
    min-height:29px;
    padding:5px;
    border-right:1px solid #111;
    font-family:"Segoe UI",Arial,sans-serif;
    font-size:12px;
}

.student-cell:last-child{
    border-right:none;
}

.paper-section{
    margin-top:13px;
}

.paper-section-title{
    font-size:18px;
    font-weight:bold;
    border-bottom:1px solid #111;
    padding-bottom:2px;
    margin-bottom:5px;
}

.mcq-preview{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px 20px;
}

.mcq-preview-item{
    break-inside:avoid;
}

.mcq-options-preview{
    display:grid;
    grid-template-columns:1fr 1fr;
    font-size:14px;
    margin-top:2px;
}

.q-row{
    display:flex;
    gap:7px;
    margin-bottom:8px;
    line-height:1.8;
    break-inside:avoid;
}

.q-number{
    font-weight:bold;
    min-width:25px;
}

.long-answer{
    margin-bottom:12px;
    break-inside:avoid;
}

.answer-lines{
    height:65px;
    margin-top:4px;
    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 22px,
            #999 23px
        );
}

.fill-row{
    margin-bottom:8px;
    line-height:1.8;
}

.truefalse{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    margin-bottom:7px;
}

.tf-options{
    font-family:"Segoe UI",Arial,sans-serif;
    white-space:nowrap;
}

.paper-footer{
    position:absolute;
    bottom:7mm;
    left:14mm;
    right:14mm;
    border-top:1px solid #555;
    padding-top:3px;
    display:flex;
    justify-content:space-between;
    font-family:"Segoe UI",Arial,sans-serif;
    font-size:10px;
}

/* ================= NOTES ================= */

.notes-page{
    min-height:297mm;
}

.notes-title{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    border-bottom:2px solid #111;
    padding-bottom:6px;
}

.notes-info{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:5px;
    margin:10px 0;
}

.notes-info div{
    border:1px solid #222;
    padding:5px;
    font-size:13px;
}

.note-block{
    margin:15px 0;
    break-inside:avoid;
}

.note-heading{
    background:#eef3fb;
    border-right:5px solid #1457d9;
    padding:6px 9px;
    font-size:20px;
    font-weight:bold;
}

.note-question{
    font-size:19px;
    font-weight:bold;
    margin-top:8px;
}

.note-answer{
    font-size:18px;
    line-height:2.05;
    margin-top:4px;
}

.definition{
    border:1px solid #555;
    padding:8px;
    margin-top:8px;
    font-size:18px;
    line-height:2;
}

.keypoints{
    font-size:18px;
    line-height:2;
}

.notes-mcq-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:3px 15px;
    margin-top:3px;
}

.hidden{
    display:none !important;
}

.empty-message{
    text-align:center;
    color:#888;
    padding:20px;
}

/* ================= SAVED ================= */

.saved-card{
    border:1px solid var(--border);
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
    background:#fff;
    box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.saved-card-title{
    font-size:20px;
    font-weight:bold;
    color:var(--primary2);
    margin-bottom:6px;
}

.saved-card-info{
    color:#555;
    line-height:1.8;
    font-size:15px;
    margin-bottom:10px;
}

.saved-card-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.saved-card-actions .btn{
    min-width:120px;
}

/* ================= MOBILE ================= */

@media(max-width:1000px){

    .workspace{
        grid-template-columns:1fr;
    }

    .preview-panel{
        position:relative;
        top:auto;
    }
}

@media(max-width:650px){

    .main{
        padding:10px;
    }

    .topbar-inner{
        flex-direction:column;
    }

    .brand{
        justify-content:center;
        text-align:center;
    }

    .tabs{
        flex-direction:column;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .mcq-options{
        grid-template-columns:1fr;
    }

    .preview-tools{
        flex-direction:column;
        align-items:stretch;
    }

    .paper-stage{
        padding:10px 0;
    }

    .header-buttons{
        justify-content:center;
    }

    .header-buttons button{
        flex:1;
        min-width:100px;
    }

    .saved-card-actions{
        flex-direction:column;
    }

    .saved-card-actions .btn{
        width:100%;
    }
}

/* ================= PRINT ================= */

@page{
    size:A4;
    margin:0;
}

@media print{

    body *{
        visibility:hidden !important;
    }

    #printArea,
    #printArea *{
        visibility:visible !important;
    }

    #printArea{
        position:absolute;
        left:0;
        top:0;
        width:100%;
    }

    .a4{
        box-shadow:none;
        margin:0;
    }

    .no-print{
        display:none !important;
    }
}

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</head>

<body>

<div class="app">

<header class="topbar no-print">

<div class="topbar-inner">

<div class="brand">

<div class="logo-box">

<img id="headerLogo" class="hidden" alt="School Logo">

<div id="logoPlaceholder" class="logo-placeholder">
R
</div>

</div>

<div>
<h1>The Risen High School</h1>
<p>Paper & Notes Maker</p>
</div>

</div>

<div class="header-buttons">

<button onclick="savePaper()">📄 Save Paper</button>

<button onclick="saveNotes()">📚 Save Notes</button>

<button onclick="saveDraft()">💾 Save</button>

<button onclick="loadDraft()">📂 Load</button>

<button onclick="clearAll()">🗑 Clear</button>

<button onclick="printDocument()">🖨 Print / PDF</button>

</div>

</div>

</header>


<main class="main no-print">

<!-- ================= TABS ================= -->

<div class="tabs">

<button
class="tab active"
id="paperTab"
onclick="showTab('paper')">

📄 Paper Maker

</button>

<button
class="tab"
id="notesTab"
onclick="showTab('notes')">

📚 Notes Maker

</button>

<button
class="tab"
id="savedPapersTab"
onclick="showTab('savedPapers')">

💾 Saved Papers

</button>

<button
class="tab"
id="savedNotesTab"
onclick="showTab('savedNotes')">

📝 Saved Notes

</button>

</div>


<!-- =====================================================
     PAPER MAKER
===================================================== -->

<section id="paperSection">

<div class="workspace">

<div class="panel">

<h2 class="panel-title">
📄 Paper Settings
</h2>

<div class="form-grid">

<div class="form-group full">

<label>School Name</label>

<input
id="schoolName"
value="The Risen High School"
oninput="updatePaper()">

</div>


<div class="form-group">

<label>Exam / Test</label>

<input
id="examName"
value="Monthly Test"
oninput="updatePaper()">

</div>


<div class="form-group">

<label>Class</label>

<select id="paperClass" onchange="updatePaper()">

<option>Playgroup</option>
<option>Nursery</option>
<option>Prep</option>
<option>1st</option>
<option>2nd</option>
<option>3rd</option>
<option>4th</option>
<option>5th</option>
<option>6th</option>
<option>7th</option>
<option>8th</option>
<option selected>9th</option>
<option>10th</option>
<option>11th / FA Part 1</option>
<option>12th / FA Part 2</option>

</select>

</div>


<div class="form-group">

<label>Subject</label>

<input
id="paperSubject"
placeholder="مثلاً طبیعیات"
oninput="updatePaper()">

</div>


<div class="form-group">

<label>Chapter / Unit</label>

<input
id="paperChapter"
placeholder="Chapter 1"
oninput="updatePaper()">

</div>


<div class="form-group">

<label>Date</label>

<input
type="date"
id="paperDate"
onchange="updatePaper()">

</div>


<div class="form-group">

<label>Time</label>

<input
id="paperTime"
value="2 Hours"
oninput="updatePaper()">

</div>


<div class="form-group">

<label>Total Marks</label>

<input
type="number"
id="totalMarks"
value="50"
oninput="updatePaper()">

</div>

</div>


<!-- STUDENT -->

<div class="section-box">

<div class="section-head">

<h3>👨‍🎓 Student Information</h3>

</div>

<div class="items">

<div class="form-grid">

<div class="form-group">

<label>Student Name</label>

<input
id="studentName"
placeholder="نام طالب علم"
oninput="updatePaper()">

</div>


<div class="form-group">

<label>Roll Number</label>

<input
id="rollNumber"
oninput="updatePaper()">

</div>


<div class="form-group">

<label>Section</label>

<input
id="sectionName"
oninput="updatePaper()">

</div>


<div class="form-group">

<label>Teacher</label>

<input
id="teacherName"
value="Sir Rana Faisal"
oninput="updatePaper()">

</div>

</div>

</div>

</div>


<!-- LOGO -->

<div class="section-box">

<div class="section-head">

<h3>🏫 School Logo</h3>

</div>

<div class="items">

<input
type="file"
id="logoUpload"
accept="image/*"
onchange="uploadLogo(event)">

</div>

</div>


<!-- MCQS -->

<div class="section-box">

<div class="section-head">

<h3>① MCQs</h3>

<button
class="add-btn"
onclick="addMCQ()">

+ Add MCQ

</button>

</div>

<div id="mcqEditor" class="items"></div>

</div>


<!-- SHORT -->

<div class="section-box">

<div class="section-head">

<h3>② Short Questions</h3>

<button
class="add-btn"
onclick="addShort()">

+ Add Question

</button>

</div>

<div id="shortEditor" class="items"></div>

</div>


<!-- LONG -->

<div class="section-box">

<div class="section-head">

<h3>③ Long Questions</h3>

<button
class="add-btn"
onclick="addLong()">

+ Add Question

</button>

</div>

<div id="longEditor" class="items"></div>

</div>


<!-- FILL -->

<div class="section-box">

<div class="section-head">

<h3>④ Fill in the Blanks</h3>

<button
class="add-btn"
onclick="addFill()">

+ Add

</button>

</div>

<div id="fillEditor" class="items"></div>

</div>


<!-- TRUE FALSE -->

<div class="section-box">

<div class="section-head">

<h3>⑤ True / False</h3>

<button
class="add-btn"
onclick="addTF()">

+ Add

</button>

</div>

<div id="tfEditor" class="items"></div>

</div>


<div class="toolbar">

<button
class="btn btn-primary"
onclick="updatePaper()">

🔄 Update Preview

</button>

<button
class="btn btn-success"
onclick="printDocument()">

🖨 Print / Save PDF

</button>

<button
class="btn btn-warning"
onclick="downloadPaper()">

📥 Download Paper

</button>

<button
class="btn btn-secondary"
onclick="saveDraft()">

💾 Save Draft

</button>

</div>

</div>


<!-- PREVIEW -->

<div class="panel preview-panel">

<div class="preview-tools">

<h2>👁 Live Preview</h2>

<div>

<button
class="btn btn-primary"
onclick="printDocument()">

Print A4

</button>

<button
class="btn btn-warning"
onclick="downloadPaper()">

📥 Download

</button>

</div>

</div>


<div class="paper-stage">

<div id="printArea">

<div id="paperPreview" class="a4"></div>

</div>

</div>

</div>

</div>

</section>


<!-- =====================================================
     NOTES MAKER
===================================================== -->

<section id="notesSection" class="hidden">

<div class="workspace">

<div class="panel">

<h2 class="panel-title">
📚 Notes Settings
</h2>


<div class="form-grid">

<div class="form-group full">

<label>School Name</label>

<input
id="notesSchool"
value="The Risen High School"
oninput="updateNotes()">

</div>


<div class="form-group">

<label>Class</label>

<select
id="notesClass"
onchange="updateNotes()">

<option>Playgroup</option>
<option>Nursery</option>
<option>Prep</option>
<option>1st</option>
<option>2nd</option>
<option>3rd</option>
<option>4th</option>
<option>5th</option>
<option>6th</option>
<option>7th</option>
<option>8th</option>
<option selected>9th</option>
<option>10th</option>
<option>11th / FA Part 1</option>
<option>12th / FA Part 2</option>

</select>

</div>


<div class="form-group">

<label>Subject</label>

<input
id="notesSubject"
placeholder="مثلاً حیاتیات"
oninput="updateNotes()">

</div>


<div class="form-group">

/* =====================================================

===================================================== */

function escapeHTML(value){

if(value===null || value===undefined){
return "";
}

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function nl2br(value){

return escapeHTML(value || "")
.replace(/\n/g,"<br>");

}


function get(id){

return document.getElementById(id);

}

get("notesTab").classList.remove("active");

if(tab==="paper"){

updatePaper();

}


if(tab==="notes"){

get("notesSection").classList.remove("hidden");

if(tab==="savedNotes"){

get("savedNotesSection").classList.remove("hidden");

function addNoteBlock(data){

data=data || {
type:"heading",
heading:"",
question:"",
answer:"",
definition:"",
points:"",
mcqQuestion:"",
options:["","","",""]
};

noteBlocks.push(data);

renderNotesEditor();

updateNotes();

}


function removeNoteBlock(index){

noteBlocks.splice(index,1);

renderNotesEditor();

updateNotes();

}


function changeNoteType(index,type){

noteBlocks[index].type=type;

renderNotesEditor();

updateNotes();

}


function renderNotesEditor(){

const box=get("notesEditor");

box.innerHTML="";


if(noteBlocks.length===0){

box.innerHTML=
`<div class="empty-message">
ابھی کوئی Note شامل نہیں کیا گیا۔
</div>`;

return;

}


noteBlocks.forEach((note,index)=>{

const div=document.createElement("div");

div.className="note-editor";


let fields="";


if(note.type==="heading"){

fields=`

<input
class="urdu-input"
placeholder="Heading / عنوان"
value="${escapeHTML(note.heading)}"
oninput="noteBlocks[${index}].heading=this.value;updateNotes()">

`;

}


if(note.type==="qa"){

fields=`

<textarea
class="urdu-input"
placeholder="سوال"
oninput="noteBlocks[${index}].question=this.value;updateNotes()">${escapeHTML(note.question)}</textarea>

<textarea
class="urdu-input"
style="margin-top:8px"
placeholder="جواب"
oninput="noteBlocks[${index}].answer=this.value;updateNotes()">${escapeHTML(note.answer)}</textarea>

`;

}

fields=`

<input
class="urdu-input"
placeholder="اصطلاح / تعریف کا عنوان"

oninput="noteBlocks[${index}].heading=this.value;updateNotes()">

<textarea
class="urdu-input"
style="margin-top:8px"
placeholder="تعریف"
oninput="noteBlocks[${index}].definition=this.value;updateNotes()">${escapeHTML(note.definition)}</textarea>

`;

}


if(note.type==="points"){

fields=`

<input
class="urdu-input"
placeholder="Heading"
value="${escapeHTML(note.heading)}"
oninput="noteBlocks[${index}].heading=this.value;updateNotes()">

class="urdu-input"
style="margin-top:8px"

if(note.type==="text"){

class="urdu-input"
placeholder="تفصیلی نوٹس لکھیں"
oninput="noteBlocks[${index}].answer=this.value;updateNotes()">${escapeHTML(note.answer)}</textarea>

${["A","B","C","D"].map((letter,i)=>`

<div class="option-wrap">

<span class="option-letter">
${letter}
</span>

<input
class="urdu-input"
placeholder="Option ${letter}"
value="${escapeHTML(note.options[i] || "")}"

</div>

`).join("")}

</div>

div.innerHTML=`

MCQ

/* =====================================================
DOWNLOAD PNG
===================================================== */

async function downloadPaper(){

updatePaper();


if(typeof html2canvas==="undefined"){

alert(
"Download system load نہیں ہوا۔ Internet ON کرکے صفحہ دوبارہ کھولیں۔"
);

return;

}


try{

if(document.fonts && document.fonts.ready){

await document.fonts.ready;

}


await new Promise(
resolve=>setTimeout(resolve,700)
);


const canvas=await html2canvas(
get("paperPreview"),
{
scale:2,
useCORS:true,
allowTaint:false,
backgroundColor:"#ffffff",
logging:false
}
);


canvas.toBlob(function(blob){

if(!blob){

alert("Paper image نہیں بن سکی۔");
return;

}


const url=URL.createObjectURL(blob);

let subject=
get("paperSubject").value ||
"Paper";


subject=subject.replace(
/[\\/:*?"<>|]/g,
"-"
);


const link=document.createElement("a");

link.href=url;

link.download=
"The Risen High School - "+
subject+
".png";


document.body.appendChild(link);

link.click();

link.remove();


setTimeout(
()=>URL.revokeObjectURL(url),
3000
);


alert("Paper PNG download ہو گیا ہے۔");

},"image/png");


}catch(error){

console.error(error);

alert(
"Paper download کرتے وقت مسئلہ آیا۔ دوبارہ کوشش کریں۔"
);

}

}
