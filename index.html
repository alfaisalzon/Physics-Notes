<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>نویں جماعت طبیعیات کے نوٹس - The Risen High School</title>

<style>
@font-face{
  font-family:'Jameel Noori Nastaleeq';
  src:url('https://cdn.jsdelivr.net/gh/tariq-abdullah/urdu-web-font-CDN/JameelNooriNastaleeq.woff') format('woff');
  font-display:swap;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
}

body{
  background:#eef1f5;
  color:#111;
  font-family:'Jameel Noori Nastaleeq','Noto Nastaliq Urdu',serif;
  direction:rtl;
}

.control{
  max-width:950px;
  margin:15px auto;
  padding:20px;
  background:white;
  border-radius:12px;
  box-shadow:0 2px 12px #0002;
  text-align:center;
}

.school-title{
  color:#174a7c;
  font-size:30px;
  font-weight:bold;
  margin:0;
}

.main-title{
  font-size:24px;
  font-weight:bold;
  margin:3px 0;
}

.sub-title{
  font-size:17px;
  color:#555;
  margin:5px 0 15px;
}

label{
  display:block;
  font-size:19px;
  font-weight:bold;
  margin:8px 0;
}

select,button{
  font-family:inherit;
  font-size:17px;
  border-radius:7px;
  padding:9px 13px;
}

select{
  width:100%;
  border:1px solid #aaa;
  background:white;
  direction:rtl;
  text-align:right;
}

button{
  background:#174a7c;
  color:white;
  border:0;
  cursor:pointer;
  margin:5px;
}

button:hover{
  opacity:.9;
}

#pages{
  width:100%;
}

.page{
  width:210mm;
  height:297mm;
  background:white;
  margin:20px auto;
  padding:12mm 14mm 17mm;
  position:relative;
  overflow:hidden;
  box-shadow:0 2px 12px #0003;
  page-break-after:always;
}

.page-content{
  height:252mm;
  overflow:hidden;
}

.page-header{
  text-align:center;
  border-bottom:2px solid #174a7c;
  padding-bottom:7px;
  margin-bottom:10px;
}

.school{
  font-size:25px;
  color:#174a7c;
  font-weight:bold;
}

.subject{
  font-size:20px;
  font-weight:bold;
}

.chapter{
  font-size:23px;
  font-weight:bold;
  margin-top:2px;
}

.section-title{
  background:#174a7c;
  color:white;
  padding:5px 12px;
  border-radius:5px;
  font-size:20px;
  font-weight:bold;
  margin:10px 0 8px;
}

.question{
  border:1px solid #bbb;
  border-radius:6px;
  padding:7px 10px;
  margin:7px 0;
  background:#fff;
  page-break-inside:avoid;
}

.q{
  font-size:18px;
  font-weight:bold;
  line-height:1.8;
}

.a{
  font-size:17px;
  line-height:2;
  margin-top:2px;
}

.long-answer{
  border-right:4px solid #174a7c;
  padding-right:9px;
}

.mcq{
  border:1px solid #ccc;
  padding:7px;
  margin:6px 0;
  border-radius:5px;
}

.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  margin-top:5px;
}

.option{
  padding:4px 7px;
  border:1px solid #ddd;
  border-radius:4px;
  font-size:16px;
}

.correct{
  background:#e4f5e7;
  border:2px solid #26843b;
  font-weight:bold;
}

.correct::before{
  content:"✓ ";
  color:#16852c;
}

.footer{
  position:absolute;
  bottom:6mm;
  left:14mm;
  right:14mm;
  text-align:center;
  border-top:1px solid #ccc;
  padding-top:3px;
  font-size:13px;
  color:#555;
}

.note{
  text-align:center;
  font-size:20px;
  padding:30px;
}

@media print{
  body{
    background:white;
  }

  .control{
    display:none;
  }

  .page{
    margin:0;
    box-shadow:none;
  }
}

@media(max-width:700px){

  .control{
    margin:5px;
    padding:12px;
  }

  .school-title{
    font-size:24px;
  }

  .main-title{
    font-size:20px;
  }

  .page{
    transform-origin:top center;
  }

}
</style>
</head>

<body>

<div class="control">

  <div class="school-title">
    دی رائزن ہائی سکول

  </div>

  <div class="sub-title">

  </div>

  <label for="chapterSelect">

  </label>

  <select id="chapterSelect"></select>

  <div>

    <button onclick="generateNotes()">
      📘 نوٹس تیار کریں
    </button>

    <button onclick="window.print()">
      🖨️ A4 پرنٹ کریں
    </button>

    <button onclick="downloadCurrent()">
      🖼️ موجودہ باب PNG
    </button>

    <button onclick="downloadAll()">

  </div>

</div>

<div id="pages">

  <div class="note">
    اوپر سے باب منتخب کریں اور نوٹس تیار کریں۔
  </div>

</div>

short:[

["لچک (Elasticity) کی تعریف کریں۔",
"جواب: کسی مادے کی وہ خاصیت جس کی بنا پر وہ قوت ہٹانے کے بعد اپنی اصل شکل اور حجم کی طرف واپس آ جاتا ہے، لچک کہلاتی ہے۔"],

["ہُک کا قانون بیان کریں۔",
"جواب: لچکدار حد کے اندر کسی جسم میں پیدا ہونے والا طول اس پر لگائی گئی قوت کے راست متناسب ہوتا ہے۔ F ∝ x"],

["دباؤ (Stress) اور خمیدگی (Strain) کی تعریف کریں۔",
"جواب: دباؤ کسی سطح پر لگنے والی قوت فی اکائی رقبہ ہے (Stress = F/A)، جبکہ خمیدگی اصل طول میں تبدیلی کی نسبت ہے (Strain = ΔL/L)۔"],

],

long:[

["ہُک کے قانون کی تفصیل، تجربے اور گراف کے ساتھ وضاحت کریں۔",[

"جواب: ہُک کا قانون بیان کرتا ہے کہ لچکدار حد کے اندر کسی مادے میں پیدا ہونے والا طول اس پر لگائی گئی قوت کے راست متناسب ہوتا ہے، یعنی F = kx، جہاں k لچکدار مستقل ہے۔",

"اس قانون کو جانچنے کے لیے کسی اسپرنگ پر بتدریج وزن لٹکا کر طول میں اضافہ ریکارڈ کیا جاتا ہے۔ قوت کو طول کے خلاف گراف پر دکھانے سے ایک سیدھی لکیر حاصل ہوتی ہے، جو لچکدار حد تک برقرار رہتی ہے۔",

"لچکدار حد سے آگے گراف سیدھی لکیر نہیں رہتا، اور مادے میں مستقل بگاڑ پیدا ہو جاتا ہے، یعنی وہ قوت ہٹانے کے بعد بھی اصل حالت میں واپس نہیں آتا۔"

/* =====================================================
   باب منتخب کرنے کی فہرست
===================================================== */

const select=document.getElementById("chapterSelect");

data.forEach((chapter,index)=>{

  const option=document.createElement("option");

  option.value=index;

  option.textContent=chapter.title;

  select.appendChild(option);

});


/* =====================================================
   HTML محفوظ بنانے کا فنکشن
===================================================== */

function esc(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   نیا صفحہ
===================================================== */

function createPage(chapter){

  const page=document.createElement("div");

  page.className="page";

  page.innerHTML=`

    <div class="page-content">

      <div class="page-header">

        <div class="school">
          دی رائزن ہائی سکول
        </div>

        <div class="subject">
          نویں جماعت — طبیعیات
        </div>

        <div class="chapter">
          ${esc(chapter.title)}
        </div>

      </div>

    </div>

    <div class="footer">
      The Risen High School — 9th Class Physics Notes
    </div>

  `;

  document.getElementById("pages").appendChild(page);

  return page.querySelector(".page-content");

}


/* =====================================================
   مختصر سوال
===================================================== */

function makeShort(item){

  const div=document.createElement("div");

  div.className="question";

  div.innerHTML=`

    <div class="q">
      سوال: ${esc(item[0])}
    </div>

    <div class="a">
      ${esc(item[1])}
    </div>

  `;

  return div;

}


/* =====================================================
   تفصیلی سوال
===================================================== */

function makeLong(item){

  const div=document.createElement("div");

  div.className="question long-answer";

  let html=`

    <div class="q">
      سوال: ${esc(item[0])}
    </div>

  `;

  item[1].forEach(answer=>{

    html+=`

      <div class="a">
        ${esc(answer)}
      </div>

    `;

  });

  div.innerHTML=html;

  return div;

}


/* =====================================================
   MCQ
===================================================== */

function makeMcq(item,index){

  const div=document.createElement("div");

  div.className="mcq";

  let html=`

    <div class="q">
      ${index+1}. ${esc(item[0])}
    </div>

    <div class="options">

  `;

  item[1].forEach((option,i)=>{

    html+=`

      <div class="option ${i===item[2]?'correct':''}">
        ${String.fromCharCode(65+i)}۔ ${esc(option)}
      </div>

    `;

  });

  html+=`</div>`;

  div.innerHTML=html;

  return div;

}


/* =====================================================
   سیکشن کا عنوان
===================================================== */

function makeSection(title){

  const div=document.createElement("div");

  div.className="section-title";

  div.textContent=title;

  return div;

}


/* =====================================================
   عنصر کو صفحے میں شامل کرنا
===================================================== */

function addToPages(chapter,element,current){

  current.appendChild(element);

  if(current.scrollHeight > current.clientHeight){

    current.removeChild(element);

    current=createPage(chapter);

    current.appendChild(element);

  }

  return current;

}


/* =====================================================
   نوٹس تیار کریں
===================================================== */

function generateNotes(){

  const chapter=data[Number(select.value)];

  const pages=document.getElementById("pages");

  pages.innerHTML="";

  let current=createPage(chapter);


  /* -------------------------
     مختصر سوالات
  ------------------------- */

  current=addToPages(
    chapter,
    makeSection("مختصر سوالات اور جوابات"),
    current
  );

  chapter.short.forEach(item=>{

    current=addToPages(
      chapter,
      makeShort(item),
      current
    );

  });


  /* -------------------------
     تفصیلی سوالات
  ------------------------- */

  current=addToPages(
    chapter,
    makeSection("تفصیلی سوالات اور جوابات"),
    current
  );

  chapter.long.forEach(item=>{

    current=addToPages(
      chapter,
      makeLong(item),
      current
    );

  });


  /* -------------------------
     MCQs
  ------------------------- */

  current=addToPages(
    chapter,
    makeSection("کثیر الانتخابی سوالات (MCQs)"),
    current
  );

  chapter.mcq.forEach((item,index)=>{

    current=addToPages(
      chapter,
      makeMcq(item,index),
      current
    );

  });

}


/* =====================================================
   موجودہ باب PNG
===================================================== */

async function downloadCurrent(){

  if(typeof html2canvas==="undefined"){

    alert("PNG بنانے کے لیے براہِ کرم انٹرنیٹ آن کریں۔");

    return;

  }

  if(!document.querySelector(".page")){

    generateNotes();

  }

  const pages=document.querySelectorAll(".page");

  for(let i=0;i<pages.length;i++){

    const canvas=await html2canvas(pages[i],{

      scale:2,

      backgroundColor:"#ffffff",

      useCORS:true

    });

    const link=document.createElement("a");

    link.download=
      "Physics-Chapter-"+(Number(select.value)+1)+"-Page-"+(i+1)+".png";

    link.href=canvas.toDataURL("image/png");

    link.click();

    await new Promise(resolve=>setTimeout(resolve,500));

  }

}


/* =====================================================
   تمام ابواب PNG
===================================================== */

async function downloadAll(){

  if(typeof html2canvas==="undefined"){

    alert("PNG بنانے کے لیے براہِ کرم انٹرنیٹ آن کریں۔");

    return;

  }

  for(let chapterIndex=0;chapterIndex<data.length;chapterIndex++){

    select.value=chapterIndex;

    generateNotes();

    await new Promise(resolve=>setTimeout(resolve,500));

    const pages=document.querySelectorAll(".page");

    for(let pageIndex=0;pageIndex<pages.length;pageIndex++){

      const canvas=await html2canvas(pages[pageIndex],{

        scale:2,

        backgroundColor:"#ffffff",

        useCORS:true

      });

      const link=document.createElement("a");

      link.download=
        "Physics-Chapter-"+(chapterIndex+1)+"-Page-"+(pageIndex+1)+".png";

      link.href=canvas.toDataURL("image/png");

      link.click();

      await new Promise(resolve=>setTimeout(resolve,500));

    }

  }

}
