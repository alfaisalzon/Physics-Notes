<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Risen High School - Paper & Notes Maker</title>

<style>

/* =========================
   JAMEEL NOORI NASTALEEQ
========================= */

@font-face{
    font-family:"Jameel Noori Nastaleeq";
    src:url("https://cdn.jsdelivr.net/gh/tariq-abdullah/urdu-web-font-CDN/JameelNooriNastaleeq.woff")
    format("woff");
    font-display:swap;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
}

body{
    font-family:"Jameel Noori Nastaleeq",serif;
    background:#eef2f7;
    color:#172033;
    direction:rtl;
}

button,
input,
select,
textarea{
    font-family:"Jameel Noori Nastaleeq",serif;
}

button{
    cursor:pointer;
}

/* =========================
   HEADER
========================= */

.topbar{
    background:linear-gradient(135deg,#0b3d91,#1976d2);
    color:white;
    padding:18px 12px;
}

.topbar-inner{
    width:100%;
    max-width:1450px;
    margin:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.brand{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.logo-box{
    width:70px;
    height:70px;
    border-radius:50%;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    margin-bottom:7px;
}

.logo-box img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.logo-placeholder{
    font-family:Arial,sans-serif;
    font-size:40px;
    font-weight:bold;
    color:#0b3d91;
}

.brand-text{
    width:100%;
    text-align:center;
}

.brand h1{
    margin:0;
    font-family:Arial,sans-serif;
    font-size:28px;
    text-align:center;
}

.brand p{
    margin:5px 0 0;
    font-size:17px;
    text-align:center;
}

.header-buttons{
    width:100%;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:7px;
    margin-top:14px;
}

.header-buttons button{
    border:0;
    border-radius:7px;
    background:white;
    color:#0b3d91;
    padding:7px 13px;
    font-weight:bold;
}

/* =========================
   MAIN
========================= */

.container{
    max-width:1500px;
    width:100%;
    margin:auto;
    padding:15px;
}

.tabs{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:7px;
    margin-bottom:15px;
}

.tab{
    border:0;
    background:white;
    color:#0b3d91;
    border-radius:8px;
    padding:10px 17px;
    box-shadow:0 2px 7px #0002;
    font-weight:bold;
}

.tab.active{
    background:#1976d2;
    color:white;
}

/* =========================
   WORKSPACE
========================= */

.workspace{
    display:grid;
    grid-template-columns:420px 1fr;
    gap:15px;
    align-items:start;
}

.panel{
    background:white;
    border-radius:12px;
    padding:15px;
    box-shadow:0 2px 10px #0001;
}

.panel h2{
    color:#0b3d91;
    margin:0 0 12px;
}

/* =========================
   FORM
========================= */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:3px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    font-weight:bold;
    font-size:14px;
}

.field input,
.field select,
.field textarea{
    width:100%;
    border:1px solid #cbd5e1;
    border-radius:6px;
    padding:8px;
    outline:none;
    background:white;
}

.field textarea{
    min-height:75px;
    resize:vertical;
}

.section-title{
    background:#e9f2ff;
    border-right:5px solid #1976d2;
    padding:7px 10px;
    margin-top:15px;
    font-weight:bold;
}

.action-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
}

.primary,
.success,
.gray,
.danger{
    border:0;
    border-radius:6px;
    color:white;
    padding:8px 12px;
}

.primary{
    background:#1976d2;
}

.success{
    background:#2e7d32;
}

.gray{
    background:#607d8b;
}

.danger{
    background:#c62828;
}

/* =========================
   QUESTIONS
========================= */

.question-box{
    border:1px solid #d5dde7;
    background:#fbfdff;
    border-radius:8px;
    padding:10px;
    margin-top:9px;
}

.question-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
}

.question-number{
    font-weight:bold;
    color:#0b3d91;
}

.remove-btn{
    border:0;
    background:#ef5350;
    color:white;
    border-radius:5px;
    padding:4px 8px;
}

.mcq-option{
    display:flex;
    align-items:center;
    gap:5px;
    margin-top:5px;
}

.mcq-option input{
    flex:1;
    border:1px solid #ccd5df;
    border-radius:5px;
    padding:7px;
}

/* =========================
   PREVIEW
========================= */

.preview-tools{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:10px;
}

.paper-stage{
    background:#dfe5ec;
    padding:20px;
    overflow:auto;
}

/*
   ORIGINAL A4 STYLE
   سوالات ایک ہی A4 page میں
   مسلسل ترتیب سے
*/

.a4{
    width:210mm;
    min-height:297mm;
    margin:0 auto;
    padding:13mm;
    background:#fff;
    color:#111;
    box-shadow:0 2px 12px #0003;
    direction:rtl;
    font-family:"Jameel Noori Nastaleeq",serif;
}

.a4-header{
    text-align:center;
    border-bottom:2px solid #111;
    padding-bottom:7px;
    margin-bottom:9px;
}

.a4-header h1{
    margin:0;
    font-family:Arial,sans-serif;
    font-size:24px;
}

.a4-header .exam-title{
    font-size:20px;
    font-weight:bold;
    margin-top:2px;
}

.a4-header .sub-title{
    font-size:16px;
}

.student-info{
    border:1px solid #333;
    padding:6px;
    margin-bottom:10px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:3px 15px;
    font-size:15px;
}

.student-info div{
    border-bottom:1px dotted #888;
    min-height:25px;
}

.question{
    font-size:17px;
    margin-bottom:10px;
    line-height:1.85;
}

.question-text{
    font-weight:bold;
}

.mcq-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:2px 25px;
    padding-right:25px;
    font-size:16px;
}

.answer-line{
    border-bottom:1px solid #999;
    height:35px;
    margin-top:3px;
}

.long-space{
    height:115px;
    border-bottom:1px dashed #aaa;
}

.paper-footer{
    margin-top:15px;
    border-top:1px solid #333;
    padding-top:5px;
    text-align:center;
    font-size:13px;
}

/* =========================
   NOTES
========================= */

.notes-preview{
    line-height:2.2;
}

.notes-preview h2{
    color:#0b3d91;
    border-bottom:1px solid #aaa;
    padding-bottom:3px;
}

.notes-preview h3{
    color:#174f8f;
}

.notes-preview p{
    margin:5px 0 12px;
}

/* =========================
   SAVED
========================= */

.saved-section{
    display:none;
}

.saved-section.active{
    display:block;
}

.saved-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.saved-card{
    background:white;
    padding:15px;
    border-radius:12px;
    box-shadow:0 2px 10px #0001;
}

.saved-card h2{
    color:#0b3d91;
    margin-top:0;
}

.saved-item{
    border:1px solid #d2dbe5;
    border-radius:8px;
    padding:10px;
    margin-top:8px;
    background:#fafcff;
}

.saved-name{
    font-weight:bold;
    font-size:17px;
}

.saved-date{
    color:#666;
    font-size:12px;
}

.saved-actions{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:7px;
}

.saved-actions button{
    border:0;
    color:white;
    border-radius:5px;
    padding:5px 8px;
}

.open-btn{
    background:#1976d2;
}

.print-btn{
    background:#455a64;
}

.download-btn{
    background:#2e7d32;
}

.delete-btn{
    background:#c62828;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:#0008;
    display:none;
    justify-content:center;
    align-items:center;
    padding:15px;
    z-index:9999;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:white;
    width:100%;
    max-width:420px;
    border-radius:12px;
    padding:20px;
}

.modal-box h2{
    margin-top:0;
    color:#0b3d91;
}

.modal-box input{
    width:100%;
    padding:10px;
    border:1px solid #bbb;
    border-radius:7px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

    .workspace{
        grid-template-columns:1fr;
    }

    .saved-grid{
        grid-template-columns:1fr;
    }

    .paper-stage{
        padding:5px;
    }

}

@media(max-width:600px){

    .brand h1{
        font-size:23px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .student-info{
        grid-template-columns:1fr;
    }

    .mcq-options{
        grid-template-columns:1fr;
    }

}

/* =========================
   PRINT
========================= */

@page{
    size:A4;
    margin:0;
}

@media print{

    body{
        background:#fff!important;
    }

    .no-print{
        display:none!important;
    }

    .paper-stage{
        padding:0!important;
        background:#fff!important;
    }

    .a4{
        width:210mm!important;
        min-height:297mm!important;
        margin:0!important;
        padding:13mm!important;
        box-shadow:none!important;
    }

}

.hidden{
    display:none!important;
}

</style>
</head>

<script>

/* =========================
   VARIABLES
========================= */

let currentTab="paper";

let questions=[];

let notes=[];

let saveType="";


/* =========================
   HELPER
========================= */

function $(id){
    return document.getElementById(id);
}


function esc(value){

    return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   TABS
========================= */

function showTab(tab){

    currentTab=tab;

    $("paperSection").classList.add("hidden");
    $("notesSection").classList.add("hidden");
    $("savedSection").classList.remove("active");

    $("paperTab").classList.remove("active");
    $("notesTab").classList.remove("active");
    $("savedTab").classList.remove("active");


    if(tab==="paper"){

        $("paperSection").classList.remove("hidden");
        $("paperTab").classList.add("active");

        updatePaper();

    }


    if(tab==="notes"){

        $("notesSection").classList.remove("hidden");
        $("notesTab").classList.add("active");

        updateNotes();

    }


    if(tab==="saved"){

        $("savedSection").classList.add("active");
        $("savedTab").classList.add("active");

        renderSaved();

    }

}


/* =========================
   QUESTION TYPES
========================= */

function questionTypeName(type){

    if(type==="mcq") return "MCQ";
    if(type==="short") return "Short Question";
    if(type==="long") return "Long Question";
    if(type==="fill") return "Fill in the Blank";
    if(type==="tf") return "True / False";

    return "";

}


/* =========================
   ADD QUESTION
========================= */

function addQuestion(type){

    questions.push({

        type:type,

        text:"",

        options:["","","",""],

        answer:""

    });

    renderQuestions();

}


/* =========================
   RENDER QUESTIONS
========================= */

function renderQuestions(){

    let html="";


    questions.forEach(function(q,index){

        html+=`

        <div class="question-box">

        <div class="question-head">

        <div class="question-number">
        سوال ${index+1} — ${questionTypeName(q.type)}
        </div>

        <button
        class="remove-btn"
        onclick="removeQuestion(${index})">
        حذف
        </button>

        </div>

        <div class="field">

        <label>Question</label>

        <textarea
        oninput="questions[${index}].text=this.value;updatePaper()"
        >${esc(q.text)}</textarea>

        </div>

        `;


        if(q.type==="mcq"){

            html+=`<div style="margin-top:7px"><b>Options:</b></div>`;


            q.options.forEach(function(op,i){

                html+=`

                <div class="mcq-option">

                <b>${String.fromCharCode(65+i)}.</b>

                <input
                value="${esc(op)}"
                oninput="
                questions[${index}].options[${i}]=this.value;
                updatePaper()
                ">

                </div>

                `;

            });

        }


        if(q.type==="tf"){

            html+=`

            <div class="field">

            <label>Answer</label>

            <select
            onchange="
            questions[${index}].answer=this.value;
            updatePaper()
            ">

            <option value="">Select</option>

            <option value="True"
            ${q.answer==="True"?"selected":""}>
            True
            </option>

            <option value="False"
            ${q.answer==="False"?"selected":""}>
            False
            </option>

            </select>

            </div>

            `;

        }


        if(q.type==="short" ||
           q.type==="long" ||
           q.type==="fill"){

            html+=`

            <div class="field">

            <label>Answer / Key (optional)</label>

            <textarea
            oninput="
            questions[${index}].answer=this.value
            ">${esc(q.answer)}</textarea>

            </div>

            `;

        }


        html+=`</div>`;

    });


    $("questions").innerHTML=html;

    updatePaper();

}


/* =========================
   REMOVE QUESTION
========================= */

function removeQuestion(index){

    questions.splice(index,1);

    renderQuestions();

}


/* =========================
   PAPER PREVIEW
========================= */

function noteTypeName(type){

    if(type==="heading") return "Heading";
    if(type==="qa") return "Question / Answer";
    if(type==="definition") return "Definition";
    if(type==="points") return "Key Points";
    if(type==="detail") return "Detailed Text";
    if(type==="mcq") return "MCQ";

    return "";

}


function addNote(type){

    notes.push({

        type:type,

        title:"",

        question:"",

        answer:"",

        text:"",

        options:["","","",""]

    });

    renderNotes();

}


function renderNotes(){

    let html="";


    notes.forEach(function(n,index){

        html+=`

        <div class="question-box">

        <div class="question-head">

        <b>

        </b>

        <button
        class="remove-btn"

        if(n.type==="heading"){

            html+=`

            notes[${index}].title=this.value;

        }


        if(n.type==="qa"){

            html+=`

            updateNotes()

            <textarea

        }


        if(n.type==="definition"){

            html+=`

/* =========================

function downloadFile(filename,html){

    let blob=new Blob(
        [html],
        {type:"text/html;charset=utf-8"}
    );


    let url=URL.createObjectURL(blob);

    let a=document.createElement("a");

    a.href=url;

    a.download=filename;

    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(function(){

        URL.revokeObjectURL(url);

    },1000);

}

    $("nsubject").value=n.subject || "";

    $("nchapter").value=n.chapter || "";

    notes=n.notes || [];


    renderQuestions();

    renderNotes();


    alert("Draft Load ہوگیا۔");

}
