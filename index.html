<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Risen High School Paper and Notes</title>

<style>

/* =========================================================
   JAMEEL NOORI NASTALEEQ
   ========================================================= */

@font-face{
    font-family:"Jameel Noori Nastaleeq";
    src:url("https://cdn.jsdelivr.net/gh/tariq-abdullah/urdu-web-font-CDN/JameelNooriNastaleeq.woff")
    format("woff");
    font-display:swap;
}

:root{
    --primary:#1457d9;
    --primary2:#0b3d91;
    --secondary:#eef4ff;
    --success:#138a4b;
    --danger:#d93636;
    --warning:#e69b00;
    --dark:#172033;
    --muted:#6b7280;
    --white:#ffffff;
    --border:#d9e0eb;
    --bg:#f3f6fb;
    --shadow:0 8px 30px rgba(0,0,0,.08);
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--dark);
    font-family:
        "Jameel Noori Nastaleeq",
        "Noto Nastaliq Urdu",
        "Segoe UI",
        Arial,
        sans-serif;

    font-variant-ligatures:normal;
    font-feature-settings:normal;
    text-rendering:optimizeLegibility;
}

input,
select,
textarea,
button,
.en{
    font-family:"Segoe UI",Arial,sans-serif;
}

.urdu{
    font-family:
        "Jameel Noori Nastaleeq",
        "Noto Nastaliq Urdu",
        serif;
}

button{
    cursor:pointer;
}

.app{
    min-height:100vh;
}

/* =========================================================
   TOP HEADER - CENTERED
   ========================================================= */

.topbar{
    background:
        linear-gradient(135deg,#0b3d91,#1457d9,#2879ef);

    color:white;
    padding:20px 15px;
    box-shadow:0 4px 20px rgba(0,0,0,.18);
}

.topbar-inner{
    max-width:1500px;
    margin:auto;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;
    gap:14px;
}

.brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
}

.logo-box{
    width:68px;
    height:68px;
    border-radius:16px;
    background:white;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    border:3px solid rgba(255,255,255,.8);

    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.logo-box img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.logo-placeholder{
    color:#1457d9;
    font-size:30px;
    font-weight:900;
}

.brand-text{
    width:100%;
    text-align:center;
}

.brand h1{
    margin:0;
    font-family:"Segoe UI",Arial,sans-serif;
    font-size:27px;
    line-height:1.25;
    font-weight:900;
}

.brand p{
    margin:4px 0 0;
    opacity:.95;
    font-family:"Segoe UI",Arial,sans-serif;
    font-size:15px;
}

.header-buttons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:8px;
}

.header-buttons button{
    border:none;
    border-radius:9px;
    padding:10px 14px;
    background:rgba(255,255,255,.17);
    color:white;
    font-weight:bold;
}

.header-buttons button:hover{
    background:rgba(255,255,255,.30);
}

/* =========================================================
   MAIN
   ========================================================= */

.main{
    max-width:1500px;
    margin:auto;
    padding:20px;
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    background:white;
    padding:8px;
    border-radius:14px;
    box-shadow:var(--shadow);
}

.tab{
    flex:1;
    border:none;
    padding:14px;
    border-radius:10px;
    background:#f1f4f9;
    color:#394150;
    font-size:17px;
    font-weight:bold;
}

.tab.active{
    background:var(--primary);
    color:white;
}

.workspace{
    display:grid;
    grid-template-columns:minmax(330px,520px) minmax(500px,1fr);
    gap:20px;
    align-items:start;
}

.panel{
    background:white;
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:18px;
}

.panel-title{
    margin:0 0 15px;
    font-size:22px;
    color:var(--primary2);
    border-bottom:2px solid var(--secondary);
    padding-bottom:10px;
}

/* =========================================================
   FORM
   ========================================================= */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.form-group{
    margin-bottom:12px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    display:block;
    font-weight:bold;
    margin-bottom:5px;
    color:#334155;
}

input,
select,
textarea{
    width:100%;
    border:1px solid var(--border);
    border-radius:9px;
    padding:10px 12px;
    font-size:15px;
    outline:none;
    background:white;
}

input:focus,
select:focus,
textarea:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(20,87,217,.10);
}

textarea{
    min-height:80px;
    resize:vertical;
}

textarea.urdu-input,
input.urdu-input{
    direction:rtl;
    text-align:right;
    font-family:
        "Jameel Noori Nastaleeq",
        "Noto Nastaliq Urdu",
        serif;
    font-size:18px;
}

.section-box{
    margin-top:18px;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
}

.section-head{
    background:#f5f8fd;
    padding:11px 13px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;

    border-bottom:1px solid var(--border);
}

.section-head h3{
    margin:0;
    color:var(--primary2);
    font-size:18px;
}

.add-btn{
    background:var(--success);
    color:white;
    border:none;
    border-radius:8px;
    padding:8px 12px;
    font-weight:bold;
}

.items{
    padding:10px;
}

.item{
    border:1px solid #e1e6ef;
    border-radius:10px;
    padding:12px;
    margin-bottom:10px;
    background:#fff;
}

.item:last-child{
    margin-bottom:0;
}

.item-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
    gap:10px;
}

.item-number{
    font-weight:bold;
    color:var(--primary);
}

.remove-btn{
    border:none;
    background:#fff0f0;
    color:var(--danger);
    padding:6px 9px;
    border-radius:7px;
    font-weight:bold;
}

.small-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.mcq-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:8px;
}

.option-wrap{
    display:flex;
    gap:6px;
    align-items:center;
}

.option-letter{
    width:27px;
    height:27px;
    border-radius:50%;
    background:#eaf1ff;
    color:var(--primary);

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:bold;
    flex:none;
}

/* =========================================================
   BUTTONS
   ========================================================= */

.toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;

    margin-top:18px;
    padding-top:15px;

    border-top:1px solid var(--border);
}

.btn{
    border:none;
    border-radius:9px;
    padding:10px 14px;
    font-weight:bold;
    font-size:14px;
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-success{
    background:var(--success);
    color:white;
}

.btn-danger{
    background:var(--danger);
    color:white;
}

.btn-secondary{
    background:#e9eef6;
    color:#273449;
}

.btn-warning{
    background:#fff2cc;
    color:#825f00;
}

/* =========================================================
   PREVIEW
   ========================================================= */

.preview-panel{
    position:sticky;
    top:10px;
}

.preview-tools{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
}

.preview-tools h2{
    margin:0;
    color:var(--primary2);
}

.paper-stage{
    background:#dce2eb;
    padding:25px 10px;
    border-radius:12px;
    overflow:auto;
    min-height:500px;
}

/* =========================================================
   A4
   ========================================================= */

.a4{
    width:210mm;
    min-height:297mm;

    background:white;

    margin:0 auto;

    padding:14mm;

    color:#111;

    box-shadow:0 5px 25px rgba(0,0,0,.15);

    position:relative;

    direction:rtl;

    font-family:
        "Jameel Noori Nastaleeq",
        "Noto Nastaliq Urdu",
        serif;

    font-variant-ligatures:normal;
    font-feature-settings:normal;
}

.paper-header{
    text-align:center;
    border-bottom:2px solid #111;
    padding-bottom:7px;
    margin-bottom:8px;
}

.preview-school{
    font-family:"Segoe UI",Arial,sans-serif;
    font-weight:900;
    font-size:22px;
    direction:ltr;
}

.preview-exam{
    font-size:21px;
    font-weight:bold;
    margin-top:3px;
}

.preview-meta{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:6px;

    font-family:"Segoe UI",Arial,sans-serif;

    direction:ltr;

    font-size:12px;

    margin-top:7px;
}

.meta-cell{
    border:1px solid #111;
    padding:4px 5px;
    min-height:25px;
}

.student-row{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr;

    direction:ltr;

    margin:8px 0;

    border:1px solid #111;
}

.student-cell{
    min-height:29px;
    padding:5px;

    border-right:1px solid #111;

    font-family:"Segoe UI",Arial,sans-serif;

    font-size:12px;
}

.student-cell:last-child{
    border-right:none;
}

.paper-section{
    margin-top:13px;
}

.paper-section-title{
    font-size:18px;
    font-weight:bold;

    border-bottom:1px solid #111;

    padding-bottom:2px;
    margin-bottom:5px;
}

.mcq-preview{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px 20px;
}

.mcq-preview-item{
    break-inside:avoid;
}

.mcq-options-preview{
    display:grid;
    grid-template-columns:1fr 1fr;

    font-family:
        "Jameel Noori Nastaleeq",
        serif;

    font-size:14px;

    margin-top:2px;
}

.q-row{
    display:flex;
    gap:7px;
    margin-bottom:8px;
    line-height:1.8;
    break-inside:avoid;
}

.q-number{
    font-weight:bold;
    min-width:25px;
}

.long-answer{
    margin-bottom:12px;
    break-inside:avoid;
}

.answer-lines{
    height:65px;
    margin-top:4px;

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 22px,
            #999 23px
        );
}

.fill-row{
    margin-bottom:8px;
    line-height:1.8;
}

.truefalse{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    margin-bottom:7px;
}

.tf-options{
    font-family:"Segoe UI",Arial,sans-serif;
    white-space:nowrap;
}

.paper-footer{
    position:absolute;

    bottom:7mm;
    left:14mm;
    right:14mm;

    border-top:1px solid #555;

    padding-top:3px;

    display:flex;
    justify-content:space-between;

    font-family:"Segoe UI",Arial,sans-serif;
    font-size:10px;
}

/* =========================================================
   NOTES
   ========================================================= */

.notes-page{
    min-height:297mm;
}

.notes-title{
    text-align:center;
    font-size:28px;
    font-weight:bold;

    border-bottom:2px solid #111;

    padding-bottom:6px;
}

.notes-info{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:5px;
    margin:10px 0;
}

.notes-info div{
    border:1px solid #222;
    padding:5px;
    font-size:13px;
}

.note-block{
    margin:15px 0;
    break-inside:avoid;
}

.note-heading{
    background:#eef3fb;
    border-right:5px solid #1457d9;

    padding:6px 9px;

    font-size:20px;
    font-weight:bold;
}

.note-question{
    font-size:19px;
    font-weight:bold;
    margin-top:8px;
}

.note-answer{
    font-size:18px;
    line-height:2.05;
    margin-top:4px;
}

.definition{
    border:1px solid #555;
    padding:8px;
    margin-top:8px;
    font-size:18px;
    line-height:2;
}

.keypoints{
    font-size:18px;
    line-height:2;
}

.keypoints div{
    margin-bottom:2px;
}

.notes-mcq{
    margin-top:7px;
    font-size:17px;
}

.notes-mcq-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:3px 15px;
    margin-top:3px;
}

/* =========================================================
   NOTES EDITOR
   ========================================================= */

.note-editor{
    border:1px solid #e1e6ef;
    border-radius:10px;
    padding:12px;
    margin-bottom:10px;
}

.note-editor select{
    margin-bottom:8px;
}

.note-fields{
    display:block;
}

.hidden{
    display:none !important;
}

.empty-message{
    text-align:center;
    color:#888;
    padding:20px;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:1000px){

    .workspace{
        grid-template-columns:1fr;
    }

    .preview-panel{
        position:relative;
        top:auto;
    }
}

@media(max-width:650px){

    .main{
        padding:10px;
    }

    .topbar{
        padding:15px 10px;
    }

    .brand h1{
        font-size:21px;
    }

    .brand p{
        font-size:13px;
    }

    .logo-box{
        width:60px;
        height:60px;
    }

    .header-buttons{
        width:100%;
    }

    .header-buttons button{
        flex:1;
        min-width:100px;
    }

    .tabs{
        flex-direction:column;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .small-grid,
    .mcq-options{
        grid-template-columns:1fr;
    }

    .preview-tools{
        flex-direction:column;
        align-items:stretch;
    }

    .paper-stage{
        padding:10px 0;
    }
}

/* =========================================================
   PRINT - FIXED
   ========================================================= */

@page{
    size:A4;
    margin:0;
}

@media print{

    html,
    body{
        background:#fff !important;
        margin:0 !important;
        padding:0 !important;
    }

    /*
       پہلے سب کچھ hidden
       پھر صرف مطلوبہ print area visible
    */

    body *{
        visibility:hidden !important;
    }

    /* =====================================================
       PAPER PRINT
       ===================================================== */

    body.print-paper #printArea,
    body.print-paper #printArea *{
        visibility:visible !important;
    }

    body.print-paper #printArea{
        display:block !important;

        position:absolute !important;

        left:0 !important;
        top:0 !important;

        width:210mm !important;

        margin:0 !important;
        padding:0 !important;
    }

    body.print-paper #paperSection{
        display:block !important;
    }

    body.print-paper #notesSection{
        display:none !important;
    }

    /* =====================================================
       NOTES PRINT
       ===================================================== */

    body.print-notes #notesPrintArea,
    body.print-notes #notesPrintArea *{
        visibility:visible !important;
    }

    body.print-notes #notesPrintArea{
        display:block !important;

        position:absolute !important;

        left:0 !important;
        top:0 !important;

        width:210mm !important;

        margin:0 !important;
        padding:0 !important;
    }

    body.print-notes #paperSection{
        display:none !important;
    }

    body.print-notes #notesSection{
        display:block !important;
    }

    /* =====================================================
       A4
       ===================================================== */

    .a4{
        width:210mm !important;
        min-height:297mm !important;

        margin:0 !important;

        padding:14mm !important;

        box-shadow:none !important;

        background:#fff !important;
    }

    /* =====================================================
       HIDE UI
       ===================================================== */

    .no-print,
    .preview-tools,
    .toolbar,
    .topbar,
    .tabs{
        display:none !important;
    }

    .paper-footer{
        position:absolute !important;
    }
}

</style>
</head>

<body>

<div class="app">

<!-- =========================================================
     TOP HEADER
     ========================================================= -->

<header class="topbar no-print">

    <div class="topbar-inner">

        <div class="brand">

            <div class="logo-box">

                <img
                    id="headerLogo"
                    class="hidden"
                    alt="School Logo">

                <div
                    id="logoPlaceholder"
                    class="logo-placeholder">

                    R

                </div>

            </div>

            <div class="brand-text">

                <h1>
                    The Risen High School
                </h1>

                <p>
                    Paper & Notes Maker
                </p>

            </div>

        </div>


        <div class="header-buttons">

            <button onclick="saveDraft()">
                💾 Save
            </button>

            <button onclick="loadDraft()">
                📂 Load
            </button>

            <button onclick="clearAll()">
                🗑 Clear
            </button>

            <button onclick="printDocument()">
                🖨 Print / PDF
            </button>

        </div>

    </div>

</header>


<!-- =========================================================
     MAIN
     ========================================================= -->

<main class="main">

    <!-- TABS -->

    <div class="tabs">

        <button
            class="tab active"
            id="paperTab"
            onclick="showTab('paper')">

            📄 Paper Maker

        </button>

        <button
            class="tab"
            id="notesTab"
            onclick="showTab('notes')">

            📚 Notes Maker

        </button>

    </div>


    <!-- =====================================================
         PAPER MAKER
         ===================================================== -->

    <section id="paperSection">

        <div class="workspace">

            <!-- EDITOR -->

            <div class="panel">

                <h2 class="panel-title">
                    📄 Paper Settings
                </h2>


                <div class="form-grid">

                    <div class="form-group full">

                        <label>
                            School Name
                        </label>

                        <input
                            id="schoolName"
                            value="The Risen High School"
                            oninput="updatePaper()">

                    </div>


                    <div class="form-group">

                        <label>
                            Exam / Test
                        </label>

                        <input
                            id="examName"
                            value="Monthly Test"
                            oninput="updatePaper()">

                    </div>


                    <div class="form-group">

                        <label>
                            Class
                        </label>

                        <select
                            id="paperClass"
                            onchange="updatePaper()">

                            <option>Playgroup</option>
                            <option>Nursery</option>
                            <option>Prep</option>
                            <option>1st</option>
                            <option>2nd</option>
                            <option>3rd</option>
                            <option>4th</option>
                            <option>5th</option>
                            <option>6th</option>
                            <option>7th</option>
                            <option>8th</option>
                            <option selected>9th</option>
                            <option>10th</option>
                            <option>11th / FA Part 1</option>
                            <option>12th / FA Part 2</option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Subject
                        </label>

                        <input
                            id="paperSubject"
                            placeholder="مثلاً طبیعیات"
                            oninput="updatePaper()">

                    </div>


                    <div class="form-group">

                        <label>
                            Chapter / Unit
                        </label>

                        <input
                            id="paperChapter"
                            placeholder="Chapter 1"
                            oninput="updatePaper()">

                    </div>


                    <div class="form-group">

                        <label>
                            Date
                        </label>

                        <input
                            type="date"
                            id="paperDate"
                            onchange="updatePaper()">

                    </div>


                    <div class="form-group">

                        <label>
                            Time
                        </label>

                        <input
                            id="paperTime"
                            value="2 Hours"
                            oninput="updatePaper()">

                    </div>


                    <div class="form-group">

                        <label>
                            Total Marks
                        </label>

                        <input
                            type="number"
                            id="totalMarks"
                            value="50"
                            oninput="updatePaper()">

                    </div>

                </div>


                <!-- STUDENT -->

                <div class="section-box">

                    <div class="section-head">

                        <h3>
                            👨‍🎓 Student Information
                        </h3>

                    </div>

                    <div class="items">

                        <div class="form-grid">

                            <div class="form-group">

                                <label>
                                    Student Name
                                </label>

                                <input
                                    id="studentName"
                                    placeholder="نام طالب علم"
                                    oninput="updatePaper()">

                            </div>


                            <div class="form-group">

                                <label>
                                    Roll Number
                                </label>

                                <input
                                    id="rollNumber"
                                    oninput="updatePaper()">

                            </div>


                            <div class="form-group">

                                <label>
                                    Section
                                </label>

                                <input
                                    id="sectionName"
                                    oninput="updatePaper()">

                            </div>


                            <div class="form-group">

                                <label>
                                    Teacher
                                </label>

                                <input
                                    id="teacherName"
                                    value="Sir Rana Faisal"
                                    oninput="updatePaper()">

                            </div>

                        </div>

                    </div>

                </div>


                <!-- LOGO -->

                <div class="section-box">

                    <div class="section-head">

                        <h3>
                            🏫 School Logo
                        </h3>

                    </div>

                    <div class="items">

                        <input

/* =========================================================
   HELPERS
   ========================================================= */

function escapeHTML(value){

    if(value===null || value===undefined){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function nl2br(value){

    return escapeHTML(value||"")
        .replace(/\n/g,"<br>");
}


function get(id){

    return document.getElementById(id);

}


/* =========================================================
   TAB
   ========================================================= */

function showTab(tab){

    currentTab=tab;

    if(tab==="paper"){

        get("paperSection").classList.remove("hidden");
        get("notesSection").classList.add("hidden");

        get("paperTab").classList.add("active");
        get("notesTab").classList.remove("active");

        updatePaper();

    }else{

        get("paperSection").classList.add("hidden");
        get("notesSection").classList.remove("hidden");

        get("paperTab").classList.remove("active");
        get("notesTab").classList.add("active");

        updateNotes();

    }
}


/* =========================================================

   ========================================================= */

function setToday(){

    const today=new Date();

    const y=today.getFullYear();

    const m=String(today.getMonth()+1).padStart(2,"0");

    const d=String(today.getDate()).padStart(2,"0");

    get("paperDate").value=`${y}-${m}-${d}`;
}

        question:"",
        options:["","","",""],
        answer:""

    mcqs.push(data);

    renderMCQs();
    updatePaper();
}


function removeMCQ(index){

    mcqs.splice(index,1);

    renderMCQs();
    updatePaper();
}


function renderMCQs(){

    const box=get("mcqEditor");

    box.innerHTML="";

    if(mcqs.length===0){

            </div>


            <textarea

            <div class="mcq-options">

                ${["A","B","C","D"].map((letter,i)=>`

                    <div class="option-wrap">

                        <span class="option-letter">

                        <input

                        B

                    <option value="C" ${mcq.answer==="C"?"selected":""}>

                    </option>

        box.appendChild(item);

    });

/* =========================================================
   PAPER PREVIEW
   ========================================================= */

function updatePaper(){

    const school=get("schoolName").value;
    const exam=get("examName").value;
    const cls=get("paperClass").value;
    const subject=get("paperSubject").value;
    const chapter=get("paperChapter").value;
    const date=get("paperDate").value;
    const time=get("paperTime").value;
    const marks=get("totalMarks").value;

    const student=get("studentName").value;
    const roll=get("rollNumber").value;
    const section=get("sectionName").value;
    const teacher=get("teacherName").value;


    let dateText="";


    if(date){

        const dt=new Date(date+"T00:00:00");

        dateText=dt.toLocaleDateString(
            "en-GB",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric"
            }
        );
    }


    let html=`

        <div class="paper-header">

            <div class="preview-school">
                ${escapeHTML(
                    school || "The Risen High School"
                )}
            </div>


            <div class="preview-exam">
                ${escapeHTML(exam || "Test")}
            </div>


            <div style="font-size:17px">
                ${escapeHTML(subject || "")}
            </div>


            ${
                chapter
                ?
                `
                <div style="font-size:15px">
                    ${escapeHTML(chapter)}
                </div>
                `
                :
                ""
            }


            <div class="preview-meta">

                <div class="meta-cell">
                    Class: ${escapeHTML(cls)}
                </div>

                <div class="meta-cell">
                    Time: ${escapeHTML(time)}
                </div>

                <div class="meta-cell">
                    Total Marks: ${escapeHTML(marks)}
                </div>

                <div class="meta-cell">
                    Date: ${escapeHTML(dateText)}
                </div>

                <div class="meta-cell">
                    Teacher: ${escapeHTML(teacher)}
                </div>

                <div class="meta-cell">
                    The Risen High School
                </div>

            </div>

        </div>


        <div class="student-row">

            <div class="student-cell">
                Name: ${escapeHTML(student)}
            </div>

            <div class="student-cell">
                Roll No: ${escapeHTML(roll)}
            </div>

            <div class="student-cell">
                Section: ${escapeHTML(section)}
            </div>

            <div class="student-cell">
                Marks: ______
            </div>

        </div>

    `;


    /* MCQs */

    if(mcqs.length){

        html+=`

            <div class="paper-section">

                <div class="paper-section-title">
                    حصہ اوّل: کثیر الانتخابی سوالات (MCQs)
                </div>

                <div class="mcq-preview">

        `;


        mcqs.forEach((mcq,index)=>{

            html+=`

                <div class="mcq-preview-item">

                    <div>

                        <strong>
                            ${index+1}۔
                        </strong>

                        ${nl2br(mcq.question)}

                    </div>


                    <div class="mcq-options-preview">

                        <div>
                            ⓐ ${escapeHTML(
                                mcq.options[0] || ""
                            )}
                        </div>

                        <div>
                            ⓑ ${escapeHTML(
                                mcq.options[1] || ""
                            )}
                        </div>

                        <div>
                            ⓒ ${escapeHTML(
                                mcq.options[2] || ""
                            )}
                        </div>

                        <div>
                            ⓓ ${escapeHTML(
                                mcq.options[3] || ""
                            )}
                        </div>

                    </div>

                </div>

            `;

        });


        html+=`

                </div>

            </div>

        `;
    }


    /* SHORT */

    if(shorts.length){

        html+=`

            <div class="paper-section">

                <div class="paper-section-title">
                    حصہ دوم: مختصر سوالات
                </div>

        `;


        shorts.forEach((item,index)=>{

            html+=`

                <div class="q-row">

                    <div class="q-number">
                        ${index+1}.
                    </div>

                    <div>
                        ${nl2br(item.question)}
                    </div>

                </div>

            `;

        });


        html+=`</div>`;
    }


    /* LONG */

    if(longs.length){

        html+=`

            <div class="paper-section">

                <div class="paper-section-title">
                    حصہ سوم: تفصیلی سوالات
                </div>

        `;


        longs.forEach((item,index)=>{

            html+=`

                <div class="long-answer">

                    <div>

                        <strong>
                            ${index+1}۔
                        </strong>

                        ${nl2br(item.question)}

                    </div>

                    <div class="answer-lines"></div>

                </div>

            `;

        });


        html+=`</div>`;
    }


    /* FILL */

    if(fills.length){

        html+=`

            <div class="paper-section">

                <div class="paper-section-title">
                    خالی جگہیں پُر کریں
                </div>

        `;


        fills.forEach((item,index)=>{

            html+=`

                <div class="fill-row">

                    ${index+1}۔
                    ${nl2br(item.question)}

                </div>

            `;

        });


        html+=`</div>`;
    }


    /* TRUE FALSE */

    if(tfs.length){

        html+=`

            <div class="paper-section">

                <div class="paper-section-title">
                    درست / غلط
                </div>

        `;


        tfs.forEach((item,index)=>{

            html+=`

                <div class="truefalse">

                    <div>
                        ${index+1}۔
                        ${nl2br(item.statement)}
                    </div>

                    <div class="tf-options">
                        ☐ درست
                        &nbsp;&nbsp;
                        ☐ غلط
                    </div>

                </div>

            `;

        });


        html+=`</div>`;
    }


    /* EMPTY */

    if(
        !mcqs.length &&
        !shorts.length &&
        !longs.length &&
        !fills.length &&
        !tfs.length
    ){

        html+=`

            <div style="
                text-align:center;
                padding:50px 20px;
                font-size:20px;
                color:#777;
            ">

                یہاں آپ کے سوالات کا پرچہ ظاہر ہوگا۔

                <br>

                بائیں طرف سے MCQs یا سوالات شامل کریں۔

            </div>

        `;
    }


    html+=`

        <div class="paper-footer">

            <span>
                ${escapeHTML(
                    school || "The Risen High School"
                )}
            </span>

            <span>
                Teacher:
                ${escapeHTML(teacher)}
            </span>

            <span>
                Signature: __________
            </span>

        </div>

    `;


    get("paperPreview").innerHTML=html;
}


/* =========================================================

   ========================================================= */

function addNoteBlock(data){

    data=data||{

        type:"heading",

        heading:"",
        question:"",
        answer:"",
        definition:"",
        points:"",
        mcqQuestion:"",

        options:["","","",""]

    };


    noteBlocks.push(data);

    renderNotesEditor();
    updateNotes();
}


function removeNoteBlock(index){

    noteBlocks.splice(index,1);

    renderNotesEditor();
    updateNotes();
}


function changeNoteType(index,type){

    noteBlocks[index].type=type;

    renderNotesEditor();
    updateNotes();
}


function renderNotesEditor(){

    const box=get("notesEditor");

    box.innerHTML="";


    if(noteBlocks.length===0){

        box.innerHTML=`
            <div class="empty-message">
                ابھی کوئی Note شامل نہیں کیا گیا۔
            </div>
        `;

        return;
    }


    noteBlocks.forEach((note,index)=>{

        const div=document.createElement("div");

        div.className="note-editor";


        let fields="";


        if(note.type==="heading"){

            fields=`

                <input
                    class="urdu-input"
                    placeholder="Heading / عنوان"
                    value="${escapeHTML(note.heading)}"
                    oninput="
                        noteBlocks[${index}].heading=this.value;
                        updateNotes()
                    ">

            `;
        }


        if(note.type==="qa"){

            fields=`

                <textarea
                    class="urdu-input"
                    placeholder="سوال"
                    oninput="
                        noteBlocks[${index}].question=this.value;
                        updateNotes()
                    ">${escapeHTML(note.question)}</textarea>


                <textarea
                    class="urdu-input"
                    style="margin-top:8px"
                    placeholder="جواب"
                    oninput="
                        noteBlocks[${index}].answer=this.value;
                        updateNotes()
                    ">${escapeHTML(note.answer)}</textarea>

            `;
        }


        if(note.type==="definition"){

            fields=`

                <input
                    class="urdu-input"
                    placeholder="اصطلاح / تعریف کا عنوان"
                    value="${escapeHTML(note.heading)}"
                    oninput="
                        noteBlocks[${index}].heading=this.value;
                        updateNotes()
                    ">


                <textarea
                    class="urdu-input"
                    style="margin-top:8px"
                    placeholder="تعریف"
                    oninput="
                        noteBlocks[${index}].definition=this.value;
                        updateNotes()
                    ">${escapeHTML(note.definition)}</textarea>

            `;
        }


        if(note.type==="points"){

            fields=`

                <input
                    class="urdu-input"
                    placeholder="Heading"
                    value="${escapeHTML(note.heading)}"
                    oninput="
                        noteBlocks[${index}].heading=this.value;
                        updateNotes()
                    ">


                <textarea
                    class="urdu-input"
                    style="margin-top:8px"
                    placeholder="ہر اہم نکتہ نئی لائن میں لکھیں"
                    oninput="
                        noteBlocks[${index}].points=this.value;
                        updateNotes()
                    ">${escapeHTML(note.points)}</textarea>

            `;
        }


        if(note.type==="text"){

            fields=`

                <textarea
                    class="urdu-input"
                    placeholder="تفصیلی نوٹس لکھیں"
                    oninput="
                        noteBlocks[${index}].answer=this.value;
                        updateNotes()
                    ">${escapeHTML(note.answer)}</textarea>

            `;
        }


        if(note.type==="mcq"){

            fields=`

                <textarea
                    class="urdu-input"
                    placeholder="MCQ سوال"
                    oninput="
                        noteBlocks[${index}].mcqQuestion=this.value;
                        updateNotes()
                    ">${escapeHTML(note.mcqQuestion)}</textarea>


                <div class="mcq-options">

                    ${["A","B","C","D"].map((letter,i)=>`

                        <div class="option-wrap">

                            <span class="option-letter">
                                ${letter}
                            </span>

                            <input
                                class="urdu-input"
                                placeholder="Option ${letter}"
                                value="${escapeHTML(
                                    note.options[i] || ""
                                )}"
                                oninput="
                                    noteBlocks[${index}].options[${i}]=this.value;
                                    updateNotes()
                                ">

                        </div>

                    `).join("")}

                </div>

            `;
        }


        div.innerHTML=`

            <div class="item-top">

                <strong>
                    Note ${index+1}
                </strong>

                <button
                    class="remove-btn"
                    onclick="removeNoteBlock(${index})">

                    حذف کریں

                </button>

            </div>


            <select
                onchange="
                    changeNoteType(
                        ${index},
                        this.value
                    )
                ">

                <option
                    value="heading"
                    ${note.type==="heading"?"selected":""}>

                    Heading

                </option>


                <option
                    value="qa"
                    ${note.type==="qa"?"selected":""}>

                    Question / Answer

                </option>


                <option
                    value="definition"
                    ${note.type==="definition"?"selected":""}>

                    Definition

                </option>


                <option
                    value="points"
                    ${note.type==="points"?"selected":""}>

                    Key Points

                </option>


                <option
                    value="text"
                    ${note.type==="text"?"selected":""}>

                    Detailed Text

                </option>


                <option
                    value="mcq"
                    ${note.type==="mcq"?"selected":""}>

                    MCQ

                </option>

            </select>


            <div class="note-fields">

                ${fields}

            </div>

        `;


        box.appendChild(div);

    });
}


/* =========================================================
   NOTES PREVIEW
   ========================================================= */

function updateNotes(){

    const school=get("notesSchool").value;
    const cls=get("notesClass").value;
    const subject=get("notesSubject").value;
    const chapter=get("notesChapter").value;
    const topic=get("notesTopic").value;


    let html=`

        <div class="notes-title">

            ${escapeHTML(
                school || "The Risen High School"
            )}

            <div style="font-size:20px">
                تعلیمی نوٹس
            </div>

        </div>


        <div class="notes-info">

            <div>
                جماعت:
                ${escapeHTML(cls)}
            </div>

            <div>
                مضمون:
                ${escapeHTML(subject)}
            </div>

            <div>
                باب:
                ${escapeHTML(chapter)}
            </div>

        </div>


        ${
            topic
            ?
            `
            <div style="
                text-align:center;
                font-size:22px;
                font-weight:bold;
                margin:10px 0;
            ">

                ${escapeHTML(topic)}

            </div>
            `
            :
            ""
        }

    `;


    noteBlocks.forEach((note,index)=>{

        if(note.type==="heading"){

            html+=`

                <div class="note-block">

                    <div class="note-heading">

                        ${escapeHTML(note.heading)}

                    </div>

                </div>

            `;
        }


        if(note.type==="qa"){

            html+=`

                <div class="note-block">

                    <div class="note-question">

                        ${index+1}۔

                        ${nl2br(note.question)}

                    </div>


                    <div class="note-answer">

                        <strong>
                            جواب:
                        </strong>

                        ${nl2br(note.answer)}

                    </div>

                </div>

            `;
        }


        if(note.type==="definition"){

            html+=`

                <div class="note-block">

                    <div class="note-heading">

                        ${escapeHTML(note.heading)}

                    </div>


                    <div class="definition">

                        ${nl2br(note.definition)}

                    </div>

                </div>

            `;
        }


        if(note.type==="points"){

            const points=(note.points||"")
                .split("\n")
                .filter(x=>x.trim()!=="");


            html+=`

                <div class="note-block">

                    <div class="note-heading">

                        ${escapeHTML(note.heading)}

                    </div>


                    <div class="keypoints">

                        ${points.map((p,i)=>`

                            <div>

                                ${i+1}۔
                                ${escapeHTML(p)}

                            </div>

                        `).join("")}

                    </div>

                </div>

            `;
        }


        if(note.type==="text"){

            html+=`

                <div class="note-block">

                    <div class="note-answer">

                        ${nl2br(note.answer)}

                    </div>

                </div>

            `;
        }


        if(note.type==="mcq"){

            html+=`

                <div class="note-block">

                    <div class="note-question">

                        ${index+1}۔

                        ${nl2br(note.mcqQuestion)}

                    </div>


                    <div class="notes-mcq-options">

                        <div>
                            ⓐ
                            ${escapeHTML(
                                note.options[0] || ""
                            )}
                        </div>

                        <div>
                            ⓑ
                            ${escapeHTML(
                                note.options[1] || ""
                            )}
                        </div>

                        <div>
                            ⓒ
                            ${escapeHTML(
                                note.options[2] || ""
                            )}
                        </div>

                        <div>
                            ⓓ
                            ${escapeHTML(
                                note.options[3] || ""
                            )}
                        </div>

                    </div>

                </div>

            `;
        }

    });


    if(noteBlocks.length===0){

        html+=`

            <div style="
                text-align:center;
                padding:70px 20px;
                color:#777;
                font-size:21px;
            ">

                یہاں آپ کے نوٹس نظر آئیں گے۔

                <br>

                بائیں طرف سے + Add Note دبائیں۔

            </div>

        `;
    }


    get("notesPreview").innerHTML=html;
}


/* =========================================================
   LOGO
   ========================================================= */

function uploadLogo(event){

    const file=event.target.files[0];

    if(!file){
        return;
    }


    const reader=new FileReader();


    reader.onload=function(e){

        logoData=e.target.result;

        get("headerLogo").src=logoData;

        get("headerLogo").classList.remove("hidden");

        get("logoPlaceholder").classList.add("hidden");

    };


    reader.readAsDataURL(file);
}


/* =========================================================
   SAVE
   ========================================================= */

function collectData(){

    return {

        currentTab,

        paperInputs:{

            schoolName:get("schoolName").value,
            examName:get("examName").value,
            paperClass:get("paperClass").value,
            paperSubject:get("paperSubject").value,
            paperChapter:get("paperChapter").value,
            paperDate:get("paperDate").value,
            paperTime:get("paperTime").value,
            totalMarks:get("totalMarks").value,
            studentName:get("studentName").value,
            rollNumber:get("rollNumber").value,
            sectionName:get("sectionName").value,
            teacherName:get("teacherName").value

        },


        notesInputs:{

            notesSchool:get("notesSchool").value,
            notesClass:get("notesClass").value,
            notesSubject:get("notesSubject").value,
            notesChapter:get("notesChapter").value,
            notesTopic:get("notesTopic").value

        },


        mcqs,
        shorts,
        longs,
        fills,
        tfs,
        noteBlocks,
        logoData

    };
}


function saveDraft(){

    try{

        localStorage.setItem(
            "risenPaperNotesDraft",
            JSON.stringify(collectData())
        );

        alert("Draft محفوظ ہو گیا ہے۔");

    }catch(e){

        alert(
            "Draft save نہیں ہو سکا۔"
        );

        console.error(e);
    }
}


/* =========================================================
   LOAD
   ========================================================= */

function loadDraft(){

    const raw=localStorage.getItem(
        "risenPaperNotesDraft"
    );


    if(!raw){

        alert(
            "کوئی محفوظ Draft نہیں ملا۔"
        );

        return;
    }


    try{

        const data=JSON.parse(raw);


        const p=data.paperInputs||{};


        Object.keys(p).forEach(id=>{

            if(get(id)){
                get(id).value=p[id];
            }

        });


        const n=data.notesInputs||{};


        Object.keys(n).forEach(id=>{

            if(get(id)){
                get(id).value=n[id];
            }

        });


        mcqs=data.mcqs||[];
        shorts=data.shorts||[];
        longs=data.longs||[];
        fills=data.fills||[];
        tfs=data.tfs||[];
        noteBlocks=data.noteBlocks||[];
        logoData=data.logoData||"";


        if(logoData){

            get("headerLogo").src=logoData;

            get("headerLogo")
                .classList
                .remove("hidden");

            get("logoPlaceholder")
                .classList
                .add("hidden");

        }


        renderMCQs();
        renderShorts();
        renderLongs();
        renderFills();
        renderTF();
        renderNotesEditor();


        updatePaper();
        updateNotes();


        if(data.currentTab){
            showTab(data.currentTab);
        }


        alert(
            "Draft load ہو گیا ہے۔"
        );

    }catch(error){

        alert(
            "Draft load نہیں ہو سکا۔"
        );

        console.error(error);

    }
}


/* =========================================================
   CLEAR
   ========================================================= */

function clearAll(){

    const yes=confirm(
        "کیا آپ واقعی تمام سوالات اور نوٹس صاف کرنا چاہتے ہیں؟"
    );


    if(!yes){
        return;
    }


    mcqs=[];
    shorts=[];
    longs=[];
    fills=[];
    tfs=[];
    noteBlocks=[];

    logoData="";


    get("examName").value="Monthly Test";
    get("paperSubject").value="";
    get("paperChapter").value="";
    get("paperTime").value="2 Hours";
    get("totalMarks").value="50";
    get("studentName").value="";
    get("rollNumber").value="";
    get("sectionName").value="";
    get("teacherName").value="Sir Rana Faisal";


    get("notesSubject").value="";
    get("notesChapter").value="";
    get("notesTopic").value="";


    get("headerLogo")
        .classList
        .add("hidden");


    get("logoPlaceholder")
        .classList
        .remove("hidden");


    renderMCQs();
    renderShorts();
    renderLongs();
    renderFills();
    renderTF();
    renderNotesEditor();


    updatePaper();
    updateNotes();
}


/* =========================================================
   PRINT - FIXED
   ========================================================= */

function printDocument(){

    /*
       پہلے دونوں print classes ختم
    */

    document.body.classList.remove(
        "print-paper",
        "print-notes"
    );


    /*
       موجودہ tab کے مطابق print
    */

    if(currentTab==="paper"){

        document.title=
            "The Risen High School - Paper";

        document.body.classList.add(
            "print-paper"
        );

        updatePaper();

    }else{

        document.title=
            "The Risen High School - Notes";

        document.body.classList.add(
            "print-notes"
        );

        updateNotes();

    }


    /*
       Browser کو preview update کرنے کا وقت
    */

    setTimeout(function(){

        window.print();

    },150);
}


/*
   Print مکمل ہونے کے بعد classes ختم
*/

window.addEventListener(
    "afterprint",
    function(){

        document.body.classList.remove(
            "print-paper",
            "print-notes"
        );

    }
);


/* =========================================================
   INITIALIZE
   ========================================================= */

renderMCQs();
renderShorts();
renderLongs();
renderFills();
renderTF();
renderNotesEditor();

updatePaper();
updateNotes();


/* =========================================================
   AUTO SAVE
   ========================================================= */

let autoSaveTimer;


function autoSave(){

    clearTimeout(autoSaveTimer);


    autoSaveTimer=setTimeout(function(){

        try{

            localStorage.setItem(
                "risenPaperNotesAutoSave",
                JSON.stringify(
                    collectData()
                )
            );

        }catch(e){

            console.log(
                "Auto save error",
                e
            );

        }

    },700);
}


document.addEventListener(
    "input",
    autoSave
);


document.addEventListener(
    "change",
    autoSave
);


/* =========================================================
   KEYBOARD SHORTCUTS
   ========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(
            (e.ctrlKey || e.metaKey)
            &&
            e.key==="s"
        ){

            e.preventDefault();

            saveDraft();

        }


        if(
            (e.ctrlKey || e.metaKey)
            &&
            e.key==="p"
        ){

            e.preventDefault();

            printDocument();

        }

    }
);

</script>
