<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>The Risen High School Paper and Notes</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
@font-face{
    font-family:"Jameel Noori Nastaleeq";
    src:url("https://cdn.jsdelivr.net/gh/tariq-abdullah/urdu-web-font-CDN/JameelNooriNastaleeq.woff");
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#eef2f7;
    color:#172033;
    font-family:Arial,sans-serif;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

.header{
    background:linear-gradient(135deg,#073b7a,#087f8c);
    color:white;
    padding:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    flex-wrap:wrap;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand-logo{
    width:58px;
    height:58px;
    border-radius:50%;
    background:white;
    object-fit:contain;
    display:none;
}

.brand h1{
    margin:0;
    font-size:22px;
}

.brand p{
    margin:4px 0 0;
    font-size:13px;
    opacity:.9;
}

.header-buttons{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

button{
    border:0;
    border-radius:8px;
    padding:9px 13px;
    cursor:pointer;
    background:#087f8c;
    color:white;
    font-weight:bold;
}

button:hover{
    opacity:.9;
}

.btn-blue{background:#0866c6}
.btn-green{background:#159447}
.btn-red{background:#d83b3b}
.btn-dark{background:#26364d}
.btn-orange{background:#e47c16}
.btn-purple{background:#7148c4}

.container{
    max-width:1400px;
    margin:auto;
    padding:15px;
}

.tabs{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.tab{
    background:white;
    color:#172033;
    border:1px solid #d7dde7;
}

.tab.active{
    background:#073b7a;
    color:white;
}

.panel{
    background:white;
    border-radius:12px;
    padding:16px;
    margin-bottom:15px;
    box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.panel h2,
.panel h3{
    margin-top:0;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.field label{
    font-weight:bold;
    font-size:14px;
}

.field input,
.field select,
.field textarea{
    border:1px solid #ccd4df;
    border-radius:7px;
    padding:10px;
    outline:none;
    background:white;
}

.field textarea{
    min-height:80px;
    resize:vertical;
}

.full{
    grid-column:1/-1;
}

.action-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
}

.editor-box{
    border:1px solid #d9e0e8;
    border-radius:10px;
    padding:12px;
    margin-bottom:12px;
    background:#fafbfd;
}

.editor-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
}

.editor-title h3{
    margin:0;
    font-size:17px;
}

.question-row{
    display:grid;
    grid-template-columns:55px 1fr;
    gap:8px;
    margin-bottom:8px;
}

.question-number{
    background:#073b7a;
    color:white;
    border-radius:6px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
}

.option-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:7px;
    margin-top:7px;
}

.option-grid input,
.question-row input,
.question-row textarea{
    width:100%;
    border:1px solid #ccd4df;
    border-radius:6px;
    padding:9px;
}

.question-row textarea{
    min-height:70px;
    resize:vertical;
}

.preview-wrap{
    overflow:auto;
    background:#cbd2dc;
    padding:20px;
    border-radius:10px;
}

#printArea,
#notesPrintArea{
    width:max-content;
    min-width:100%;
}

.a4{
    width:210mm;
    min-height:297mm;
    background:#fff;
    padding:14mm;
    margin:0 auto;
    color:#111;
    box-shadow:0 2px 15px rgba(0,0,0,.2);
    font-family:"Jameel Noori Nastaleeq",Arial,sans-serif;
    direction:rtl;
}

.paper-header{
    border-bottom:3px solid #073b7a;
    padding-bottom:10px;
    margin-bottom:12px;
}

.paper-school{
    text-align:center;
    font-family:Arial,sans-serif;
    font-size:25px;
    font-weight:bold;
    color:#073b7a;
}

.paper-title{
    text-align:center;
    font-size:25px;
    font-weight:bold;
    margin-top:5px;
}

.paper-subtitle{
    text-align:center;
    font-size:18px;
    margin-top:3px;
}

.meta-table{
    width:100%;
    border-collapse:collapse;
    margin:12px 0;
    font-size:16px;
}

.meta-table td{
    border:1px solid #222;
    padding:6px;
}

.student-row{
    border:1px solid #222;
    padding:7px;
    margin:10px 0;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
    font-size:17px;
}

.paper-section{
    margin-top:14px;
}

.paper-section-title{
    background:#073b7a;
    color:white;
    padding:5px 10px;
    font-size:19px;
    font-weight:bold;
    border-radius:4px;
    margin-bottom:8px;
}

.mcq{
    margin-bottom:10px;
    font-size:17px;
}

.mcq-question{
    font-weight:bold;
}

.mcq-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px 15px;
    margin-top:4px;
    padding-right:15px;
}

.short-question,
.long-question,
.fill-question,
.tf-question{
    margin-bottom:10px;
    font-size:17px;
}

.answer-lines{
    border-bottom:1px solid #999;
    height:27px;
    margin-top:3px;
}

.footer{
    margin-top:25px;
    border-top:1px solid #333;
    padding-top:8px;
    display:flex;
    justify-content:space-between;
    font-size:14px;
}

.notes-page{
    direction:rtl;
}

.note-block{
    margin-bottom:15px;
}

.note-heading{
    background:#073b7a;
    color:white;
    padding:7px 12px;
    border-radius:5px;
    font-size:21px;
    font-weight:bold;
}

.note-content{
    padding:10px;
    font-size:18px;
    line-height:2;
}

.saved-item{
    border:1px solid #d6dde7;
    padding:10px;
    border-radius:8px;
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
}

.empty{
    color:#777;
    padding:20px;
    text-align:center;
}

@media(max-width:900px){
    .form-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .header{
        align-items:flex-start;
    }

    .brand h1{
        font-size:18px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .option-grid{
        grid-template-columns:1fr;
    }

    .student-row{
        grid-template-columns:1fr;
    }

    .container{
        padding:8px;
    }

    .panel{
        padding:10px;
    }

    .preview-wrap{
        padding:8px;
    }
}

/* PRINT */
@media print{
    @page{
        size:A4;
        margin:0;
    }

    body{
        background:white;
    }

    body *{
        visibility:hidden !important;
    }

    #printArea.print-target,
    #printArea.print-target *{
        visibility:visible !important;
    }

    #notesPrintArea.print-target,
    #notesPrintArea.print-target *{
        visibility:visible !important;
    }

    #printArea.print-target,
    #notesPrintArea.print-target{
        position:absolute;
        left:0;
        top:0;
        width:100%;
        background:white;
    }

    .a4{
        box-shadow:none;
        margin:0;
    }
}
</style>

</head>

<body>

<header class="header">

    <div class="brand">

        <img id="brandLogo"
             class="brand-logo"
             alt="School Logo">

        <div>
            <h1>The Risen High School</h1>
            <p>Paper and Notes Maker</p>
        </div>

    </div>

    <div class="header-buttons">

        <button class="btn-blue" onclick="saveDraft()">
            Save Draft
        </button>

        <button class="btn-dark" onclick="loadDraft()">
            Load Draft
        </button>

        <button class="btn-purple" onclick="showTab('saved')">
            Saved Papers
        </button>

        <button class="btn-red" onclick="clearAll()">
            Clear
        </button>

        <button class="btn-orange" onclick="printDocument('paper')">
            Print
        </button>

    </div>

</header>


<div class="container">

    <div class="tabs">

        <button class="tab active"
                id="tabPaper"
                onclick="showTab('paper')">
            Paper Maker
        </button>

        <button class="tab"
                id="tabNotes"
                onclick="showTab('notes')">
            Notes Maker
        </button>

        <button class="tab"
                id="tabSaved"
                onclick="showTab('saved')">
            Saved Papers
        </button>

    </div>


    <!-- ================= PAPER ================= -->

    <section id="paperTab">

        <div class="panel">

            <h2>Paper Information</h2>

            <div class="form-grid">

                <div class="field">
                    <label>School Name</label>
                    <input id="schoolName"
                           value="The Risen High School">
                </div>

                <div class="field">
                    <label>Exam</label>
                    <input id="examName"
                           placeholder="مثلاً سالانہ امتحان 2026">
                </div>

                <div class="field">
                    <label>Subject</label>
                    <input id="subject"
                           placeholder="مثلاً طبیعیات">
                </div>

                <div class="field">
                    <label>Class</label>
                    <select id="className">
                        <option>Playgroup</option>
                        <option>Nursery</option>
                        <option>Prep</option>
                        <option>1st</option>
                        <option>2nd</option>
                        <option>3rd</option>
                        <option>4th</option>
                        <option>5th</option>
                        <option>6th</option>
                        <option>7th</option>
                        <option>8th</option>
                        <option>9th</option>
                        <option>10th</option>
                        <option>11th</option>
                        <option>12th</option>
                        <option>FA Part 1</option>
                        <option>FA Part 2</option>
                    </select>
                </div>

                <div class="field">
                    <label>Chapter</label>
                    <input id="chapter"
                           placeholder="باب / Chapter">
                </div>

                <div class="field">
                    <label>Total Marks</label>
                    <input id="totalMarks"
                           type="number"
                           value="100">
                </div>

                <div class="field">
                    <label>Time</label>
                    <input id="paperTime"
                           placeholder="مثلاً 2 Hours">
                </div>

                <div class="field">
                    <label>Paper Code</label>
                    <input id="paperCode"
                           placeholder="Paper Code">
                </div>

                <div class="field full">

                    <label>School Logo</label>

                    <input type="file"

                           accept="image/*"
                           onchange="uploadLogo(event)">

                </div>

            </div>

        </div>


        <!-- MCQs -->

        <div class="panel">

            <div class="editor-title">

                <h2>MCQs</h2>

                <button class="btn-green"
                        onclick="addMCQ()">
                    + Add MCQ
                </button>

            </div>

            <div id="mcqEditor"></div>

        </div>


        <!-- SHORT -->

        <div class="panel">

            <div class="editor-title">

                <h2>Short Questions</h2>

                <button class="btn-green"

                    + Add Question
                </button>

            </div>

            <div id="shortEditor"></div>

        </div>


        <!-- LONG -->

        <div class="panel">

            <div class="editor-title">

                <h2>Long Questions</h2>

                <button class="btn-green"
                        onclick="addLong()">
                    + Add Question
                </button>

            </div>

            <div id="longEditor"></div>

        </div>


        <!-- FILL -->

        <div class="panel">

            <div class="editor-title">

                <h2>Fill in the Blanks</h2>

                <button class="btn-green"
                        onclick="addFill()">
                    + Add Question
                </button>

            </div>

            <div id="fillEditor"></div>

        </div>


        <!-- TRUE FALSE -->

        <div class="panel">

            <div class="editor-title">

                <h2>True / False</h2>

                <button class="btn-green"
                        onclick="addTF()">
                    + Add Question
                </button>

            </div>

            <div id="tfEditor"></div>

        </div>


        <div class="panel">

            <div class="action-row">

                <button class="btn-blue"
                        onclick="updatePaper()">
                    Update Preview
                </button>

                <button class="btn-orange"
                        onclick="printDocument('paper')">
                    Print / Save PDF
                </button>

                <!-- NEW DOWNLOAD BUTTON -->

                <button class="btn-green"
                        onclick="downloadPaper()">
                    Download Paper PNG
                </button>

                <button class="btn-dark"
                        onclick="saveDraft()">
                    Save Draft
                </button>

            </div>

        </div>


        <!-- PAPER PREVIEW -->

        <div class="panel">

            <h2>Paper Preview</h2>

            <div class="action-row">

                <button class="btn-orange"
                        onclick="printDocument('paper')">
                    Print A4
                </button>

                <button class="btn-green"
                        onclick="downloadPaper()">
                    Download Paper PNG
                </button>

            </div>

            <br>

            <div class="preview-wrap">

                <div id="printArea">

                    <div id="paperPreview"
                         class="a4">
                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- ================= NOTES ================= -->

    <section id="notesTab" style="display:none">

        <div class="panel">

            <h2>Notes Information</h2>

            <div class="form-grid">

                <div class="field">

                    <label>School Name</label>

                    <input id="notesSchool"
                           value="The Risen High School">

                </div>

                <div class="field">

                    <label>Class</label>

                    <input id="notesClass"
                           placeholder="مثلاً 9th">

                </div>

                <div class="field">

                    <label>Subject</label>

                    <input id="notesSubject"
                           placeholder="مثلاً Biology">

                </div>

                <div class="field">

                    <label>Chapter</label>

                    <input id="notesChapter"
                           placeholder="Chapter 1">

                </div>

            </div>

        </div>


        <div class="panel">

            <div class="editor-title">

                <h2>Notes Blocks</h2>

                <button class="btn-green"
                        onclick="addNoteBlock()">
                    + Add Notes
                </button>

            </div>

            <div id="notesEditor"></div>

        </div>


        <div class="panel">

            <div class="action-row">

                <button class="btn-blue"
                        onclick="updateNotes()">
                    Update Notes
                </button>

                <button class="btn-orange"
                        onclick="printDocument('notes')">
                    Print / PDF
                </button>

                <button class="btn-dark"
                        onclick="saveDraft()">
                    Save Draft
                </button>

            </div>

        </div>


        <div class="panel">

            <h2>Notes Preview</h2>

            <div class="action-row">

                <button class="btn-orange"
                        onclick="printDocument('notes')">
                    Print A4
                </button>

            </div>

            <br>

            <div class="preview-wrap">

                <div id="notesPrintArea">

                    <div id="notesPreview"
                         class="a4 notes-page">
                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- ================= SAVED ================= -->

    <section id="savedTab" style="display:none">

        <div class="panel">

            <h2>Saved Papers</h2>

            <div id="savedList"></div>

        </div>

    </section>

</div>


<script>

/* =====================================================
   DATA
===================================================== */

let mcqs = [];
let shorts = [];
let longs = [];
let fills = [];
let tfs = [];
let noteBlocks = [];

let currentTab = "paper";
let logoData = "";
let savedItems = [];


/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function nl2br(value){

    return escapeHTML(value)
        .replace(/\n/g,"<br>");

}


function get(id){

    const el = document.getElementById(id);

    return el ? el.value : "";

}


/* =====================================================
   TABS
===================================================== */

function showTab(tab){

    currentTab = tab;

    document.getElementById("paperTab").style.display =
        tab === "paper" ? "block" : "none";

    document.getElementById("notesTab").style.display =
        tab === "notes" ? "block" : "none";

    document.getElementById("savedTab").style.display =
        tab === "saved" ? "block" : "none";


    document.getElementById("tabPaper").classList.toggle(
        "active",
        tab === "paper"
    );

    document.getElementById("tabNotes").classList.toggle(
        "active",
        tab === "notes"
    );

    document.getElementById("tabSaved").classList.toggle(
        "active",
        tab === "saved"
    );


    if(tab === "paper"){
        updatePaper();
    }

    if(tab === "notes"){
        updateNotes();
    }

    if(tab === "saved"){
        renderSaved();
    }

}


/* =====================================================
   LOGO
===================================================== */

function uploadLogo(event){

    const file = event.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        logoData = e.target.result;

        const logo = document.getElementById("brandLogo");

        logo.src = logoData;
        logo.style.display = "block";

    };

    reader.readAsDataURL(file);

}


/* =====================================================
   MCQ
===================================================== */

function addMCQ(data = {}){

    mcqs.push({

        question:data.question || "",
        a:data.a || "",
        b:data.b || "",
        c:data.c || "",
        d:data.d || ""

    });

    renderMCQs();

}


function removeMCQ(index){

    mcqs.splice(index,1);

    renderMCQs();

}


function renderMCQs(){

    const box = document.getElementById("mcqEditor");

    if(mcqs.length === 0){

        box.innerHTML =
            '<div class="empty">ابھی کوئی MCQ شامل نہیں کیا گیا۔</div>';

        return;

    }


    box.innerHTML = mcqs.map((q,i)=>`

        <div class="editor-box">

            <div class="editor-title">

                <h3>MCQ ${i+1}</h3>

                <button class="btn-red"
                        onclick="removeMCQ(${i})">
                    Delete
                </button>

            </div>

            <div class="question-row">

                <div class="question-number">
                    ${i+1}
                </div>

                <textarea
                    placeholder="MCQ Question"
                    oninput="mcqs[${i}].question=this.value"
                >${escapeHTML(q.question)}</textarea>

            </div>

            <div class="option-grid">

                <input
                    placeholder="A"
                    value="${escapeHTML(q.a)}"
                    oninput="mcqs[${i}].a=this.value">

                <input
                    placeholder="B"
                    value="${escapeHTML(q.b)}"
                    oninput="mcqs[${i}].b=this.value">

                <input
                    placeholder="C"
                    value="${escapeHTML(q.c)}"
                    oninput="mcqs[${i}].c=this.value">

                <input
                    placeholder="D"
                    value="${escapeHTML(q.d)}"
                    oninput="mcqs[${i}].d=this.value">

            </div>

        </div>

    `).join("");

}


/* =====================================================
   SHORT
===================================================== */

function addShort(data = {}){

    shorts.push({
        question:data.question || ""
    });

    renderShorts();

}


function removeShort(index){

    shorts.splice(index,1);

    renderShorts();

}


function renderShorts(){

    const box = document.getElementById("shortEditor");

    if(shorts.length === 0){

        box.innerHTML =
            '<div class="empty">ابھی کوئی Short Question شامل نہیں کیا گیا۔</div>';

        return;

    }


    box.innerHTML = shorts.map((q,i)=>`

        <div class="editor-box">

            <div class="editor-title">

                <h3>Question ${i+1}</h3>

                <button class="btn-red"
                        onclick="removeShort(${i})">
                    Delete
                </button>

            </div>

            <div class="question-row">

                <div class="question-number">
                    ${i+1}
                </div>

                <textarea
                    placeholder="Short Question"
                    oninput="shorts[${i}].question=this.value"
                >${escapeHTML(q.question)}</textarea>

            </div>

        </div>

    `).join("");

}


/* =====================================================
   LONG
===================================================== */

function addLong(data = {}){

    longs.push({
        question:data.question || ""
    });

    renderLongs();

}


function removeLong(index){

    longs.splice(index,1);

    renderLongs();

}


function renderLongs(){

    const box = document.getElementById("longEditor");

    if(longs.length === 0){

        box.innerHTML =
            '<div class="empty">ابھی کوئی Long Question شامل نہیں کیا گیا۔</div>';

        return;

    }


    box.innerHTML = longs.map((q,i)=>`

        <div class="editor-box">

            <div class="editor-title">

                <h3>Question ${i+1}</h3>

                <button class="btn-red"
                        onclick="removeLong(${i})">
                    Delete
                </button>

            </div>

            <div class="question-row">

                <div class="question-number">
                    ${i+1}
                </div>

                <textarea
                    placeholder="Long Question"
                    oninput="longs[${i}].question=this.value"
                >${escapeHTML(q.question)}</textarea>

            </div>

        </div>

    `).join("");

}


/* =====================================================
   FILL BLANKS
===================================================== */

function addFill(data = {}){

    fills.push({
        question:data.question || ""
    });

    renderFills();

}


function removeFill(index){

/* =====================================================
   DOWNLOAD PAPER AS PNG
===================================================== */

async function downloadPaper(){

    updatePaper();


    const paper =
        document.getElementById("paperPreview");


    if(!paper){

        alert("Paper preview نہیں ملا۔");

        return;

    }


    if(typeof html2canvas === "undefined"){

        alert(
            "Download system load نہیں ہوا۔ براہِ کرم Internet ON کر کے page دوبارہ کھولیں۔"
        );

        return;

    }


    const buttonText =
        "Paper image تیار ہو رہی ہے، براہِ کرم انتظار کریں...";


    /* فونٹ مکمل load کروائیں */

    try{

        if(document.fonts &&
           document.fonts.ready){

            await document.fonts.ready;

        }

    }catch(e){}


    /* Urdu Nastaleeq rendering کے لیے تھوڑا وقت */

    await new Promise(resolve =>
        setTimeout(resolve,700)
    );


    try{

        const canvas = await html2canvas(
            paper,
            {
                scale:2,
                useCORS:true,
                allowTaint:false,
                backgroundColor:"#ffffff",
                logging:false,
                imageTimeout:15000,
                scrollX:0,
                scrollY:0,
                width:paper.scrollWidth,
                height:paper.scrollHeight
            }
        );


        canvas.toBlob(function(blob){

            if(!blob){

                alert("Image بنانے میں مسئلہ آیا۔");

                return;

            }


            const url =
                URL.createObjectURL(blob);


            const subject =
                get("subject")
                .trim()
                .replace(/[\\/:*?"<>|]/g,"-")
                || "Paper";


            const exam =
                get("examName")
                .trim()
                .replace(/[\\/:*?"<>|]/g,"-")
                || "Exam";


            const fileName =
                "The Risen High School - "
                + subject
                + " - "
                + exam
                + ".png";


            const link =
                document.createElement("a");


            link.href = url;

            link.download = fileName;

            document.body.appendChild(link);

            link.click();

            link.remove();


            setTimeout(function(){

                URL.revokeObjectURL(url);

            },3000);


            alert(
                "Paper PNG download ہو گیا ہے۔ موبائل میں Downloads فولڈر چیک کریں۔"
            );


        },"image/png");


    }catch(error){

        console.error(error);

        alert(
            "Paper image بنانے میں مسئلہ آیا۔ براہِ کرم دوبارہ کوشش کریں۔"
        );

    }

}

function printDocument(type){

            document.getElementById("printArea");

        setTimeout(()=>{

            window.print();

            setTimeout(()=>{

            },1000);

        },200);

    }


    if(type === "notes"){

        updateNotes();

            document.getElementById("notesPrintArea");

/* =====================================================
   SAVED PAPERS
===================================================== */

function saveAsPaper(){

    const data =
        collectData();


    const title =
        (get("subject") || "Untitled Paper")
        + " - "
        + (get("examName") || "Exam");


    savedItems =
        JSON.parse(
            localStorage.getItem(
                "risenSavedPapers"
            ) || "[]"
        );


    savedItems.unshift({

        id:Date.now(),

        title:title,

        date:new Date().toLocaleString(),

        data:data

    });


    localStorage.setItem(
        "risenSavedPapers",
        JSON.stringify(savedItems)
    );


    renderSaved();


    alert("Paper Saved ہو گیا ہے۔");

}


function renderSaved(){

    const box =
        document.getElementById("savedList");


    savedItems =
        JSON.parse(
            localStorage.getItem(
                "risenSavedPapers"
            ) || "[]"
        );


    if(savedItems.length === 0){

        box.innerHTML =
            '<div class="empty">ابھی کوئی saved paper نہیں ہے۔</div>';

        return;

    }


    box.innerHTML =
        savedItems.map(item=>`

            <div class="saved-item">

                <div>

                    <strong>
                        ${escapeHTML(item.title)}
                    </strong>

                    <br>

                    <small>
                        ${escapeHTML(item.date)}
                    </small>

                </div>

                <div class="action-row">

                    <button
                        class="btn-blue"
                        onclick="openSaved(${item.id})">
                        Open
                    </button>

                    <button
                        class="btn-red"
                        onclick="deleteSaved(${item.id})">
                        Delete
                    </button>

                </div>

            </div>

        `).join("");

}


function openSaved(id){

    const item =
        savedItems.find(x => x.id === id);


    if(!item) return;


    const data =
        item.data;


    document.getElementById("schoolName").value =
        data.schoolName || "The Risen High School";

    document.getElementById("examName").value =
        data.examName || "";

    document.getElementById("subject").value =
        data.subject || "";

    document.getElementById("className").value =
        data.className || "9th";

    document.getElementById("chapter").value =
        data.chapter || "";

    document.getElementById("totalMarks").value =
        data.totalMarks || "100";

    document.getElementById("paperTime").value =
        data.paperTime || "";

    document.getElementById("paperCode").value =
        data.paperCode || "";


    mcqs =
        data.mcqs || [];

    shorts =
        data.shorts || [];

    longs =
        data.longs || [];

    fills =
        data.fills || [];

    tfs =
        data.tfs || [];

    noteBlocks =
        data.noteBlocks || [];

    logoData =
        data.logoData || "";


    renderMCQs();
    renderShorts();
    renderLongs();
    renderFills();
    renderTFs();
    renderNoteBlocks();

    updatePaper();
    updateNotes();

    showTab("paper");

}


function deleteSaved(id){

    if(!confirm(
        "کیا آپ اس saved paper کو delete کرنا چاہتے ہیں؟"
    )){
        return;
    }


    savedItems =
        savedItems.filter(
            x => x.id !== id
        );


    localStorage.setItem(
        "risenSavedPapers",
        JSON.stringify(savedItems)
    );


    renderSaved();

}
