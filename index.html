<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>The Risen High School - Paper & Notes Maker</title>

<style>
@font-face{
    font-family:"JameelNoori";
    src:url("https://cdn.jsdelivr.net/gh/tariq-abdullah/urdu-web-font-CDN/JameelNooriNastaleeq.woff")
    format("woff");
    font-weight:normal;
    font-style:normal;
    font-display:swap;
}

:root{
    --primary:#17365d;
    --primary2:#245b91;
    --light:#eef4fa;
    --border:#b8c4d1;
    --danger:#b42318;
    --success:#137333;
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
}

body{
    background:#edf1f5;
    color:#111;
    font-family:"JameelNoori","Noto Nastaliq Urdu",serif;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

.topbar{
    background:linear-gradient(135deg,#17365d,#245b91);
    color:#fff;
    padding:18px 15px;
}

.topbar-inner{
    width:100%;
    max-width:1500px;
    margin:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:14px;
}

.brand{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.logo-box{
    width:65px;
    height:65px;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:6px;
    overflow:hidden;
}

.logo-box img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.logo-placeholder{
    color:#17365d;
    font-family:Arial,sans-serif;
    font-size:35px;
    font-weight:bold;
}

.brand h1{
    margin:0;
    font-family:Arial,sans-serif;
    font-size:25px;
    text-align:center;
}

.brand p{
    margin:3px 0 0;
    font-family:Arial,sans-serif;
    text-align:center;
}

.header-buttons{
    width:100%;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:7px;
}

button{
    border:0;
    border-radius:7px;
    padding:9px 13px;
    cursor:pointer;
    background:var(--primary);
    color:#fff;
    font-size:15px;
}

button:hover{
    opacity:.9;
}

.btn-light{
    background:#fff;
    color:#17365d;
}

.btn-green{
    background:#137333;
}

.btn-red{
    background:#b42318;
}

.btn-blue{
    background:#245b91;
}

.container{
    width:min(1500px,96%);
    margin:20px auto;
}

.tabs{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:15px;
}

.tab{
    background:#dce5ef;
    color:#17365d;
    border:1px solid #b7c6d5;
    font-weight:bold;
}

.tab.active{
    background:#17365d;
    color:#fff;
}

.panel{
    background:#fff;
    border-radius:12px;
    padding:18px;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
    margin-bottom:18px;
}

.panel h2{
    margin:0 0 15px;
    color:var(--primary2);
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.form-group label{
    font-weight:bold;
    color:#26384b;
}

input,
select,
textarea{
    width:100%;
    border:1px solid #aebdcb;
    border-radius:7px;
    padding:9px 10px;
    background:#fff;
    font-size:15px;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#245b91;
    box-shadow:0 0 0 2px rgba(36,91,145,.12);
}

textarea{
    min-height:80px;
    resize:vertical;
}

.urdu{
    font-family:"JameelNoori","Noto Nastaliq Urdu",serif !important;
}

.section-box{
    border:1px solid #c4cfda;
    border-radius:10px;
    padding:14px;
    margin-top:15px;
    background:#fafcff;
}

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
}

.section-head h3{
    margin:0;
    color:#17365d;
}

.question-card{
    background:#fff;
    border:1px solid #cbd5df;
    border-radius:8px;
    padding:12px;
    margin-bottom:10px;
}

.question-card-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.full{
    grid-column:1/-1;
}

.remove-btn{
    background:#b42318;
    padding:6px 10px;
    font-size:13px;
}

.preview-panel{
    position:sticky;
    top:10px;
}

.preview-tools{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
}

.preview-tools h2{
    margin:0;
    color:var(--primary2);
}

.paper-stage{
    background:#dce2eb;
    padding:25px 10px;
    border-radius:12px;
    overflow:auto;
    min-height:500px;
}

/* ================================
   OLD A4 PAPER TEMPLATE
================================ */

.a4{
    width:210mm;
    min-height:297mm;
    background:white;
    margin:0 auto;
    padding:14mm;
    color:#111;
    box-shadow:0 5px 25px rgba(0,0,0,.15);
    position:relative;
    direction:rtl;

    font-family:"JameelNoori","Noto Nastaliq Urdu",serif;

    font-variant-ligatures:normal;
    font-feature-settings:normal;
}

.paper-header{
    text-align:center;
    border-bottom:2px solid #111;
    padding-bottom:7px;
    margin-bottom:8px;
}

.preview-school{
    font-family:"Segoe UI",Arial,sans-serif;
    font-weight:900;
    font-size:22px;
    direction:ltr;
}

.preview-exam{
    font-size:21px;
    font-weight:bold;
    margin-top:3px;
}

.preview-meta{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:6px;
    font-family:"Segoe UI",Arial,sans-serif;
    direction:ltr;
    font-size:12px;
    margin-top:7px;
}

.meta-cell{
    border:1px solid #111;
    padding:4px 5px;
    min-height:25px;
}

.student-row{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr;
    direction:ltr;
    margin:8px 0;
    border:1px solid #111;
}

.student-cell{
    min-height:29px;
    padding:5px;
    border-right:1px solid #111;
    font-family:"Segoe UI",Arial,sans-serif;
    font-size:12px;
}

.student-cell:last-child{
    border-right:none;
}

.paper-section{
    margin-top:13px;
}

.paper-section-title{
    font-size:18px;
    font-weight:bold;
    border-bottom:1px solid #111;
    padding-bottom:2px;
    margin-bottom:5px;
}

.mcq-preview{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px 20px;
}

.mcq-preview-item{
    break-inside:avoid;
}

.mcq-options-preview{
    display:grid;
    grid-template-columns:1fr 1fr;
    font-family:"JameelNoori",serif;
    font-size:14px;
    margin-top:2px;
}

.q-row{
    display:flex;
    gap:7px;
    margin-bottom:8px;
    line-height:1.8;
    break-inside:avoid;
}

.q-number{
    font-weight:bold;
    min-width:25px;
}

.lines{
    flex:1;
    min-height:35px;
    border-bottom:1px dashed #888;
}

.long-answer{
    margin-bottom:12px;
    break-inside:avoid;
}

.answer-lines{
    height:65px;
    margin-top:4px;
    background:
    repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 22px,
        #999 23px
    );
}

.fill-row{
    margin-bottom:8px;
    line-height:1.8;
}

.truefalse{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    margin-bottom:7px;
}

.tf-options{
    font-family:"Segoe UI",Arial,sans-serif;
    white-space:nowrap;
}

.paper-footer{
    position:absolute;
    bottom:7mm;
    left:14mm;
    right:14mm;
    border-top:1px solid #555;
    padding-top:3px;
    display:flex;
    justify-content:space-between;
    font-family:"Segoe UI",Arial,sans-serif;
    font-size:10px;
}

/* NOTES */

.notes-preview{
    width:210mm;
    min-height:297mm;
    background:#fff;
    margin:0 auto;
    padding:14mm;
    direction:rtl;
    font-family:"JameelNoori","Noto Nastaliq Urdu",serif;
    box-shadow:0 5px 25px rgba(0,0,0,.15);
}

.notes-header{
    text-align:center;
    border-bottom:2px solid #111;
    padding-bottom:8px;
    margin-bottom:12px;
}

.notes-school{
    font-family:Arial,sans-serif;
    font-size:22px;
    font-weight:bold;
    direction:ltr;
}

.notes-title{
    font-size:22px;
    font-weight:bold;
}

.notes-meta{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    direction:ltr;
    font-family:Arial,sans-serif;
    font-size:12px;
}

.notes-meta div{
    border:1px solid #111;
    padding:5px;
}

.note-item{
    margin-bottom:13px;
    break-inside:avoid;
}

.note-heading{
    font-size:20px;
    font-weight:bold;
    border-bottom:1px solid #333;
    padding-bottom:3px;
}

.note-question{
    font-size:18px;
    font-weight:bold;
}

.note-answer{
    font-size:16px;
    line-height:2;
}

.note-points{
    font-size:16px;
    line-height:2;
}

.note-mcq{
    font-size:16px;
}

.note-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:3px;
    margin-top:3px;
}

/* SAVED */

.saved-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.saved-column{
    border:1px solid #c6d0da;
    border-radius:10px;
    padding:13px;
    background:#fafcff;
}

.saved-column h3{
    margin-top:0;
    color:#17365d;
}

.saved-item{
    background:#fff;
    border:1px solid #cbd5df;
    border-radius:8px;
    padding:10px;
    margin-bottom:9px;
}

.saved-title{
    font-weight:bold;
    font-size:17px;
}

.saved-date{
    font-family:Arial,sans-serif;
    font-size:11px;
    color:#666;
    margin:3px 0 7px;
}

.saved-actions{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
}

.saved-actions button{
    font-size:12px;
    padding:6px 8px;
}

.empty{
    color:#777;
    text-align:center;
    padding:15px;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:9999;
    padding:15px;
}

.modal-box{
    background:#fff;
    width:min(450px,100%);
    border-radius:12px;
    padding:20px;
}

.modal-box h3{
    margin-top:0;
    color:#17365d;
}

.modal-buttons{
    display:flex;
    justify-content:flex-end;
    gap:7px;
    margin-top:12px;
}

/* PRINT */

@page{
    size:A4;
    margin:0;
}

@media print{
    body{
        background:#fff!important;
    }

    .no-print{
        display:none!important;
    }

    .a4,
    .notes-preview{
        width:210mm!important;
        min-height:297mm!important;
        margin:0!important;
        box-shadow:none!important;
    }

    .paper-stage{
        padding:0!important;
        background:#fff!important;
    }
}

/* MOBILE */

@media(max-width:900px){

    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .saved-grid{
        grid-template-columns:1fr;
    }

    .question-card-grid{
        grid-template-columns:1fr;
    }

    .preview-panel{
        position:static;
    }
}

@media(max-width:600px){

    .brand h1{
        font-size:21px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .panel{
        padding:12px;
    }

    .header-buttons{
        width:100%;
    }

    .header-buttons button{
        font-size:13px;
        padding:8px 9px;
    }

    .paper-stage{
        padding:10px;
    }
}
</style>
</head>

<body>

<header class="topbar no-print">
    <div class="topbar-inner">

        <div class="brand">

            <div class="logo-box">
                <img id="headerLogo" class="hidden" alt="School Logo">
                <div id="logoPlaceholder" class="logo-placeholder">R</div>
            </div>

            <div class="brand-text">
                <h1>The Risen High School</h1>
                <p>Paper & Notes Maker</p>
            </div>

        </div>

        <div class="header-buttons">
            <button onclick="saveDraft()">💾 Save</button>
            <button onclick="loadDraft()">📂 Load</button>
            <button onclick="clearAll()">🗑 Clear</button>
            <button onclick="printDocument()">🖨 Print / PDF</button>
        </div>

    </div>
</header>


<div class="container">

    <div class="tabs no-print">

        <button id="tabPaper"
                class="tab active"
                onclick="showTab('paper')">
            📝 Paper Maker
        </button>

        <button id="tabNotes"
                class="tab"
                onclick="showTab('notes')">
            📚 Notes Maker
        </button>

        <button id="tabSaved"
                class="tab"
                onclick="showTab('saved')">
            💾 Saved Papers & Notes
        </button>

    </div>


    <!-- ================= PAPER ================= -->

    <div id="paperTab">

        <div class="panel no-print">

            <h2>Paper Settings</h2>

            <div class="grid">

                <div class="form-group">
                    <label>School Name</label>
                    <input id="schoolName"
                           value="The Risen High School"
                           oninput="updatePaper()">
                </div>

                <div class="form-group">
                    <label>Paper / Exam Name</label>
                    <input id="examName"
                           placeholder="مثلاً ماہانہ ٹیسٹ"
                           oninput="updatePaper()">
                </div>

                <div class="form-group">
                    <label>Class</label>
                    <select id="paperClass" onchange="updatePaper()">
                        <option>Playgroup</option>
                        <option>Nursery</option>
                        <option>Prep</option>
                        <option>1st</option>
                        <option>2nd</option>
                        <option>3rd</option>
                        <option>4th</option>
                        <option>5th</option>
                        <option>6th</option>
                        <option>7th</option>
                        <option>8th</option>
                        <option selected>9th</option>
                        <option>10th</option>
                        <option>11th / FA Part 1</option>
                        <option>12th / FA Part 2</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Subject</label>
                    <input id="paperSubject"
                           placeholder="مثلاً طبیعیات"
                           oninput="updatePaper()">
                </div>

                <div class="form-group">
                    <label>Chapter / Unit</label>
                    <input id="paperChapter"
                           placeholder="باب / یونٹ"
                           oninput="updatePaper()">
                </div>

                <div class="form-group">
                    <label>Date</label>
                    <input id="paperDate"
                           type="date"
                           onchange="updatePaper()">
                </div>

                <div class="form-group">
                    <label>Time</label>
                    <input id="paperTime"
                           placeholder="مثلاً 2 گھنٹے"
                           oninput="updatePaper()">
                </div>

                <div class="form-group">
                    <label>Total Marks</label>
                    <input id="totalMarks"
                           type="number"
                           placeholder="100"
                           oninput="updatePaper()">
                </div>

            </div>

            <div class="section-box">

                <div class="section-head">
                    <h3>Student Information</h3>
                </div>

                <div class="grid">

                    <div class="form-group">
                        <label>Student Name</label>
                        <input id="studentName"
                               placeholder="طالب علم کا نام"
                               oninput="updatePaper()">
                    </div>

                    <div class="form-group">
                        <label>Roll Number</label>
                        <input id="rollNumber"
                               placeholder="رول نمبر"
                               oninput="updatePaper()">
                    </div>

                    <div class="form-group">
                        <label>Section</label>
                        <input id="section"
                               placeholder="سیکشن"
                               oninput="updatePaper()">
                    </div>

                    <div class="form-group">
                        <label>Teacher Name</label>
                        <input id="teacherName"
                               placeholder="Teacher Name"
                               oninput="updatePaper()">
                    </div>

                </div>

            </div>

        </div>


        <!-- QUESTIONS -->

        <div class="panel no-print">

            <div class="section-box">

                <div class="section-head">

                    <h3>MCQs</h3>

                    <button onclick="addMCQ()">
                        + Add MCQ
                    </button>

                </div>

                <div id="mcqEditor"></div>

            </div>


            <div class="section-box">

                <div class="section-head">

                    <h3>Short Questions</h3>

                    <button onclick="addShort()">
                        + Add Short Question
                    </button>

                </div>

                <div id="shortEditor"></div>

            </div>


            <div class="section-box">

                <div class="section-head">

                    <h3>Long Questions</h3>

                    <button onclick="addLong()">
                        + Add Long Question
                    </button>

                </div>

                <div id="longEditor"></div>

            </div>


            <div class="section-box">

                <div class="section-head">

                    <h3>Fill in the Blanks</h3>

                    <button onclick="addFill()">
                        + Add
                    </button>

                </div>

                <div id="fillEditor"></div>

            </div>


            <div class="section-box">

                <div class="section-head">

                    <h3>True / False</h3>

                    <button onclick="addTF()">
                        + Add
                    </button>

                </div>

                <div id="tfEditor"></div>

            </div>

        </div>


        <!-- PAPER PREVIEW -->

        <div class="panel">

            <div class="preview-tools no-print">

                <h2>Paper Preview</h2>

                <div>
                    <button class="btn-green"
                            onclick="saveCurrentPaper()">
                        💾 Save Paper
                    </button>

                    <button class="btn-blue"
                            onclick="printDocument()">
                        🖨 Print / PDF
                    </button>

                    <button class="btn-light"
                            onclick="downloadCurrent('paper')">
                        ⬇ Download
                    </button>
                </div>

            </div>

            <div class="paper-stage">

                <div id="paperPreview" class="a4"></div>

            </div>

        </div>

    </div>


    <!-- ================= NOTES ================= -->

    <div id="notesTab" style="display:none">

        <div class="panel no-print">

            <h2>Notes Settings</h2>

            <div class="grid">

                <div class="form-group">
                    <label>School Name</label>
                    <input id="nschool"
                           value="The Risen High School"
                           oninput="updateNotes()">
                </div>

                <div class="form-group">
                    <label>Class</label>
                    <select id="nclass" onchange="updateNotes()">
                        <option>Playgroup</option>
                        <option>Nursery</option>
                        <option>Prep</option>
                        <option>1st</option>
                        <option>2nd</option>
                        <option>3rd</option>
                        <option>4th</option>
                        <option>5th</option>
                        <option>6th</option>
                        <option>7th</option>
                        <option>8th</option>
                        <option selected>9th</option>
                        <option>10th</option>
                        <option>11th / FA Part 1</option>
                        <option>12th / FA Part 2</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Subject</label>
                    <input id="nsubject"
                           oninput="updateNotes()">
                </div>

                <div class="form-group">
                    <label>Chapter / Unit</label>
                    <input id="nchapter"
                           oninput="updateNotes()">
                </div>

            </div>

        </div>


        <div class="panel no-print">

            <div class="section-head">

                <h2>Notes Content</h2>

                <button onclick="addNote()">
                    + Add Note
                </button>

            </div>

            <div id="notesEditor"></div>

        </div>


        <div class="panel">

            <div class="preview-tools no-print">

                <h2>Notes Preview</h2>

                <div>

                    <button class="btn-green"
                            onclick="saveCurrentNotes()">
                        💾 Save Notes
                    </button>

                    <button class="btn-blue"
                            onclick="printDocument()">
                        🖨 Print / PDF
                    </button>

                    <button class="btn-light"
                            onclick="downloadCurrent('notes')">
                        ⬇ Download
                    </button>

                </div>

            </div>

            <div class="paper-stage">

                <div id="notesPreview"
                     class="notes-preview"></div>

            </div>

        </div>

    </div>


    <!-- ================= SAVED ================= -->

    <div id="savedTab" style="display:none">

        <div class="panel">

            <h2>💾 Saved Papers & Notes</h2>

            <div class="saved-grid">

                <div class="saved-column">

                    <h3>📝 Saved Papers</h3>

                    <div id="savedPapersList"></div>

                </div>


                <div class="saved-column">

                    <h3>📚 Saved Notes</h3>

                    <div id="savedNotesList"></div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- SAVE NAME MODAL -->

<div id="saveModal" class="modal">

    <div class="modal-box">

        <h3 id="modalTitle">
            Save
        </h3>

        <div class="form-group">

            <label>Name</label>

            <input id="saveName"
                   placeholder="مثلاً 9th Physics Chapter 1 Test">

        </div>

        <div class="modal-buttons">

            <button class="btn-red"
                    onclick="closeSaveModal()">
                Cancel
            </button>

            <button class="btn-green"
                    onclick="confirmSave()">
                Save

<script>

/* =====================================

/* =====================================

function removeQuestion(type,index){

    if(type==="mcq") mcqs.splice(index,1);
    if(type==="short") shorts.splice(index,1);

/* =====================================
   NOTES
===================================== */

function addNote(data){

    notes.push(data || {
        type:"heading",
        title:"",
        question:"",
        answer:"",
        text:"",
        points:"",
        a:"",
        b:"",
        c:"",
        d:""
    });

    renderNotesEditor();
    updateNotes();
}


function renderNotesEditor(){

    const box=document.getElementById("notesEditor");

    box.innerHTML="";

    notes.forEach((n,i)=>{

        box.innerHTML+=`

        <div class="question-card">

            <div class="section-head">

                <strong>Note ${i+1}</strong>

                <button class="remove-btn"
                        onclick="notes.splice(${i},1);renderNotesEditor();updateNotes()">

                        Question / Answer
                    </option>

                    <option value="definition"

                        Definition

function noteFields(n,i){

    if(n.type==="heading"){

        return `

        <div class="form-group">

            <label>Heading</label>

            <input class="urdu"
                value="${escAttr(n.title)}"
                oninput="notes[${i}].title=this.value;updateNotes()">

        </div>`;
    }


    if(n.type==="qa"){

        return `

        <div class="form-group">

            <label>Question</label>

            <textarea class="urdu"
                oninput="notes[${i}].question=this.value;updateNotes()">${esc(n.question)}</textarea>

        </div>

        <br>

        <div class="form-group">

            <label>Answer</label>

            <textarea class="urdu"
                oninput="notes[${i}].answer=this.value;updateNotes()">${esc(n.answer)}</textarea>

        </div>`;
    }


    if(n.type==="definition"){

        return `

        <div class="form-group">

            <label>Definition / Text</label>

            <textarea class="urdu"
                oninput="notes[${i}].text=this.value;updateNotes()">${esc(n.text)}</textarea>

        </div>`;
    }


    if(n.type==="points"){

        return `

        <div class="form-group">

            <label>Key Points</label>

            <textarea class="urdu"
                placeholder="ہر point نئی لائن میں لکھیں"
                oninput="notes[${i}].points=this.value;updateNotes()">${esc(n.points)}</textarea>

        </div>`;
    }


    if(n.type==="text"){

        return `

        <div class="form-group">

            <label>Detailed Text</label>

            <textarea class="urdu"
                style="min-height:150px"
                oninput="notes[${i}].text=this.value;updateNotes()">${esc(n.text)}</textarea>

        </div>`;
    }


    if(n.type==="mcq"){

        return `

        <div class="form-group">

            <label>Question</label>

            <textarea class="urdu"
                oninput="notes[${i}].question=this.value;updateNotes()">${esc(n.question)}</textarea>

        </div>

        <br>

        <div class="grid">

            <div class="form-group">
                <label>A</label>
                <input class="urdu"
                    value="${escAttr(n.a)}"
                    oninput="notes[${i}].a=this.value;updateNotes()">
            </div>

            <div class="form-group">
                <label>B</label>
                <input class="urdu"
                    value="${escAttr(n.b)}"
                    oninput="notes[${i}].b=this.value;updateNotes()">
            </div>

            <div class="form-group">
                <label>C</label>
                <input class="urdu"
                    value="${escAttr(n.c)}"
                    oninput="notes[${i}].c=this.value;updateNotes()">
            </div>

            <div class="form-group">
                <label>D</label>
                <input class="urdu"
                    value="${escAttr(n.d)}"
                    oninput="notes[${i}].d=this.value;updateNotes()">

    return "";
}


function updateNotes(){

    let html=`

    <div class="notes-header">

        <div class="notes-school">
            ${esc(val("nschool") || "The Risen High School")}
        </div>

        <div class="notes-title">
            Notes
        </div>

        <div class="notes-meta">

            <div>
                Class: ${esc(val("nclass"))}
            </div>

            <div>
                Subject: ${esc(val("nsubject"))}
            </div>

            <div>
                Chapter: ${esc(val("nchapter"))}
            </div>

        </div>

    </div>`;

    notes.forEach((n,i)=>{

        html+=`<div class="note-item">`;

        if(n.type==="heading"){

            html+=`
            <div class="note-heading">
                ${esc(n.title)}
            </div>`;
        }


        if(n.type==="qa"){

            html+=`
            <div class="note-question">
                سوال: ${esc(n.question)}
            </div>

            <div class="note-answer">
                جواب: ${esc(n.answer)}
            </div>`;
        }


        if(n.type==="definition"){

            html+=`
            <div class="note-question">
                تعریف
            </div>

            <div class="note-answer">
                ${esc(n.text)}
            </div>`;
        }


        if(n.type==="points"){

            const arr=(n.points || "").split("\n");

            html+=`
            <div class="note-question">
                اہم نکات
            </div>

            <div class="note-points">`;

            arr.forEach(p=>{
                if(p.trim()){
                    html+=`• ${esc(p)}<br>`;
                }
            });

            html+=`</div>`;
        }


        if(n.type==="text"){

            html+=`
            <div class="note-answer">
                ${esc(n.text).replace(/\n/g,"<br>")}
            </div>`;
        }


        if(n.type==="mcq"){

            html+=`

            <div class="note-mcq">

                <b>${i+1}. ${esc(n.question)}</b>

                <div class="note-options">

                    <div>الف) ${esc(n.a)}</div>
                    <div>ب) ${esc(n.b)}</div>
                    <div>ج) ${esc(n.c)}</div>
                    <div>د) ${esc(n.d)}</div>

                </div>

            </div>`;
        }

        html+=`</div>`;
    });

    document.getElementById("notesPreview").innerHTML=html;
}


/* =====================================
   SAVE DRAFT
===================================== */

function saveDraft(){

    const data={
        paper:paperData(),

        notesSettings:{
            school:val("nschool"),
            className:val("nclass"),
            subject:val("nsubject"),
            chapter:val("nchapter")
        },

        notes:notes
    };

    localStorage.setItem(
        "risen_draft",
        JSON.stringify(data)
    );

    alert("Draft محفوظ ہوگیا ہے۔");
}


function loadDraft(){

    const raw=localStorage.getItem("risen_draft");

    if(!raw){
        alert("کوئی Draft موجود نہیں۔");
        return;
    }

    try{

        const d=JSON.parse(raw);

        setPaperData(d.paper);

        if(d.notesSettings){

            document.getElementById("nschool").value =
                d.notesSettings.school || "";

            document.getElementById("nclass").value =
                d.notesSettings.className || "9th";

            document.getElementById("nsubject").value =
                d.notesSettings.subject || "";

            document.getElementById("nchapter").value =
                d.notesSettings.chapter || "";
        }

        notes=d.notes || [];

        renderEditors();
        renderNotesEditor();

        updatePaper();
        updateNotes();

        alert("Draft load ہوگیا ہے۔");

    }catch(e){

        alert("Draft load نہیں ہوسکا۔");
    }
}


function setPaperData(d){

    if(!d) return;

    const ids=[
        "schoolName",
        "examName",
        "paperClass",
        "paperSubject",
        "paperChapter",
        "paperDate",
        "paperTime",
        "totalMarks",
        "studentName",
        "rollNumber",
        "section",
        "teacherName"
    ];

    const keys=[
        "schoolName",
        "examName",
        "paperClass",
        "paperSubject",
        "paperChapter",
        "paperDate",
        "paperTime",
        "totalMarks",
        "studentName",
        "rollNumber",
        "section",
        "teacherName"
    ];

    ids.forEach((id,i)=>{

        const e=document.getElementById(id);

        if(e){
            e.value=d[keys[i]] || "";
        }
    });

    mcqs=d.mcqs || [];
    shorts=d.shorts || [];
    longs=d.longs || [];
    fills=d.fills || [];
    truefalse=d.truefalse || [];

    renderEditors();
}


/* =====================================
   CLEAR
===================================== */

function clearAll(){

    if(!confirm("کیا آپ تمام موجودہ data صاف کرنا چاہتے ہیں؟")){
        return;
    }

    document.querySelectorAll(
        "#paperTab input,#paperTab textarea"
    ).forEach(e=>{
        if(e.id!=="schoolName"){
            e.value="";
        }
    });

    document.getElementById("schoolName").value =
        "The Risen High School";

    mcqs=[];
    shorts=[];
    longs=[];
    fills=[];
    truefalse=[];

    notes=[];

    document.getElementById("nschool").value =
        "The Risen High School";

    document.getElementById("nsubject").value="";
    document.getElementById("nchapter").value="";

    renderEditors();
    renderNotesEditor();

    updatePaper();
    updateNotes();
}


/* =====================================
   SAVE NAMED PAPER / NOTES
===================================== */

function saveCurrentPaper(){

    saveType="paper";

    document.getElementById("modalTitle").textContent =
        "Save Paper";

    document.getElementById("saveName").value =
        val("examName") || "My Paper";

    document.getElementById("saveModal").style.display =
        "flex";
}


function saveCurrentNotes(){

    saveType="notes";

    document.getElementById("modalTitle").textContent =
        "Save Notes";

    document.getElementById("saveName").value =
        val("nsubject") || "My Notes";

    document.getElementById("saveModal").style.display =
        "flex";
}


function closeSaveModal(){

    document.getElementById("saveModal").style.display =
        "none";
}


function confirmSave(){

    const name=
        document.getElementById("saveName").value.trim();

    if(!name){
        alert("براہِ کرم نام لکھیں۔");
        return;
    }

    const item={
        id:Date.now(),
        name:name,
        date:new Date().toLocaleString(),
    };

    if(saveType==="paper"){

        item.data=paperData();

        savedPapers.unshift(item);

        localStorage.setItem(
            "risen_saved_papers",
            JSON.stringify(savedPapers)
        );
    }

    else{

        item.data={
            school:val("nschool"),
            className:val("nclass"),
            subject:val("nsubject"),
            chapter:val("nchapter"),
            notes:JSON.parse(JSON.stringify(notes))
        };

        savedNotes.unshift(item);

        localStorage.setItem(
            "risen_saved_notes",
            JSON.stringify(savedNotes)
        );
    }

    closeSaveModal();

    renderSaved();

    alert("محفوظ ہوگیا ہے۔");
}

===================================== */

function renderSaved(){

    const papers=
        document.getElementById("savedPapersList");

/* =====================================
   OPEN SAVED PAPER
===================================== */

function openSavedPaper(id){

    const item=
        savedPapers.find(x=>x.id===id);

    if(!item) return;

    setPaperData(item.data);

    showTab("paper");

    updatePaper();
}


function openSavedNotes(id){

    const item=
        savedNotes.find(x=>x.id===id);

    if(!item) return;

    document.getElementById("nschool").value=
        item.data.school || "The Risen High School";

    document.getElementById("nclass").value=
        item.data.className || "9th";

    document.getElementById("nsubject").value=
        item.data.subject || "";

    document.getElementById("nchapter").value=
        item.data.chapter || "";

    notes=item.data.notes || [];

    renderNotesEditor();

    showTab("notes");

    updateNotes();
}


/* =====================================
   DELETE
===================================== */

function deleteSavedPaper(id){

    if(!confirm("کیا یہ Paper delete کرنا ہے؟")){
        return;
    }

    savedPapers=
        savedPapers.filter(x=>x.id!==id);

    localStorage.setItem(
        "risen_saved_papers",
        JSON.stringify(savedPapers)
    );

    renderSaved();
}


function deleteSavedNotes(id){

    if(!confirm("کیا یہ Notes delete کرنے ہیں؟")){
        return;
    }

    savedNotes=
        savedNotes.filter(x=>x.id!==id);

    localStorage.setItem(
        "risen_saved_notes",
        JSON.stringify(savedNotes)
    );

    renderSaved();
}

function downloadCurrent(type){

            "paperPreview"
        ).outerHTML;

    }else{

        updateNotes();

    );

function downloadSavedPaper(id){

    const item=
        savedPapers.find(x=>x.id===id);

    if(!item) return;

    setPaperData(item.data);

    updatePaper();

    downloadHTMLFile(
        document.getElementById("paperPreview").outerHTML,
        safeFilename(item.name)+".html"
    );
}


function downloadSavedNotes(id){

    const item=
        savedNotes.find(x=>x.id===id);

    if(!item) return;

    openSavedNotes(id);

    updateNotes();

    downloadHTMLFile(
        document.getElementById("notesPreview").outerHTML,
        safeFilename(item.name)+".html"
    );
}


function downloadHTMLFile(content,filename){

    const css=
        Array.from(document.querySelectorAll("style"))
        .map(s=>s.innerHTML)
        .join("\n");

    const full=`

<!DOCTYPE html>

<html lang="ur" dir="rtl">

<head>

<meta charset="UTF-8">

<title>The Risen High School</title>

<style>

@font-face{

    font-family:"JameelNoori";

    src:url("https://cdn.jsdelivr.net/gh/tariq-abdullah/urdu-web-font-CDN/JameelNooriNastaleeq.woff")
    format("woff");

}

${css}

body{
    margin:0;
    background:#fff;
}

</style>

</head>

<body>

${content}

</body>

</html>`;


    const blob=
        new Blob(
            [full],
            {type:"text/html;charset=utf-8"}
        );


    const url=
        URL.createObjectURL(blob);

    const a=
        document.createElement("a");

    a.href=url;
    a.download=filename;

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

    setTimeout(function(){

        URL.revokeObjectURL(url);

    },1000);
}


/* =====================================
   SECURITY / TEXT
===================================== */

function esc(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function escAttr(value){

    return esc(value);
}


function safeFilename(name){

    return String(name || "document")
        .replace(/[\\\/:*?"<>|]/g,"-")
        .substring(0,80);
}
