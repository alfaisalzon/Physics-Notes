<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Risen High School - Paper & Notes Maker</title>

<style>

/* =========================
   JAMEEL NOORI NASTALEEQ
========================= */
@font-face{
    font-family:"JameelNoori";
    src:url("https://cdn.jsdelivr.net/gh/tariq-abdullah/urdu-web-font-CDN/JameelNooriNastaleeq.woff")
        format("woff");
    font-weight:normal;
    font-style:normal;
    font-display:swap;
}

/* =========================
   BASIC
========================= */
*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#eef2f7;
    color:#111;
    font-family:"Segoe UI",Arial,sans-serif;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* =========================
   TOP BAR
========================= */
.topbar{
    background:#123d6a;
    color:white;
    padding:14px 18px;
}

.topbar-inner{
    width:100%;
    max-width:1500px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:14px;
}

.brand{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.logo-box{
    width:65px;
    height:65px;
    border-radius:12px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    margin-bottom:7px;
}

.logo-box img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.logo-placeholder{
    color:#123d6a;
    font-size:34px;
    font-weight:900;
}

.brand h1{
    margin:0;
    font-size:25px;
    text-align:center;
}

.brand p{
    margin:2px 0 0;
    opacity:.9;
    text-align:center;
}

.header-buttons{
    width:100%;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:7px;
}

.header-buttons button{
    border:0;
    border-radius:7px;
    padding:9px 13px;
    background:white;
    color:#123d6a;
    font-weight:700;
}

.header-buttons button:hover{
    background:#e6eef7;
}

/* =========================
   MAIN
========================= */
.container{
    width:100%;
    max-width:1500px;
    margin:auto;
    padding:18px;
}

.tabs{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.tab-btn{
    border:0;
    padding:11px 18px;
    border-radius:8px;
    background:#d6deea;
    color:#173c61;
    font-weight:700;
}

.tab-btn.active{
    background:#123d6a;
    color:white;
}

.tab-content{
    display:none;
}

.tab-content.active{
    display:block;
}

/* =========================
   EDITOR GRID
========================= */
.workspace{
    display:grid;
    grid-template-columns:430px 1fr;
    gap:18px;
    align-items:start;
}

.panel{
    background:white;
    border-radius:12px;
    padding:16px;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.panel h2{
    margin:0 0 12px;
    color:#123d6a;
    font-size:20px;
}

.panel h3{
    color:#123d6a;
    margin:16px 0 8px;
    border-bottom:1px solid #d8dee7;
    padding-bottom:5px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.form-group{
    margin-bottom:9px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    display:block;
    font-weight:700;
    margin-bottom:4px;
    font-size:13px;
}

input,
select,
textarea{
    width:100%;
    border:1px solid #b9c4d2;
    border-radius:6px;
    padding:9px;
    background:white;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#2369a8;
    box-shadow:0 0 0 2px rgba(35,105,168,.1);
}

textarea{
    resize:vertical;
    min-height:75px;
    direction:rtl;
    font-family:"JameelNoori","Noto Nastaliq Urdu",serif;
}

.urdu-input{
    font-family:"JameelNoori","Noto Nastaliq Urdu",serif !important;
    direction:rtl;
}

.action-row{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:10px;
}

.btn{
    border:0;
    border-radius:7px;
    padding:9px 13px;
    font-weight:700;
}

.btn-primary{
    background:#123d6a;
    color:white;
}

.btn-success{
    background:#198754;
    color:white;
}

.btn-danger{
    background:#c62828;
    color:white;
}

.btn-secondary{
    background:#68778a;
    color:white;
}

.btn-light{
    background:#e8edf3;
    color:#172b42;
}

/* =========================
   QUESTIONS EDITOR
========================= */
.question-editor{
    border:1px solid #d2d9e2;
    border-radius:8px;
    padding:10px;
    margin-bottom:9px;
    background:#fafbfd;
}

.question-editor-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:5px;
    margin-bottom:6px;
    font-weight:bold;
}

.small-btn{
    border:0;
    border-radius:5px;
    padding:5px 8px;
    font-size:12px;
}

.question-editor textarea{
    margin-bottom:6px;
}

/* =========================
   PREVIEW
========================= */
.preview-panel{
    position:sticky;
    top:10px;
}

.preview-tools{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
}

.preview-tools h2{
    margin:0;
    color:#123d6a;
}

.paper-stage{
    background:#dce2eb;
    padding:25px 10px;
    border-radius:12px;
    overflow:auto;
    min-height:500px;
}

/* =========================
   OLD A4 TEMPLATE
========================= */
.a4{
    width:210mm;
    min-height:297mm;
    background:white;
    margin:0 auto;
    padding:14mm;
    color:#111;
    box-shadow:0 5px 25px rgba(0,0,0,.15);
    position:relative;
    direction:rtl;

    font-family:
        "JameelNoori",
        "Jameel Noori Nastaleeq",
        "Noto Nastaliq Urdu",
        serif;

    font-variant-ligatures:normal;
    font-feature-settings:normal;
}

.a4 *{
    font-family:
        "JameelNoori",
        "Jameel Noori Nastaleeq",
        "Noto Nastaliq Urdu",
        serif;
}

.paper-header{
    text-align:center;
    border-bottom:2px solid #111;
    padding-bottom:7px;
    margin-bottom:8px;
}

.preview-school{
    font-family:"Segoe UI",Arial,sans-serif !important;
    font-weight:900;
    font-size:22px;
    direction:ltr;
}

.preview-exam{
    font-size:21px;
    font-weight:bold;
    margin-top:3px;
}

.preview-meta{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:6px;
    direction:ltr;
    font-size:12px;
    margin-top:7px;
}

.meta-cell{
    border:1px solid #111;
    padding:4px 5px;
    min-height:25px;
    font-family:"JameelNoori","Noto Nastaliq Urdu",serif !important;
}

.student-row{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr;
    direction:ltr;
    margin:8px 0;
    border:1px solid #111;
}

.student-cell{
    min-height:29px;
    padding:5px;
    border-right:1px solid #111;
    font-family:"JameelNoori","Noto Nastaliq Urdu",serif !important;
    font-size:12px;
}

.student-cell:last-child{
    border-right:none;
}

.paper-section{
    margin-top:13px;
}

.paper-section-title{
    font-size:18px;
    font-weight:bold;
    border-bottom:1px solid #111;
    padding-bottom:2px;
    margin-bottom:5px;
}

.mcq-preview{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px 20px;
}

.mcq-preview-item{
    break-inside:avoid;
}

.mcq-options-preview{
    display:grid;
    grid-template-columns:1fr 1fr;
    font-family:"JameelNoori","Noto Nastaliq Urdu",serif !important;
    font-size:14px;
    margin-top:2px;
}

.q-row{
    display:flex;
    gap:7px;
    margin-bottom:8px;
    line-height:1.8;
    break-inside:avoid;
}

.q-number{
    font-weight:bold;
    min-width:25px;
}

.lines{
    flex:1;
    min-height:35px;
    border-bottom:1px dashed #888;
}

.long-answer{
    margin-bottom:12px;
    break-inside:avoid;
}

.answer-lines{
    height:65px;
    margin-top:4px;
    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 22px,
            #999 23px
        );
}

.fill-row{
    margin-bottom:8px;
    line-height:1.8;
}

.truefalse{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    margin-bottom:7px;
}

.tf-options{
    font-family:"JameelNoori","Noto Nastaliq Urdu",serif !important;
    white-space:nowrap;
}

.paper-footer{
    position:absolute;
    bottom:7mm;
    left:14mm;
    right:14mm;
    border-top:1px solid #555;
    padding-top:3px;
    display:flex;
    justify-content:space-between;
    font-family:"Segoe UI",Arial,sans-serif !important;
    font-size:10px;
}

/* =========================
   NOTES
========================= */
.notes-preview{
    min-height:297mm;
}

.notes-block{
    margin-bottom:12px;
}

.notes-heading{
    font-size:22px;
    font-weight:bold;
    border-bottom:2px solid #111;
    padding-bottom:3px;
}

.notes-subheading{
    font-size:18px;
    font-weight:bold;
    margin-bottom:3px;
}

.notes-text{
    font-size:16px;
    line-height:2;
}

.notes-points{
    line-height:2;
    font-size:16px;
}

.notes-points div{
    margin-bottom:2px;
}

.notes-mcq{
    border:1px solid #111;
    padding:7px;
    margin-bottom:8px;
}

.notes-answer{
    font-weight:bold;
}

/* =========================
   SAVED ITEMS
========================= */
.saved-list{
    display:grid;
    gap:8px;
}

.saved-item{
    border:1px solid #ccd4df;
    border-radius:8px;
    padding:10px;
    background:#fafbfd;
}

.saved-item strong{
    color:#123d6a;
}

.saved-actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:7px;
}

/* =========================
   STATUS
========================= */
.status{
    padding:8px;
    border-radius:7px;
    background:#eef4fa;
    color:#123d6a;
    margin-top:8px;
    font-size:13px;
}

/* =========================
   HIDDEN
========================= */
.hidden{
    display:none !important;
}

/* =========================
   MOBILE
========================= */
@media(max-width:1000px){

    .workspace{
        grid-template-columns:1fr;
    }

    .preview-panel{
        position:static;
    }
}

@media(max-width:600px){

    .container{
        padding:9px;
    }

    .topbar{
        padding:12px 8px;
    }

    .brand h1{
        font-size:21px;
    }

    .header-buttons button{
        padding:8px 10px;
        font-size:12px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .preview-tools{
        flex-direction:column;
        align-items:stretch;
    }

    .paper-stage{
        padding:10px 3px;
    }

    .a4{
        transform-origin:top left;
    }

    .mcq-preview{
        grid-template-columns:1fr;
    }
}

/* =========================
   PRINT
========================= */
@media print{

    @page{
        size:A4;
        margin:0;
    }

    html,
    body{
        margin:0 !important;
        padding:0 !important;
        background:#fff !important;
    }

    .a4{
        width:210mm !important;
        min-height:297mm !important;
        margin:0 !important;
        padding:14mm !important;
        box-shadow:none !important;
    }
}

</style>
</head>

<body>

<!-- =========================

<header class="topbar no-print">

<script>

/* =====================================================
   GLOBAL DATA
===================================================== */

let currentTab = "paper";

let mcqs = [];
let shorts = [];
let longs = [];
let fills = [];
let trueFalse = [];

let notes = [];

let editingSavedId = null;


/* =====================================================
   UTILITY
===================================================== */

function esc(value){

    if(value === undefined || value === null){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function val(id){

    const el = document.getElementById(id);

    return el ? el.value : "";
}


/* =====================================================
   TAB
===================================================== */

function openTab(tab,button){

    currentTab = tab;

    document.querySelectorAll(".tab-content")
        .forEach(function(el){
            el.classList.remove("active");
        });

    document.querySelectorAll(".tab-btn")
        .forEach(function(el){
            el.classList.remove("active");
        });

    if(tab === "paper"){
        document.getElementById("paperTab")
            .classList.add("active");
        updatePaper();
    }

    if(tab === "notes"){
        document.getElementById("notesTab")
            .classList.add("active");
        updateNotes();
    }

    if(tab === "saved"){
        document.getElementById("savedTab")
            .classList.add("active");
        refreshSaved();
    }

    if(button){
        button.classList.add("active");
    }
}

function loadLogo(event){

    const file =
        event.target.files[0];

    if(!file) return;

    const reader =
        new FileReader();

    reader.onload = function(e){

        const img =
            document.getElementById("headerLogo");

        img.src = e.target.result;

        img.classList.remove("hidden");

        document.getElementById("logoPlaceholder")
            .classList.add("hidden");

        localStorage.setItem(
            "risenLogo",
            e.target.result
        );
    };

    reader.readAsDataURL(file);
}

/* =====================================================
   LOAD DRAFT
===================================================== */

function loadDraft(){

    const raw =
        localStorage.getItem("risenDraft");

    if(!raw){

        alert("کوئی saved draft نہیں ملا۔");

        return;
    }


    try{

        const data =
            JSON.parse(raw);


        if(data.paper){

            const p =
                data.paper;


            setValue("schoolName",p.schoolName);
            setValue("examName",p.examName);
            setValue("paperClass",p.paperClass);
            setValue("subject",p.subject);
            setValue("chapter",p.chapter);
            setValue("paperDate",p.date);
            setValue("paperTime",p.time);
            setValue("totalMarks",p.totalMarks);
            setValue("studentName",p.studentName);
            setValue("rollNo",p.rollNo);
            setValue("section",p.section);
            setValue(
                "teacherName",
                p.teacherName || "Sir Rana Faisal"
            );


            mcqs = p.mcqs || [];
            shorts = p.shorts || [];
            longs = p.longs || [];
            fills = p.fills || [];
            trueFalse = p.trueFalse || [];

        }


        if(data.notes){

            setValue(
                "notesSchool",
                data.notes.school
            );

            setValue(
                "notesClass",
                data.notes.cls
            );

            setValue(
                "notesSubject",
                data.notes.subject
            );

            setValue(
                "notesChapter",
                data.notes.chapter
            );

            notes =
                data.notes.notes || [];

        }


        renderEditors();
        renderNotesEditor();

        updatePaper();
        updateNotes();

        alert("Draft load ہو گیا ہے۔");

    }catch(e){

        alert("Draft load نہیں ہو سکا۔");
    }
}


function setValue(id,value){

    const el =
        document.getElementById(id);

    if(el && value !== undefined){

        el.value = value;
    }
}


/* =====================================================
   CLEAR
===================================================== */

function clearAll(){

    if(!confirm(
        "کیا آپ واقعی موجودہ تمام data صاف کرنا چاہتے ہیں؟"
    )){
        return;
    }


    document.querySelectorAll(
        "#paperTab input:not([type=file]), #paperTab textarea"
    ).forEach(function(el){

        if(el.id === "schoolName"){
            el.value = "The Risen High School";
        }
        else if(el.id === "examName"){
            el.value = "ماہانہ ٹیسٹ";
        }
        else if(el.id === "paperTime"){
            el.value = "2 Hours";
        }
        else if(el.id === "totalMarks"){
            el.value = "50";
        }
        else if(el.id === "teacherName"){
            el.value = "Sir Rana Faisal";
        }
        else{
            el.value = "";
        }

    });


    mcqs = [];
    shorts = [];
    longs = [];
    fills = [];
    trueFalse = [];

    notes = [];

    renderEditors();
    renderNotesEditor();

    updatePaper();
    updateNotes();
}

/* =====================================================
   OPEN SAVED
===================================================== */

function openSaved(id){

    const item =
        getSaved().find(function(x){
            return x.id === id;
        });


    if(!item) return;


    if(item.type === "paper"){

        const p =
            item.data;


        setValue("schoolName",p.schoolName);
        setValue("examName",p.examName);
        setValue("paperClass",p.paperClass);
        setValue("subject",p.subject);
        setValue("chapter",p.chapter);
        setValue("paperDate",p.date);
        setValue("paperTime",p.time);
        setValue("totalMarks",p.totalMarks);
        setValue("studentName",p.studentName);
        setValue("rollNo",p.rollNo);
        setValue("section",p.section);
        setValue(
            "teacherName",
            p.teacherName || "Sir Rana Faisal"
        );


        mcqs = p.mcqs || [];
        shorts = p.shorts || [];
        longs = p.longs || [];
        fills = p.fills || [];
        trueFalse = p.trueFalse || [];


        renderEditors();

        document.querySelectorAll(".tab-btn")
            .forEach(function(btn,index){

                if(index === 0){

                    openTab("paper",btn);
                }
            });

        updatePaper();
    }


    if(item.type === "notes"){

        const n =
            item.data;


        setValue(
            "notesSchool",
            n.school
        );

        setValue(
            "notesClass",
            n.cls
        );

        setValue(
            "notesSubject",
            n.subject
        );

        setValue(
            "notesChapter",
            n.chapter
        );

        notes =
            n.notes || [];


        renderNotesEditor();

        document.querySelectorAll(".tab-btn")
            .forEach(function(btn,index){

                if(index === 1){

                    openTab("notes",btn);
                }
            });

        updateNotes();
    }
}

function downloadSaved(id){

    const item =
        getSaved().find(function(x){
            return x.id === id;
        });


    if(!item) return;


    let html = "";
    let filename = "";


    if(item.type === "paper"){

        html =
            buildFullHTML(
                buildPaperHTML(item.data),
                item.name
            );

        filename =
            safeFilename(item.name) +
            ".html";

    }else{

        html =
            buildFullHTML(
                buildNotesHTML(item.data),
                item.name
            );

        filename =
            safeFilename(item.name) +
            ".html";
    }


    downloadFile(
        html,
        filename
    );
}


function safeFilename(name){

    return String(name)
        .replace(/[\\/:*?"<>|]/g,"-")
        .substring(0,100);
}


function downloadFile(content,filename){

    const blob =
        new Blob(
            [content],
            {
                type:"text/html;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");

    a.href = url;

    a.download = filename;

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(function(){

        URL.revokeObjectURL(url);

    },1000);
}

===================================================== */

function loadStoredLogo(){

    const logo =
        localStorage.getItem("risenLogo");


    if(!logo) return;


    const img =
        document.getElementById(
            "headerLogo"
        );


    img.src = logo;

    img.classList.remove("hidden");

    document.getElementById(
        "logoPlaceholder"
    ).classList.add("hidden");
}


/* =====================================================
   AUTO LOAD
===================================================== */

function loadAutoData(){

    try{

        const paperRaw =
            localStorage.getItem(
                "risenAutoPaper"
            );


        if(paperRaw){

            const p =
                JSON.parse(paperRaw);


            setValue(
                "schoolName",
                p.schoolName ||
                "The Risen High School"
            );

            setValue(
                "examName",
                p.examName ||
                "ماہانہ ٹیسٹ"
            );

            setValue(
                "paperClass",
                p.paperClass
            );

            setValue(
                "subject",
                p.subject
            );

            setValue(
                "chapter",
                p.chapter
            );

            setValue(
                "paperDate",
                p.date
            );

            setValue(
                "paperTime",
                p.time ||
                "2 Hours"
            );

            setValue(
                "totalMarks",
                p.totalMarks ||
                "50"
            );

            setValue(
                "studentName",
                p.studentName
            );

            setValue(
                "rollNo",
                p.rollNo
            );

            setValue(
                "section",
                p.section
            );

            setValue(
                "teacherName",
                p.teacherName ||
                "Sir Rana Faisal"
            );


            mcqs =
                p.mcqs || [];

            shorts =
                p.shorts || [];

            longs =
                p.longs || [];

            fills =
                p.fills || [];

            trueFalse =
                p.trueFalse || [];
        }


        const notesRaw =
            localStorage.getItem(
                "risenAutoNotes"
            );


        if(notesRaw){

            const n =
                JSON.parse(notesRaw);


            setValue(
                "notesSchool",
                n.school ||
                "The Risen High School"
            );

            setValue(
                "notesClass",
                n.cls
            );

            setValue(
                "notesSubject",
                n.subject
            );

            setValue(
                "notesChapter",
                n.chapter
            );


            notes =
                n.notes || [];
        }

    }catch(e){

        console.log(
            "Auto load error",
            e
        );
    }
}


/* =====================================================
   KEYBOARD SHORTCUTS
===================================================== */

document.addEventListener(
    "keydown",
    function(e){

        if(
            (e.ctrlKey || e.metaKey) &&
            e.key.toLowerCase() === "s"
        ){

            e.preventDefault();

            saveDraft();
        }


        if(
            (e.ctrlKey || e.metaKey) &&
            e.key.toLowerCase() === "p"
        ){

            e.preventDefault();

            printDocument();
        }

    }
);


/* =====================================================
   FONT READY
===================================================== */

function afterFontReady(){

    updatePaper();

    updateNotes();
}


if(
    document.fonts &&
    document.fonts.ready
){

    document.fonts.ready.then(
        afterFontReady
    );

}else{

    setTimeout(
        afterFontReady,
        1000
    );
}


/* =====================================================
   INITIALIZE
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadStoredLogo();

        loadAutoData();

        renderEditors();

        renderNotesEditor();

        updatePaper();

        updateNotes();

        refreshSaved();

    }
);

</script>
