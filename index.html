<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>The Risen High School Paper and Notes</title>

<style>
:root{
  --primary:#1457d9;
  --primary2:#0b3d91;
  --secondary:#eef4ff;
  --success:#138a4b;
  --danger:#d93636;
  --warning:#e69b00;
  --dark:#172033;
  --muted:#6b7280;
  --white:#fff;
  --border:#d9e0eb;
  --bg:#f3f6fb;
}

@font-face{
  font-family:Jameel;
  src:url("https://cdn.jsdelivr.net/gh/tariq-abdullah/urdu-web-font-CDN/JameelNooriNastaleeq.woff");
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--dark);
  font-family:Jameel,Arial,sans-serif;
}

button,
input,
select,
textarea{
  font-family:Jameel,Arial,sans-serif;
}

button{
  cursor:pointer;
}

.topbar{
  background:linear-gradient(135deg,var(--primary2),var(--primary));
  color:white;
  padding:12px;
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.logo-box{
  width:65px;
  height:65px;
  border-radius:10px;
  background:white;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.logo-box img{
  max-width:100%;
  max-height:100%;
}

.logo-placeholder{
  color:#777;
  font-size:13px;
  text-align:center;
}

.school-head{
  flex:1;
  min-width:220px;
}

.school-head h1{
  margin:0;
  font-size:25px;
}

.school-head p{
  margin:0;
  font-size:15px;
}

.top-actions{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.btn{
  border:0;
  border-radius:7px;
  padding:8px 13px;
  background:white;
  color:var(--primary2);
  font-weight:bold;
  font-size:14px;
}

.btn:hover{
  opacity:.9;
}

.btn-primary{
  background:var(--primary);
  color:white;
}

.btn-success{
  background:var(--success);
  color:white;
}

.btn-danger{
  background:var(--danger);
  color:white;
}

.btn-warning{
  background:var(--warning);
  color:white;
}

.container{
  max-width:1400px;
  margin:auto;
  padding:12px;
}

.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-bottom:12px;
}

.tab{
  border:1px solid var(--border);
  background:white;
  padding:10px 15px;
  border-radius:8px;
  font-weight:bold;
}

.tab.active{
  background:var(--primary);
  color:white;
}

.panel{
  background:white;
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px;
  margin-bottom:12px;
}

.panel h2,
.panel h3{
  margin-top:0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.field label{
  display:block;
  font-weight:bold;
  margin-bottom:3px;
}

.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid var(--border);
  border-radius:7px;
  padding:8px;
  font-size:15px;
  background:white;
}

.field textarea{
  min-height:80px;
  resize:vertical;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
  flex-wrap:wrap;
}

.question-box{
  border:1px solid var(--border);
  border-radius:8px;
  padding:10px;
  margin-bottom:10px;
  background:#fafcff;
}

.question-grid{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:8px;
}

.options-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px;
}

.option{
  display:flex;
  align-items:center;
  gap:5px;
}

.option input{
  flex:1;
}

.small-btn{
  border:0;
  border-radius:6px;
  padding:5px 9px;
}

.remove{
  background:#ffe5e5;
  color:var(--danger);
}

.add{
  background:var(--secondary);
  color:var(--primary2);
}

.preview-wrap{
  overflow:auto;
  background:#ddd;
  padding:15px;
  border-radius:8px;
}

.a4{
  width:210mm;
  min-height:297mm;
  margin:0 auto;
  background:white;
  padding:12mm;
  color:#111;
  position:relative;
  box-shadow:0 0 8px rgba(0,0,0,.2);
}

.paper-header{
  text-align:center;
  border-bottom:2px solid #111;
  padding-bottom:5px;
  margin-bottom:7px;
}

.paper-header img{
  max-width:60px;
  max-height:60px;
  float:right;
}

.paper-header h1{
  margin:0;
  font-size:25px;
}

.paper-header h2{
  margin:0;
  font-size:20px;
}

.paper-header p{
  margin:0;
  font-size:14px;
}

.paper-meta{
  display:grid;
  grid-template-columns:1fr 1fr;
  border:1px solid #111;
  margin-bottom:7px;
}

.paper-meta div{
  padding:4px 6px;
  border-left:1px solid #111;
  border-bottom:1px solid #111;
}

.student-row{
  border:1px solid #111;
  padding:5px;
  margin-bottom:8px;
}

.preview-section{
  margin-bottom:8px;
}

.preview-section-title{
  font-weight:bold;
  font-size:18px;
  border-bottom:1px solid #111;
  margin-bottom:4px;
}

.preview-mcq{
  margin-bottom:7px;
}

.preview-options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:2px 15px;
  padding-right:10px;
}

.preview-footer{
  text-align:center;
  border-top:1px solid #111;
  padding-top:5px;
  margin-top:12px;
  font-size:13px;
}

.note-editor{
  border:1px solid var(--border);
  border-radius:8px;
  padding:10px;
  margin-bottom:10px;
  background:#fafcff;
}

.note-editor-grid{
  display:grid;
  grid-template-columns:170px 1fr;
  gap:8px;
}

.note-editor textarea{
  width:100%;
  min-height:90px;
  border:1px solid var(--border);
  border-radius:7px;
  padding:8px;
}

.notes-page{
  direction:rtl;
}

.notes-header{
  text-align:center;
  border-bottom:2px solid #111;
  padding-bottom:6px;
  margin-bottom:10px;
}

.notes-header h1{
  margin:0;
  font-size:25px;
}

.notes-header h2{
  margin:0;
  font-size:19px;
}

.notes-info{
  display:grid;
  grid-template-columns:1fr 1fr;
  border:1px solid #111;
  margin-bottom:10px;
}

.notes-info div{
  padding:4px 7px;
  border-left:1px solid #111;
  border-bottom:1px solid #111;
}

.note-preview-block{
  margin-bottom:10px;
}

.note-preview-title{
  font-weight:bold;
  font-size:19px;
  margin-bottom:4px;
}

.note-keypoints{
  margin:0;
  padding-right:25px;
}

.note-detailed{
  line-height:2;
}

.notes-mcq-container{
  display:grid;
  grid-template-columns:1fr 1fr;
  column-gap:12mm;
  row-gap:8px;
  direction:rtl;
}

.notes-mcq{
  border:1px solid #222;
  padding:5px 7px;
  break-inside:avoid;
  min-height:45mm;
}

.notes-mcq-question{
  font-weight:bold;
  margin-bottom:5px;
  line-height:1.7;
}

.notes-mcq-options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px 12px;
  direction:rtl;
}

.notes-mcq-option{
  line-height:1.6;
}

.saved-card{
  border:1px solid var(--border);
  background:white;
  padding:10px;
  border-radius:8px;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.saved-info{
  flex:1;
}

.saved-actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.hidden{
  display:none!important;
}

.notice{
  padding:8px 10px;
  border-radius:7px;
  background:var(--secondary);
  margin-bottom:10px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:20px;
}

@media(max-width:900px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .question-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr;
  }

  .note-editor-grid{
    grid-template-columns:1fr;
  }

  .topbar{
    align-items:flex-start;
  }

  .school-head h1{
    font-size:21px;
  }

  .notes-mcq-container{
    grid-template-columns:1fr 1fr;
    column-gap:5mm;
  }
}

@media print{
  body{
    background:white;
  }

  body *{
    visibility:hidden;
  }

  #printArea.print-active,
  #printArea.print-active *,
  #notesPrintArea.print-active,
  #notesPrintArea.print-active *{
    visibility:visible;
  }

  #printArea.print-active,
  #notesPrintArea.print-active{
    position:absolute;
    left:0;
    top:0;
    width:100%;
  }

  .a4{
    box-shadow:none;
    margin:0;
    width:210mm;
    min-height:297mm;
    height:auto;
  }

  .paper-footer,
  .preview-footer{
    position:static!important;
  }
}
</style>
</head>

<body>

<header class="topbar">

  <div class="logo-box">
    <img id="headerLogo" class="hidden">
    <div id="logoPlaceholder" class="logo-placeholder">Logo</div>
  </div>

  <div class="school-head">
    <h1>The Risen High School</h1>
    <p>Paper & Notes Maker</p>
  </div>

  <div class="top-actions">
    <button class="btn btn-success" onclick="savePaper()">💾 Save Paper</button>
    <button class="btn btn-success" onclick="saveNotes()">💾 Save Notes</button>
    <button class="btn" onclick="saveDraft()">💾 Save Draft</button>
    <button class="btn" onclick="loadDraft()">📂 Load</button>
    <button class="btn btn-danger" onclick="clearAll()">🗑 Clear</button>
    <button class="btn btn-primary" onclick="printDocument()">🖨 Print / PDF</button>
  </div>

</header>

<div class="container">

  <div class="tabs">
    <button class="tab active" id="tabPaper" onclick="showTab('paper')">📝 Paper Maker</button>
    <button class="tab" id="tabNotes" onclick="showTab('notes')">📚 Notes Maker</button>
    <button class="tab" id="tabSavedPapers" onclick="showTab('savedPapers')">📁 Saved Papers</button>
    <button class="tab" id="tabSavedNotes" onclick="showTab('savedNotes')">📁 Saved Notes</button>
  </div>

  <!-- PAPER -->
  <section id="paperTab">

    <div class="panel">

      <h2>Paper Settings</h2>

      <div class="grid">

        <div class="field">
          <label>School Name</label>
          <input id="schoolName" value="The Risen High School">
        </div>

        <div class="field">
          <label>Exam / Test</label>
          <input id="examName" value="Monthly Test">
        </div>

        <div class="field">
          <label>Class</label>
          <select id="paperClass"></select>
        </div>

        <div class="field">
          <label>Subject</label>
          <input id="paperSubject">
        </div>

        <div class="field">
          <label>Chapter</label>
          <input id="paperChapter">
        </div>

        <div class="field">
          <label>Date</label>
          <input id="paperDate" type="date">
        </div>

        <div class="field">
          <label>Time</label>
          <input id="paperTime" value="2 Hours">
        </div>

        <div class="field">
          <label>Total Marks</label>
          <input id="paperMarks" type="number" value="50">
        </div>

        <div class="field">
          <label>Student Name</label>
          <input id="studentName">
        </div>

        <div class="field">
          <label>Roll Number</label>
          <input id="rollNumber">
        </div>

        <div class="field">
          <label>Section</label>
          <input id="section">
        </div>

        <div class="field">
          <label>Teacher</label>
          <input id="teacherName" value="Sir Rana Faisal">
        </div>

        <div class="field">
          <label>School Logo</label>
          <input type="file" accept="image/*" onchange="uploadLogo(event)">
        </div>

      </div>

    </div>

    <div class="panel">

      <div class="section-head">
        <h2>MCQs</h2>
        <button class="btn add" onclick="addMCQ()">➕ Add MCQ</button>
      </div>

      <div id="mcqEditor"></div>

    </div>

    <div class="panel">

      <div class="section-head">
        <h2>Short Questions</h2>
        <button class="btn add" onclick="addShort()">➕ Add</button>
      </div>

      <div id="shortEditor"></div>

    </div>

    <div class="panel">

      <div class="section-head">
        <h2>Long Questions</h2>
        <button class="btn add" onclick="addLong()">➕ Add</button>
      </div>

      <div id="longEditor"></div>

    </div>

    <div class="panel">

      <div class="section-head">
        <h2>Fill in the Blanks</h2>
        <button class="btn add" onclick="addFill()">➕ Add</button>
      </div>

      <div id="fillEditor"></div>

    </div>

    <div class="panel">

      <div class="section-head">
        <h2>True / False</h2>
        <button class="btn add" onclick="addTF()">➕ Add</button>
      </div>

      <div id="tfEditor"></div>

    </div>

    <div class="panel">

      <div class="section-head">
        <h2>Paper Preview</h2>

        <div>
          <button class="btn btn-primary" onclick="updatePaper()">🔄 Update Preview</button>
          <button class="btn btn-success" onclick="savePaper()">💾 Save Paper</button>
          <button class="btn" onclick="downloadPaper()">⬇ Download Paper</button>
          <button class="btn btn-primary" onclick="printDocument()">🖨 Print / PDF</button>
        </div>

      </div>

      <div class="preview-wrap">
        <div id="printArea">
          <div id="paperPreview" class="a4"></div>
        </div>
      </div>

    </div>

  </section>

  <!-- NOTES -->
  <section id="notesTab" class="hidden">

    <div class="panel">

      <div class="section-head">
        <h2>Notes Settings</h2>

        <div>
          <button class="btn btn-success" onclick="saveNotes()">💾 Save Notes</button>
          <button class="btn" onclick="newNotes()">➕ New Notes</button>
        </div>
      </div>

      <div class="grid">

        <div class="field">
          <label>School Name</label>
          <input id="notesSchool" value="The Risen High School">
        </div>

        <div class="field">
          <label>Class</label>
          <select id="notesClass"></select>
        </div>

        <div class="field">
          <label>Subject</label>
          <input id="notesSubject">
        </div>

        <div class="field">
          <label>Chapter</label>
          <input id="notesChapter">
        </div>

        <div class="field">
          <label>Topic</label>
          <input id="notesTopic">
        </div>

      </div>

    </div>

    <div class="panel">

      <div class="section-head">
        <h2>Notes Blocks</h2>

        <button class="btn add" onclick="addNoteBlock()">➕ Add Notes Block</button>
      </div>

      <div id="notesEditor"></div>

    </div>

    <div class="panel">

      <div class="section-head">

        <h2>Notes Preview</h2>

        <div>
          <button class="btn btn-primary" onclick="updateNotes()">🔄 Update Notes</button>
          <button class="btn btn-success" onclick="saveNotes()">💾 Save Notes</button>
          <button class="btn" onclick="downloadNotes()">⬇ Download Notes PNG</button>
          <button class="btn btn-primary" onclick="printDocument()">🖨 Print / PDF</button>
        </div>

      </div>

      <div class="preview-wrap">

        <div id="notesPrintArea">
          <div id="notesPreview" class="a4 notes-page"></div>
        </div>

      </div>

    </div>

  </section>

  <!-- SAVED PAPERS -->
  <section id="savedPapersTab" class="hidden">

    <div class="panel">

      <div class="section-head">
        <h2>📁 Saved Papers</h2>
        <button class="btn" onclick="renderSavedPapers()">🔄 Refresh</button>
      </div>

      <div id="savedPapers"></div>

    </div>

  </section>

  <!-- SAVED NOTES -->
  <section id="savedNotesTab" class="hidden">

    <div class="panel">

      <div class="section-head">
        <h2>📁 Saved Notes</h2>

        <div>
          <button class="btn" onclick="renderSavedNotes()">🔄 Refresh</button>
          <button class="btn btn-success" onclick="newNotes()">➕ New Notes</button>
        </div>

      </div>

      <div id="savedNotes"></div>

    </div>

  </section>

</div>


<script>

const CLASSES = [
  "Playgroup",
  "Nursery",
  "Prep",
  "1st",
  "2nd",
  "3rd",
  "4th",
  "5th",
  "6th",
  "7th",
  "8th",
  "9th",
  "10th",
  "11th",
  "12th",
  "FA Part 1",
  "FA Part 2"
];

let mcqs = [];
let shorts = [];
let longs = [];
let fills = [];
let tfs = [];
let noteBlocks = [];

let currentTab = "paper";

let logoData = "";

let editingPaperId = null;
let editingNotesId = null;


/* =========================
   BASIC HELPERS
========================= */

function get(id){
  return document.getElementById(id);
}

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function nl2br(value){
  return escapeHTML(value).replace(/\n/g,"<br>");
}

function uid(prefix="id"){
  return prefix + "_" + Date.now() + "_" +
    Math.random().toString(36).slice(2,8);
}

function today(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}


/* =========================
   LOCAL STORAGE HELPERS
========================= */

function readStorage(key, fallback=[]){

  try{
    const value = localStorage.getItem(key);

    if(!value) return fallback;

    const parsed = JSON.parse(value);

    return parsed ?? fallback;

  }catch(error){

    console.error("Storage read error:",error);

    return fallback;
  }
}


function writeStorage(key,value){

  try{

    localStorage.setItem(key,JSON.stringify(value));

    return true;

  }catch(error){

    console.error("Storage write error:",error);

    alert("Data save نہیں ہو سکا۔ Browser storage full ہو سکتی ہے۔");

    return false;
  }
}


/* =========================
   TABS
========================= */

function showTab(tab){

  currentTab = tab;

  const sections = {
    paper:"paperTab",
    notes:"notesTab",
    savedPapers:"savedPapersTab",
    savedNotes:"savedNotesTab"
  };

  Object.keys(sections).forEach(key=>{
    get(sections[key]).classList.toggle(
      "hidden",
      key !== tab
    );
  });

  document.querySelectorAll(".tab").forEach(btn=>{
    btn.classList.remove("active");
  });

  if(tab==="paper") get("tabPaper").classList.add("active");
  if(tab==="notes") get("tabNotes").classList.add("active");
  if(tab==="savedPapers"){

    get("tabSavedPapers").classList.add("active");
    renderSavedPapers();

  }

  if(tab==="savedNotes"){

    get("tabSavedNotes").classList.add("active");
    renderSavedNotes();

  }
}


/* =========================
   CLASS SELECTS
========================= */

function fillClassSelects(){

  ["paperClass","notesClass"].forEach(id=>{

    const select = get(id);

    select.innerHTML = "";

    CLASSES.forEach(cls=>{

      const option = document.createElement("option");

      option.value = cls;
      option.textContent = cls;

      select.appendChild(option);

    });

  });

}


/* =========================
   PAPER MCQs
========================= */

function addMCQ(data={}){

  mcqs.push({
    id:uid("mcq"),
    q:data.q || "",
    a:data.a || "",
    b:data.b || "",
    c:data.c || "",
    d:data.d || "",
    answer:data.answer || ""
  });

  renderMCQs();
}


function removeMCQ(index){

  mcqs.splice(index,1);

  renderMCQs();
}


function renderMCQs(){

  const box = get("mcqEditor");

  if(!mcqs.length){

    box.innerHTML =
      `<div class="empty">ابھی کوئی MCQ شامل نہیں کیا گیا۔</div>`;

    return;
  }

  box.innerHTML = mcqs.map((item,index)=>`

    <div class="question-box">

      <div class="section-head">

        <strong>MCQ ${index+1}</strong>

        <button
          class="small-btn remove"
          onclick="removeMCQ(${index})">
          🗑 Remove
        </button>

      </div>

      <div class="field">
        <label>Question</label>

        <textarea
          oninput="mcqs[${index}].q=this.value"
        >${escapeHTML(item.q)}</textarea>
      </div>

      <div class="options-grid">

        <div class="option">
          <b>A)</b>
          <input
            value="${escapeHTML(item.a)}"
            oninput="mcqs[${index}].a=this.value"
          >
        </div>

        <div class="option">
          <b>B)</b>
          <input
            value="${escapeHTML(item.b)}"
            oninput="mcqs[${index}].b=this.value"
          >
        </div>

        <div class="option">
          <b>C)</b>
          <input
            value="${escapeHTML(item.c)}"
            oninput="mcqs[${index}].c=this.value"
          >
        </div>

        <div class="option">
          <b>D)</b>
          <input
            value="${escapeHTML(item.d)}"
            oninput="mcqs[${index}].d=this.value"
          >
        </div>

function uploadLogo(event){

  const file = event.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){

    logoData = e.target.result;

    get("headerLogo").src = logoData;
    get("headerLogo").classList.remove("hidden");
    get("logoPlaceholder").classList.add("hidden");

    updatePaper();

  };

  reader.readAsDataURL(file);
}


/* =========================
   SAVED PAPERS
========================= */

function getSavedPapers(){

  return readStorage("risenSavedPapers",[]);
}


function savePaper(){

  updatePaper();

  const paper = {

    id:editingPaperId || uid("paper"),

    schoolName:get("schoolName").value,

    examName:get("examName").value,

    paperClass:get("paperClass").value,

    subject:get("paperSubject").value,

    chapter:get("paperChapter").value,

    date:get("paperDate").value,

    time:get("paperTime").value,

    marks:get("paperMarks").value,

    studentName:get("studentName").value,

    rollNumber:get("rollNumber").value,

    section:get("section").value,

    teacherName:get("teacherName").value,

    mcqs:JSON.parse(JSON.stringify(mcqs)),
    shorts:JSON.parse(JSON.stringify(shorts)),
    longs:JSON.parse(JSON.stringify(longs)),
    fills:JSON.parse(JSON.stringify(fills)),
    tfs:JSON.parse(JSON.stringify(tfs)),

    logoData:logoData,

    savedAt:new Date().toISOString()

  };


  const list = getSavedPapers();

  const existing = list.findIndex(x=>x.id===paper.id);

  if(existing >= 0){

    list[existing] = paper;

  }else{

    list.unshift(paper);

  }


  if(writeStorage("risenSavedPapers",list)){

    editingPaperId = paper.id;

    renderSavedPapers();

    alert("Paper Saved Successfully");

  }

}


function openSavedPaper(id){

  const paper =
    getSavedPapers().find(x=>x.id===id);

  if(!paper) return;


  editingPaperId = paper.id;

  get("schoolName").value = paper.schoolName || "";
  get("examName").value = paper.examName || "";
  get("paperClass").value = paper.paperClass || CLASSES[0];
  get("paperSubject").value = paper.subject || "";
  get("paperChapter").value = paper.chapter || "";
  get("paperDate").value = paper.date || "";
  get("paperTime").value = paper.time || "";
  get("paperMarks").value = paper.marks || "";
  get("studentName").value = paper.studentName || "";
  get("rollNumber").value = paper.rollNumber || "";
  get("section").value = paper.section || "";
  get("teacherName").value = paper.teacherName || "Sir Rana Faisal";


  mcqs = JSON.parse(JSON.stringify(paper.mcqs || []));
  shorts = JSON.parse(JSON.stringify(paper.shorts || []));
  longs = JSON.parse(JSON.stringify(paper.longs || []));
  fills = JSON.parse(JSON.stringify(paper.fills || []));
  tfs = JSON.parse(JSON.stringify(paper.tfs || []));


  logoData = paper.logoData || "";

  if(logoData){

    get("headerLogo").src = logoData;
    get("headerLogo").classList.remove("hidden");
    get("logoPlaceholder").classList.add("hidden");

  }


  renderMCQs();
  renderShorts();
  renderLongs();
  renderFills();
  renderTFs();

  updatePaper();

  showTab("paper");
}


function deleteSavedPaper(id){

  if(!confirm("کیا آپ یہ Paper delete کرنا چاہتے ہیں؟"))
    return;

  const list =
    getSavedPapers().filter(x=>x.id!==id);

  writeStorage("risenSavedPapers",list);

  renderSavedPapers();
}

/* =========================
   SAVED NOTES
   FIXED
========================= */

function getSavedNotes(){

  return readStorage("risenSavedNotes",[]);
}


function saveNotes(){

  updateNotes();

  const notes = {

    id:editingNotesId || uid("notes"),

    school:get("notesSchool").value,

    notesClass:get("notesClass").value,

    subject:get("notesSubject").value,

    chapter:get("notesChapter").value,

    topic:get("notesTopic").value,

    blocks:JSON.parse(JSON.stringify(noteBlocks)),

    logoData:logoData,

    savedAt:new Date().toISOString()

  };


  const list = getSavedNotes();

  const existing =
    list.findIndex(x=>x.id===notes.id);


  if(existing >= 0){

    list[existing] = notes;

  }else{

    list.unshift(notes);

  }


  /*
    IMPORTANT FIX:
    Notes are stored in their own permanent
    localStorage key and immediately rendered
    in Saved Notes.
  */

  if(writeStorage("risenSavedNotes",list)){

    editingNotesId = notes.id;

    renderSavedNotes();

    alert("Notes Saved Successfully");

  }

}


function openSavedNotes(id){

  const notes =
    getSavedNotes().find(x=>x.id===id);

  if(!notes) return;


  editingNotesId = notes.id;


  get("notesSchool").value =
    notes.school || "The Risen High School";

  get("notesClass").value =
    notes.notesClass || CLASSES[0];

  get("notesSubject").value =
    notes.subject || "";

  get("notesChapter").value =
    notes.chapter || "";

  get("notesTopic").value =
    notes.topic || "";


  noteBlocks =
    JSON.parse(JSON.stringify(notes.blocks || []));


  renderNotesEditor();

  updateNotes();

  showTab("notes");
}


function deleteSavedNotes(id){

  if(!confirm("کیا آپ یہ Notes delete کرنا چاہتے ہیں؟"))
    return;


  const list =
    getSavedNotes().filter(x=>x.id!==id);


  if(writeStorage("risenSavedNotes",list)){

    if(editingNotesId===id){

      editingNotesId = null;

    }

    renderSavedNotes();

  }

}


function renderSavedNotes(){

  const box = get("savedNotes");

  const list = getSavedNotes();


  if(!list.length){

    box.innerHTML =
      `<div class="empty">ابھی کوئی Notes محفوظ نہیں ہیں۔</div>`;

    return;
  }


  box.innerHTML = list.map(n=>`

    <div class="saved-card">

      <div class="saved-info">

        <b>${escapeHTML(n.school)}</b>

        <br>

        ${escapeHTML(n.notesClass)}
        |
        ${escapeHTML(n.subject)}

        ${n.chapter
          ? `| ${escapeHTML(n.chapter)}`
          : ""
        }

        <br>

        <small>
          ${new Date(n.savedAt).toLocaleString()}
        </small>

      </div>

      <div class="saved-actions">

        <button
          class="btn btn-primary"
          onclick="openSavedNotes('${n.id}')">
          ✏ Open & Edit
        </button>

        <button
          class="btn btn-danger"
          onclick="deleteSavedNotes('${n.id}')">
          🗑 Delete
        </button>

      </div>

    </div>

  `).join("");
}

/* =========================

========================= */

function downloadPaper(){

  updatePaper();

  const element = get("paperPreview");

  if(typeof html2canvas==="undefined"){

    alert("Download library load نہیں ہوئی۔ Internet ON کریں۔");

    return;
  }


  html2canvas(element,{
    scale:2,
    useCORS:true,
    backgroundColor:"#ffffff"
  }).then(canvas=>{

    const a =
      document.createElement("a");

    a.download =
      "The-Risen-High-School-Paper.png";

    a.href =
      canvas.toDataURL("image/png");

    a.click();

  }).catch(error=>{

    console.error(error);

    alert("Paper download نہیں ہو سکا۔");

  });

}
