<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Risen High School - Paper & Notes Maker</title>

<style>
@font-face{
    font-family:Jameel;
    src:url("https://fonts.cdnfonts.com/s/74258/Jameel%20Noori%20Nastaleeq.woff");
}

:root{
    --primary:#1457d9;
    --primary2:#0b3d91;
    --secondary:#eef4ff;
    --success:#138a4b;
    --danger:#d93636;
    --warning:#e69b00;
    --dark:#172033;
    --muted:#6b7280;
    --white:#fff;
    --border:#d9e0eb;
    --bg:#f3f6fb;
    --paper:#fff;
    --shadow:0 8px 30px rgba(0,0,0,.08);
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--dark);
}

body{
    font-family:Jameel,"Noto Nastaliq Urdu",serif;
    min-height:100vh;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.topbar{
    background:linear-gradient(135deg,var(--primary2),var(--primary));
    color:white;
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:52px;
    height:52px;
    border-radius:50%;
    background:white;
    color:var(--primary);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:bold;
}

.brand h1{
    margin:0;
    font-size:24px;
}

.brand p{
    margin:0;
    font-size:15px;
}

.top-actions{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.btn{
    border:0;
    border-radius:8px;
    padding:9px 14px;
    font-size:15px;
    background:white;
    color:var(--primary2);
}

.btn:hover{
    opacity:.9;
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-success{
    background:var(--success);
    color:white;
}

.btn-danger{
    background:var(--danger);
    color:white;
}

.btn-dark{
    background:var(--dark);
    color:white;
}

.container{
    max-width:1450px;
    margin:auto;
    padding:18px;
}

.tabs{
    display:flex;
    gap:8px;
    margin-bottom:18px;
    flex-wrap:wrap;
}

.tab{
    border:1px solid var(--border);
    background:white;
    padding:11px 18px;
    border-radius:9px;
    font-size:17px;
}

.tab.active{
    background:var(--primary);
    color:white;
    border-color:var(--primary);
}

.grid{
    display:grid;
    grid-template-columns:430px 1fr;
    gap:18px;
    align-items:start;
}

.panel{
    background:white;
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
    box-shadow:var(--shadow);
}

.panel h2,
.panel h3{
    margin-top:0;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.field{
    margin-bottom:10px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    display:block;
    margin-bottom:4px;
    font-size:16px;
}

.field input,
.field select,
.field textarea{
    width:100%;
    border:1px solid var(--border);
    border-radius:7px;
    padding:9px 10px;
    font-size:15px;
    background:white;
}

.field textarea{
    min-height:80px;
    resize:vertical;
}

.editor-section{
    border:1px solid var(--border);
    border-radius:9px;
    margin-top:12px;
    padding:10px;
}

.editor-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
}

.editor-head h3{
    margin:0;
}

.question-card{
    border:1px solid var(--border);
    background:#fafcff;
    padding:10px;
    border-radius:8px;
    margin-top:10px;
}

.question-card textarea,
.question-card input{
    width:100%;
    margin-bottom:7px;
    border:1px solid var(--border);
    border-radius:6px;
    padding:8px;
}

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.option-row{
    display:flex;
    gap:5px;
    align-items:center;
}

.small-btn{
    padding:6px 9px;
    border:0;
    border-radius:6px;
    background:var(--danger);
    color:white;
}

.add-btn{
    background:var(--success);
    color:white;
    border:0;
    border-radius:7px;
    padding:7px 12px;
}

.preview-panel{
    position:sticky;
    top:85px;
}

.preview-tools{
    display:flex;
    justify-content:space-between;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
}

.paper-stage{
    background:#dfe5ef;
    padding:18px;
    border-radius:10px;
    overflow:auto;
}

.a4{
    width:210mm;
    min-height:297mm;
    margin:auto;
    background:white;
    padding:14mm;
    position:relative;
    box-shadow:0 5px 20px rgba(0,0,0,.16);
    color:#111;
}

.paper-header{
    border-bottom:2px solid #111;
    padding-bottom:7px;
    margin-bottom:10px;
}

.school-title{
    text-align:center;
    font-size:25px;
    font-weight:bold;
}

.paper-title{
    text-align:center;
    font-size:21px;
    margin-top:4px;
}

.paper-meta{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px 20px;
    font-size:16px;
}

.student-meta{
    border:1px solid #222;
    padding:6px;
    margin:8px 0;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px;
}

.section-title{
    background:#eef4ff;
    border:1px solid #333;
    padding:5px 8px;
    margin-top:12px;
    font-size:18px;
    font-weight:bold;
}

.mcq-item{
    margin:7px 0;
    font-size:16px;
}

.mcq-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:3px 20px;
    margin-right:25px;
}

.short-item,
.long-item,
.fill-item,
.tf-item{
    margin:9px 0;
    font-size:16px;
}

.answer-line{
    border-bottom:1px dotted #555;
    height:23px;
}

.paper-footer{
    position:absolute;
    bottom:8mm;
    left:14mm;
    right:14mm;
    border-top:1px solid #777;
    padding-top:4px;
    text-align:center;
    font-size:13px;
}

.notes-page{
    min-height:297mm;
}

.note-block{
    margin-bottom:12px;
}

.note-heading{
    background:#eef4ff;
    border-right:5px solid var(--primary);
    padding:5px 10px;
    font-size:20px;
    font-weight:bold;
}

.note-question{
    font-weight:bold;
    font-size:18px;
}

.note-answer{
    font-size:17px;
    line-height:2;
}

.note-definition{
    border:1px solid #aaa;
    padding:8px;
    background:#fafafa;
}

.note-points{
    line-height:2;
}

.saved-item{
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px;
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
    gap:8px;
    align-items:center;
}

.hidden{
    display:none!important;
}

.muted{
    color:var(--muted);
}

.empty{
    padding:20px;
    text-align:center;
    color:var(--muted);
}

/* =====================================================
   PRINT CSS
===================================================== */

@page{
    size:A4;
    margin:0;
}

@media print{

    html,
    body{
        width:210mm!important;
        margin:0!important;
        padding:0!important;
        background:white!important;
    }

    body *{
        visibility:hidden;
    }

    #printArea.print-target,
    #notesPrintArea.print-target,
    #printArea.print-target *,
    #notesPrintArea.print-target *{
        visibility:visible!important;
    }

    #printArea.print-target,
    #notesPrintArea.print-target{
        display:block!important;
        position:absolute!important;
        left:0!important;
        top:0!important;
        width:210mm!important;
        margin:0!important;
        padding:0!important;
    }

    #printArea.print-target .a4,
    #notesPrintArea.print-target .a4{
        width:210mm!important;
        min-height:297mm!important;
        margin:0!important;
        box-shadow:none!important;
    }

    .no-print{
        display:none!important;
    }
}

@media(max-width:900px){

    .grid{
        grid-template-columns:1fr;
    }

    .preview-panel{
        position:static;
    }

    .topbar{
        flex-direction:column;
        align-items:stretch;
    }

    .top-actions{
        justify-content:center;
    }
}

@media(max-width:600px){

    .container{
        padding:8px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .options{
        grid-template-columns:1fr;
    }

    .paper-stage{
        padding:5px;
    }

    .a4{
        transform-origin:top left;
    }

    .brand h1{
        font-size:20px;
    }
}
</style>
</head>

<body>

<header class="topbar no-print">

    <div class="brand">

        <div class="logo">R</div>

        <div>
            <h1>The Risen High School</h1>
            <p>Paper & Notes Maker</p>
        </div>

    </div>

    <div class="top-actions">

        <button class="btn btn-success" onclick="saveCurrent()">Save</button>

        <button class="btn" onclick="loadDraft()">Load</button>

        <button class="btn" onclick="showTab('saved')">Saved Papers</button>

        <button class="btn btn-danger" onclick="clearAll()">Clear</button>

        <button class="btn btn-dark" onclick="printDocument()">Print / PDF</button>

    </div>

</header>

<main class="container no-print">

    <div class="tabs">

        <button id="tabPaper" class="tab active" onclick="showTab('paper')">
            Paper Maker
        </button>

        <button id="tabNotes" class="tab" onclick="showTab('notes')">
            Notes Maker
        </button>

        <button id="tabSaved" class="tab" onclick="showTab('saved')">
            Saved Papers
        </button>

    </div>


    <!-- =================================================
         PAPER MAKER
    ================================================== -->

    <section id="paperTab">

        <div class="grid">

            <div class="panel">

                <h2>Paper Settings</h2>

                <div class="form-grid">

                    <div class="field full">
                        <label>School Name</label>
                        <input id="schoolName"
                        value="The Risen High School"
                        oninput="updatePaper()">
                    </div>

                    <div class="field">
                        <label>Exam / Test</label>
                        <input id="examName"
                        placeholder="Monthly Test"
                        oninput="updatePaper()">
                    </div>

                    <div class="field">
                        <label>Class</label>

                        <select id="paperClass" onchange="updatePaper()">

                            <option>Playgroup</option>
                            <option>Nursery</option>
                            <option>Prep</option>

                            <option>1st</option>
                            <option>2nd</option>
                            <option>3rd</option>
                            <option>4th</option>
                            <option>5th</option>
                            <option>6th</option>
                            <option>7th</option>
                            <option>8th</option>
                            <option>9th</option>
                            <option>10th</option>
                            <option>11th / FA Part 1</option>
                            <option>12th / FA Part 2</option>

                        </select>

                    </div>

                    <div class="field">
                        <label>Subject</label>
                        <input id="paperSubject"
                        placeholder="Physics"
                        oninput="updatePaper()">
                    </div>

                    <div class="field">
                        <label>Chapter / Unit</label>
                        <input id="paperChapter"
                        placeholder="Chapter 1"
                        oninput="updatePaper()">
                    </div>

                    <div class="field">
                        <label>Date</label>
                        <input id="paperDate"
                        type="date"
                        onchange="updatePaper()">
                    </div>

                    <div class="field">
                        <label>Time</label>
                        <input id="paperTime"
                        placeholder="2 Hours"
                        oninput="updatePaper()">
                    </div>

                    <div class="field">
                        <label>Total Marks</label>
                        <input id="totalMarks"
                        type="number"
                        value="50"
                        oninput="updatePaper()">
                    </div>

                    <div class="field">
                        <label>Student Name</label>
                        <input id="studentName"
                        oninput="updatePaper()">
                    </div>

                    <div class="field">
                        <label>Roll Number</label>
                        <input id="rollNumber"
                        oninput="updatePaper()">
                    </div>

                    <div class="field">
                        <label>Section</label>
                        <input id="sectionName"
                        oninput="updatePaper()">
                    </div>

                    <div class="field">
                        <label>Teacher</label>
                        <input id="teacherName"
                        value="Sir Rana Faisal"
                        oninput="updatePaper()">
                    </div>

                    <div class="field full">

                        <label>School Logo</label>

                        <input id="logoUpload"
                        type="file"
                        accept="image/*"
                        onchange="uploadLogo(event)">

                    </div>

                </div>


                <!-- MCQs -->

                <div class="editor-section">

                    <div class="editor-head">

                        <h3>MCQs</h3>

                        <button class="add-btn"
                        onclick="addMCQ()">
                            + Add MCQ
                        </button>

                    </div>

                    <div id="mcqEditor"></div>

                </div>


                <!-- Short -->

                <div class="editor-section">

                    <div class="editor-head">

                        <h3>Short Questions</h3>

                        <button class="add-btn"
                        onclick="addShort()">
                            + Add
                        </button>

                    </div>

                    <div id="shortEditor"></div>

                </div>


                <!-- Long -->

                <div class="editor-section">

                    <div class="editor-head">

                        <h3>Long Questions</h3>

                        <button class="add-btn"
                        onclick="addLong()">
                            + Add
                        </button>

                    </div>

                    <div id="longEditor"></div>

                </div>


                <!-- Fill -->

                <div class="editor-section">

                    <div class="editor-head">

                        <h3>Fill in the Blanks</h3>

                        <button class="add-btn"
                        onclick="addFill()">
                            + Add
                        </button>

                    </div>

                    <div id="fillEditor"></div>

                </div>


                <!-- True False -->

                <div class="editor-section">

                    <div class="editor-head">

                        <h3>True / False</h3>

                        <button class="add-btn"
                        onclick="addTF()">
                            + Add
                        </button>

                    </div>

                    <div id="tfEditor"></div>

                </div>

            </div>


            <!-- =================================================
                 PAPER PREVIEW
            ================================================== -->

            <div class="panel preview-panel">

                <div class="preview-tools">

                    <strong>Live Preview</strong>

                    <button class="btn btn-dark"
                    onclick="printDocument()">
                        Print / Save PDF
                    </button>

                </div>

                <div class="paper-stage">

                    <div id="printArea">

                        <div id="paperPreview"
                        class="a4">

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- =================================================
         NOTES MAKER
    ================================================== -->

    <section id="notesTab" class="hidden">

        <div class="grid">

            <div class="panel">

                <h2>Notes Maker</h2>

                <div class="field">
                    <label>School</label>

                    <input id="notesSchool"
                    value="The Risen High School"
                    oninput="updateNotes()">
                </div>

                <div class="form-grid">

                    <div class="field">

                        <label>Class</label>

                        <select id="notesClass"
                        onchange="updateNotes()">

                            <option>Playgroup</option>
                            <option>Nursery</option>
                            <option>Prep</option>
                            <option>1st</option>
                            <option>2nd</option>
                            <option>3rd</option>
                            <option>4th</option>
                            <option>5th</option>
                            <option>6th</option>
                            <option>7th</option>
                            <option>8th</option>
                            <option>9th</option>
                            <option>10th</option>
                            <option>11th / FA Part 1</option>
                            <option>12th / FA Part 2</option>

                        </select>

                    </div>

                    <div class="field">

                        <label>Subject</label>

                        <input id="notesSubject"
                        oninput="updateNotes()">

                    </div>

                    <div class="field full">

                        <label>Chapter</label>

                        <input id="notesChapter"
                        oninput="updateNotes()">

                    </div>

                    <div class="field full">

                        <label>Topic</label>

                        <input id="notesTopic"
                        oninput="updateNotes()">

                    </div>

                </div>

                <div class="editor-section">

                    <div class="editor-head">

                        <h3>Notes Blocks</h3>

                        <button class="add-btn"
                        onclick="addNoteBlock()">
                            + Add Block
                        </button>

                    </div>

                    <div id="notesEditor"></div>

                </div>

            </div>


            <div class="panel preview-panel">

                <div class="preview-tools">

                    <strong>Notes Preview</strong>

                    <button class="btn btn-dark"
                    onclick="printDocument()">
                        Print / Save PDF
                    </button>

                </div>

                <div class="paper-stage">

                    <div id="notesPrintArea">

                        <div id="notesPreview"
                        class="a4 notes-page">

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- =================================================
         SAVED
    ================================================== -->

    <section id="savedTab" class="hidden">

        <div class="panel">

            <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">

                <h2>Saved Papers & Notes</h2>

                <button class="btn btn-danger"
                onclick="deleteAllSaved()">
                    Delete All
                </button>

            </div>

            <div id="savedList"></div>

        </div>

    </section>

</main>


<script>

/* =====================================================
   GLOBAL DATA
===================================================== */

let mcqs = [];
let shorts = [];
let longs = [];
let fills = [];
let tfs = [];
let noteBlocks = [];

let currentTab = "paper";
let logoData = "";
let savedItems = [];


/* =====================================================
   HELPERS
===================================================== */

function get(id){
    return document.getElementById(id);
}

function escapeHTML(text){

    if(text === undefined || text === null){
        return "";
    }

    return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function nl2br(text){

    return escapeHTML(text)
    .replace(/\n/g,"<br>");
}


/* =====================================================
   TABS
===================================================== */

function showTab(tab){

    currentTab = tab;

    get("paperTab").classList.add("hidden");
    get("notesTab").classList.add("hidden");
    get("savedTab").classList.add("hidden");

    get("tabPaper").classList.remove("active");
    get("tabNotes").classList.remove("active");
    get("tabSaved").classList.remove("active");

    if(tab === "paper"){

        get("paperTab").classList.remove("hidden");
        get("tabPaper").classList.add("active");

        updatePaper();

    }

    else if(tab === "notes"){

        get("notesTab").classList.remove("hidden");
        get("tabNotes").classList.add("active");

        updateNotes();

    }

    else{

        get("savedTab").classList.remove("hidden");
        get("tabSaved").classList.add("active");

        renderSavedItems();

    }
}


/* =====================================================
   DATE
===================================================== */

function setToday(){

    const today = new Date();

    const yyyy = today.getFullYear();

    const mm = String(today.getMonth()+1)
        .padStart(2,"0");

    const dd = String(today.getDate())
        .padStart(2,"0");

    get("paperDate").value =
        yyyy + "-" + mm + "-" + dd;
}


/* =====================================================
   MCQs
===================================================== */

function addMCQ(){

    mcqs.push({
        q:"",
        a:"",
        b:"",
        c:"",
        d:"",
        answer:"A"
    });

    renderMCQs();
    updatePaper();
}

function removeMCQ(index){

    mcqs.splice(index,1);

    renderMCQs();
    updatePaper();
}

function renderMCQs(){

    const box = get("mcqEditor");

    box.innerHTML = "";

    mcqs.forEach((item,index)=>{

        box.innerHTML += `

        <div class="question-card">

            <textarea
            placeholder="MCQ Question"
            oninput="mcqs[${index}].q=this.value;updatePaper()">${escapeHTML(item.q)}</textarea>

            <div class="options">

                <input
                placeholder="A"
                value="${escapeHTML(item.a)}"
                oninput="mcqs[${index}].a=this.value;updatePaper()">

                <input
                placeholder="B"
                value="${escapeHTML(item.b)}"
                oninput="mcqs[${index}].b=this.value;updatePaper()">

                <input
                placeholder="C"
                value="${escapeHTML(item.c)}"
                oninput="mcqs[${index}].c=this.value;updatePaper()">

                <input
                placeholder="D"
                value="${escapeHTML(item.d)}"
                oninput="mcqs[${index}].d=this.value;updatePaper()">

            </div>

            <select
            onchange="mcqs[${index}].answer=this.value;updatePaper()">

                <option ${item.answer==="A"?"selected":""}>A</option>
                <option ${item.answer==="B"?"selected":""}>B</option>
                <option ${item.answer==="C"?"selected":""}>C</option>
                <option ${item.answer==="D"?"selected":""}>D</option>

            </select>

            <button class="small-btn"
            onclick="removeMCQ(${index})">
                Delete
            </button>

        </div>

        `;

    });
}


/* =====================================================
   SHORT QUESTIONS
===================================================== */

function addShort(){

    shorts.push({
        q:"",
        marks:""
    });

    renderShorts();
    updatePaper();
}

function removeShort(index){

    shorts.splice(index,1);

    renderShorts();
    updatePaper();
}

function renderShorts(){

    const box = get("shortEditor");

    box.innerHTML = "";

    shorts.forEach((item,index)=>{

        box.innerHTML += `

        <div class="question-card">

            <textarea
            placeholder="Short Question"
            oninput="shorts[${index}].q=this.value;updatePaper()">${escapeHTML(item.q)}</textarea>

            <input
            placeholder="Marks"
            value="${escapeHTML(item.marks)}"
            oninput="shorts[${index}].marks=this.value;updatePaper()">

            <button class="small-btn"
            onclick="removeShort(${index})">
                Delete
            </button>

        </div>

        `;

    });
}

function uploadLogo(event){

    const file = event.target.files[0];

    if(!file){
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e){

        logoData = e.target.result;

function collectData(){

    return {

        type:currentTab,

        schoolName:get("schoolName").value,
        examName:get("examName").value,
        paperClass:get("paperClass").value,
        paperSubject:get("paperSubject").value,

        paperTime:get("paperTime").value,

        sectionName:get("sectionName").value,
        teacherName:get("teacherName").value,

        notesSchool:get("notesSchool").value,

        notesSubject:get("notesSubject").value,
        notesChapter:get("notesChapter").value,
        notesTopic:get("notesTopic").value,

        mcqs:mcqs,
        shorts:shorts,

        fills:fills,
        tfs:tfs,

/* =====================================================
   APPLY DATA
===================================================== */

function applyData(data){

    if(!data){
        return;
    }

    const ids = [

        "schoolName",
        "examName",
        "paperClass",
        "paperSubject",
        "paperChapter",
        "paperDate",
        "paperTime",
        "totalMarks",
        "studentName",
        "rollNumber",
        "sectionName",
        "teacherName",
        "notesSchool",
        "notesClass",
        "notesSubject",
        "notesChapter",
        "notesTopic"

    ];

    ids.forEach(id=>{

        if(data[id] !== undefined && get(id)){
            get(id).value = data[id];
        }

    });


    mcqs = data.mcqs || [];
    shorts = data.shorts || [];
    longs = data.longs || [];
    fills = data.fills || [];
    tfs = data.tfs || [];
    noteBlocks = data.noteBlocks || [];

    logoData = data.logoData || "";


    renderMCQs();
    renderShorts();
    renderLongs();
    renderFills();
    renderTF();
    renderNotesEditor();

    updatePaper();
    updateNotes();
}


/* =====================================================
   DRAFT
===================================================== */

function saveDraft(){

    localStorage.setItem(
        "risenPaperDraft",
        JSON.stringify(collectData())
    );

}

function loadDraft(){

    const data =
        localStorage.getItem("risenPaperDraft");

    if(!data){

        alert("کوئی Draft محفوظ نہیں ہے۔");
        return;

    }

    try{

        applyData(JSON.parse(data));

        alert("Draft Load ہو گیا ہے۔");

    }catch(e){

        alert("Draft Load نہیں ہو سکا۔");

    }

}


/* =====================================================
   SAVED ITEMS
===================================================== */

function getSavedItems(){

    try{

        return JSON.parse(
            localStorage.getItem("risenSavedItems") || "[]"
        );

    }catch(e){

        return [];

    }
}

function saveSavedItems(){

    localStorage.setItem(
        "risenSavedItems",
        JSON.stringify(savedItems)
    );

}

function saveCurrent(){

    const name =
        prompt(
            "Paper / Notes کا نام لکھیں:",
            currentTab==="notes"
            ? "My Notes"
            : "My Paper"
        );

    if(!name){
        return;
    }

    const data = collectData();

    data.savedName = name;
    data.savedAt = new Date().toLocaleString();

    savedItems = getSavedItems();

    savedItems.unshift(data);

    saveSavedItems();
    saveDraft();

    alert("Successfully Saved!");

    renderSavedItems();
}

function loadSavedItem(index){

    const item = savedItems[index];

    applyData(item);

    if(item.type === "notes"){
        showTab("notes");
    }else{
        showTab("paper");
    }

}

function deleteSavedItem(index){

    if(!confirm("کیا آپ اسے Delete کرنا چاہتے ہیں؟")){
        return;
    }

    savedItems.splice(index,1);

    saveSavedItems();

    renderSavedItems();
}

function deleteAllSaved(){

    if(!confirm("تمام Saved Papers/Notes Delete کریں؟")){
        return;
    }

    savedItems = [];

    saveSavedItems();

    renderSavedItems();
}

function renderSavedItems(){

    savedItems = getSavedItems();

    const box = get("savedList");

    if(!savedItems.length){

        box.innerHTML = `
            <div class="empty">
                ابھی کوئی Paper یا Notes محفوظ نہیں ہیں۔
            </div>
        `;

        return;
    }

    box.innerHTML = "";

    savedItems.forEach((item,index)=>{

        box.innerHTML += `

        <div class="saved-item">

            <div>

                <strong>
                    ${escapeHTML(
                        item.savedName ||
                        "Untitled"
                    )}
                </strong>

                <div class="muted">

                    ${
                        item.type==="notes"
                        ? "Notes"
                        : "Paper"
                    }

                    ${
                        item.savedAt
                        ?
                        " — " + escapeHTML(item.savedAt)
                        :
                        ""
                    }

                </div>

            </div>

            <div>

                <button
                class="btn btn-primary"
                onclick="loadSavedItem(${index})">
                    Load
                </button>

                <button
                class="btn btn-danger"
                onclick="deleteSavedItem(${index})">
                    Delete
                </button>

            </div>

        </div>

        `;

    });
}

/* =====================================================
   ★★★ FIXED PRINT / PDF FUNCTION ★★★
   
   اصل مسئلہ:
   printArea ایک ایسے parent کے اندر تھا جس پر
   .no-print { display:none } لگ رہا تھا۔
   
   اب ہم preview کو ایک نئی Print Window میں
   براہ راست منتقل کر رہے ہیں۔
===================================================== */

function printDocument(){

    /* Preview پہلے update کریں */

    updatePaper();
    updateNotes();


    /* موجودہ tab کے مطابق صرف مطلوبہ A4 حاصل کریں */

    let content = "";

    let title = "The Risen High School";


    if(currentTab === "notes"){

        content =
            get("notesPreview").outerHTML;

        title =
            "The Risen High School - Notes";

    }else{

        content =
            get("paperPreview").outerHTML;

        title =
            "The Risen High School - Paper";

    }


    /* اگر content نہ ہو */

    if(!content || content.trim() === ""){

        alert(
            "Print کرنے کے لیے کوئی content موجود نہیں ہے۔"
        );

        return;
    }


    /*
       تمام موجودہ CSS حاصل کریں۔
       اس سے Paper کا اصل design بھی print window
       میں برقرار رہے گا۔
    */

    let css = "";

    document
        .querySelectorAll("style")
        .forEach(function(style){

            css += style.innerHTML;

        });


    /*
       نئی window کھولیں
    */

    const printWindow = window.open(
        "",
        "_blank",
        "width=900,height=1200"
    );


    /*
       اگر browser نے popup block کیا
    */

    if(!printWindow){

        alert(
            "Print Window نہیں کھل سکی۔ Browser میں Pop-up کی اجازت دیں۔"
        );

        return;
    }


    /*
       نئی document تیار کریں
    */

    printWindow.document.open();

    printWindow.document.write(`

<!DOCTYPE html>

<html lang="ur" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
${escapeHTML(title)}
</title>

<style>

/* Original CSS */

${css}


/* =====================================================
   PRINT WINDOW FIX
===================================================== */

html,
body{

    width:210mm !important;

    min-width:210mm !important;

    margin:0 !important;

    padding:0 !important;

    background:#ffffff !important;

}

body{

    direction:rtl !important;

    color:#111 !important;

}


/*
   Original print CSS میں body * visibility hidden
   ہو سکتا ہے، اس لیے یہاں آخر میں visible کر رہے ہیں۔
*/

.a4,
.a4 *{

    visibility:visible !important;

}


/* A4 */

.a4{

    display:block !important;

    visibility:visible !important;

    width:210mm !important;

    min-width:210mm !important;

    min-height:297mm !important;

    margin:0 !important;

    padding:14mm !important;

    background:#ffffff !important;

    box-shadow:none !important;

    position:relative !important;

    overflow:visible !important;

}


/* Footer */

.paper-footer{

    position:absolute !important;

}


/* A4 Page */

@page{

    size:A4;

    margin:0;

}


/* Print */

@media print{

    html,
    body{

        width:210mm !important;

        min-width:210mm !important;

        margin:0 !important;

        padding:0 !important;

        background:#ffffff !important;

    }


    .a4{

        width:210mm !important;

        min-width:210mm !important;

        min-height:297mm !important;

        margin:0 !important;

        box-shadow:none !important;

        visibility:visible !important;

    }


    .a4 *{

        visibility:visible !important;

    }

}

</style>

</head>


<body>

${content}


<script>

window.onload = function(){

    setTimeout(function(){

        window.focus();

        window.print();

    },1000);

};


window.onafterprint = function(){

    setTimeout(function(){

        window.close();

/* =====================================================
   KEYBOARD SHORTCUT
===================================================== */

document.addEventListener(
    "keydown",
    function(e){

        if(
            (e.ctrlKey || e.metaKey)
            &&
            e.key.toLowerCase() === "s"
        ){

            e.preventDefault();

            saveCurrent();

        }

    }
);

        savedItems = getSavedItems();

        renderShorts();
        renderLongs();
        renderFills();
        renderTF();
        renderNotesEditor();

        updatePaper();
        updateNotes();

    }
);


/*
   پرانا afterprint listener اگر موجود ہو تو
   نئی Print Window پر اثر نہیں ڈالے گا۔
*/

window.addEventListener(
    "afterprint",
    function(){

        if(get("printArea")){
            get("printArea")
            .classList.remove("print-target");
        }

        if(get("notesPrintArea")){
            get("notesPrintArea")
            .classList.remove("print-target");
        }

    }
);
